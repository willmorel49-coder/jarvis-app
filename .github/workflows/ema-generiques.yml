name: Anticipation · génériques & biosimilaires en approche (EMA)

# Robot GRATUIT : lit le fichier quotidien de l'Agence européenne du médicament (EMA) et
# en extrait les generiques/biosimilaires autorises ou en pipeline au niveau UE, restreints
# aux molecules (DCI) du catalogue reseau. Signal « preparer la bascule » 6-18 mois avant.
# Ecrit crm/v2/ema-generiques.json. Aucune cle, aucun cout.

on:
  schedule:
    - cron: '44 6 * * 1'   # chaque lundi (le fichier EMA bouge lentement)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ema-generiques
  cancel-in-progress: false

jobs:
  ema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer openpyxl
        run: pip install --quiet openpyxl
      - name: Extraire les génériques/biosimilaires EMA
        run: python3 generate_ema_generiques.py
      - name: Committer si changement
        run: |
          if git diff --quiet -- crm/v2/ema-generiques.json; then
            echo "Pas de changement."
          else
            git config user.name  "JARVIS copilote"
            git config user.email "actions@users.noreplace.github.com"
            git add crm/v2/ema-generiques.json
            git commit -m "data(anticipation): génériques/biosimilaires EMA $(date -u +%Y-%m-%d)"
            # 24 robots poussent sur le meme depot et GitHub livre leurs executions
            # planifiees en paquet : une seule reprise ne suffit pas (le 03/08, ansm-dispo,
            # has et nouveautes ont perdu leur journee). On retente, en se remettant a jour
            # sur la branche courante, et on echoue BRUYAMMENT si tout est refuse.
            pousse=0
            for essai in 1 2 3 4 5; do
              if git push; then pousse=1; break; fi
              echo "push refuse (tentative $essai/5) — un autre robot est passe, rattrapage"
              git pull --rebase --autostash origin "$GITHUB_REF_NAME" || exit 1
              sleep $(( essai * 5 + RANDOM % 10 ))
            done
            [ "$pousse" = 1 ] || { echo "ECHEC : 5 tentatives de push refusees"; exit 1; }
          fi
