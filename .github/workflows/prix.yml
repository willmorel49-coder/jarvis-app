name: Prix · baisses de prix officielles (BDPM)

# Robot GRATUIT : suit le prix public officiel (BDPM CIS_CIP) des références du catalogue
# réseau et détecte, par diff avec son propre instantané (prix-snapshot.json), les produits
# dont le prix a BAISSÉ. Un prix qui baisse = stock qui se dévalorise → signal d'achat.
# Écrit crm/v2/prix.json (servi à l'app) + crm/v2/prix-snapshot.json (baseline du prochain diff).
# Aucune clé, aucun coût.

on:
  schedule:
    - cron: '33 5 * * *'   # tous les jours (les révisions tarifaires CEPS tombent souvent le 1er)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prix
  cancel-in-progress: false

jobs:
  prix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Détecter les baisses de prix
        run: python3 generate_prix.py
      - name: Committer si changement
        run: |
          # ⚠️ l'archive est la SEULE copie des évènements sortis de la fenêtre glissante
          # de la source : elle DOIT être commitée. On indexe d'abord — `git diff` seul
          # ne voit pas un fichier encore non suivi — puis on juge sur ce qui est indexé.
          git config user.name  "JARVIS copilote"
          git config user.email "actions@users.noreplace.github.com"
          git add crm/v2/prix.json crm/v2/prix-snapshot.json crm/v2/prix-archive.json
          if git diff --cached --quiet; then
            echo "Pas de changement (prix BDPM inchangés)."
          else
            git commit -m "data(prix): baisses de prix officielles BDPM $(date -u +%Y-%m-%d)"
            # 24 robots poussent sur le meme depot et GitHub livre leurs executions
            # planifiees en paquet : une seule reprise ne suffit pas (le 03/08, ansm-dispo,
            # has et nouveautes ont perdu leur journee). On retente, en se remettant a jour
            # sur la branche courante, et on echoue BRUYAMMENT si tout est refuse.
            pousse=0
            for essai in 1 2 3 4 5; do
              if git push; then pousse=1; break; fi
              echo "push refuse (tentative $essai/5) — un autre robot est passe, rattrapage"
              git pull --rebase --autostash origin "$GITHUB_REF_NAME" || exit 1
              sleep $(( essai * 5 + RANDOM % 10 ))
            done
            [ "$pousse" = 1 ] || { echo "ECHEC : 5 tentatives de push refusees"; exit 1; }
          fi
