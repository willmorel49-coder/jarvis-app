name: Veille appro · saison produit (Medic'AM)

# Robot GRATUIT : reconstruit la saisonnalité PAR PRODUIT à partir de Medic'AM
# (Assurance Maladie, boîtes remboursées par CIP13 et par mois, 2 années pleines).
# Indice mensuel par produit → « pré-commander avant le pic historique ».
# Écrit crm/v2/saison-cip.json (restreint au catalogue). Aucune clé, aucun coût.

on:
  schedule:
    - cron: '27 4 5 * *'   # le 5 de chaque mois (Medic'AM publié mensuellement)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: medicam-saison
  cancel-in-progress: false

jobs:
  saison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les dépendances
        run: pip install xlrd
      - name: Recalculer la saison produit
        run: python3 generate_medicam_saison.py
      - name: Committer si changement
        run: |
          if git diff --quiet -- crm/v2/saison-cip.json; then
            echo "Pas de changement (Medic'AM inchangé)."
          else
            git config user.name  "JARVIS copilote"
            git config user.email "actions@users.noreplace.github.com"
            git add crm/v2/saison-cip.json
            git commit -m "data(veille): saison produit Medic'AM $(date -u +%Y-%m-%d)"
            # 24 robots poussent sur le meme depot et GitHub livre leurs executions
            # planifiees en paquet : une seule reprise ne suffit pas (le 03/08, ansm-dispo,
            # has et nouveautes ont perdu leur journee). On retente, en se remettant a jour
            # sur la branche courante, et on echoue BRUYAMMENT si tout est refuse.
            pousse=0
            for essai in 1 2 3 4 5; do
              if git push; then pousse=1; break; fi
              echo "push refuse (tentative $essai/5) — un autre robot est passe, rattrapage"
              git pull --rebase --autostash origin "$GITHUB_REF_NAME" || exit 1
              sleep $(( essai * 5 + RANDOM % 10 ))
            done
            [ "$pousse" = 1 ] || { echo "ECHEC : 5 tentatives de push refusees"; exit 1; }
          fi
