name: Anticipation · futures baisses de prix (CEPS / JO)

# Robot GRATUIT : lit les avis CEPS publiés au Journal Officiel (dumps ouverts DILA
# JORFSIMPLE) et en extrait les NOUVEAUX prix (PFHT + PPTTC) des spécialités avec leur
# DATE D'EFFET — souvent 4 a 20 jours a l'avance. Le vrai signal « destocker avant que ca
# baisse ». Compare au dernier prix connu (prix-snapshot.json) pour marquer baisse/hausse.
# Ecrit crm/v2/prix-futurs.json. Aucune cle, aucun cout.

on:
  schedule:
    - cron: '38 6 * * *'   # tous les jours (le JO parait chaque jour)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prix-futurs
  cancel-in-progress: false

jobs:
  prix-futurs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extraire les avis de prix CEPS du JO
        run: python3 generate_prix_futurs.py
      - name: Committer si changement
        run: |
          # ⚠️ l'archive est la SEULE copie des évènements sortis de la fenêtre glissante
          # de la source : elle DOIT être commitée. On indexe d'abord — `git diff` seul
          # ne voit pas un fichier encore non suivi — puis on juge sur ce qui est indexé.
          git config user.name  "JARVIS copilote"
          git config user.email "actions@users.noreplace.github.com"
          git add crm/v2/prix-futurs.json crm/v2/prix-futurs-archive.json
          if git diff --cached --quiet; then
            echo "Pas de changement."
          else
            git commit -m "data(anticipation): futures baisses de prix CEPS/JO $(date -u +%Y-%m-%d)"
            # 24 robots poussent sur le meme depot et GitHub livre leurs executions
            # planifiees en paquet : une seule reprise ne suffit pas (le 03/08, ansm-dispo,
            # has et nouveautes ont perdu leur journee). On retente, en se remettant a jour
            # sur la branche courante, et on echoue BRUYAMMENT si tout est refuse.
            pousse=0
            for essai in 1 2 3 4 5; do
              if git push; then pousse=1; break; fi
              echo "push refuse (tentative $essai/5) — un autre robot est passe, rattrapage"
              git pull --rebase --autostash origin "$GITHUB_REF_NAME" || exit 1
              sleep $(( essai * 5 + RANDOM % 10 ))
            done
            [ "$pousse" = 1 ] || { echo "ECHEC : 5 tentatives de push refusees"; exit 1; }
          fi
