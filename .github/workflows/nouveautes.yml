name: Copilote · nouveautés BDPM

# Robot GRATUIT : récupère la date d'AMM par produit depuis la Base de Données
# Publique des Médicaments (BDPM, ANSM) et recalcule crm/v2/nouveautes-data.js
# (produits d'AMM récente + commercialisés). Le Copilote en tire « nouveautés à ne
# pas rater ». Aucune clé, aucun coût. Déclenchable à la main.

on:
  schedule:
    - cron: '41 5 3 * *'   # le 3 de chaque mois (la BDPM bouge ~1x/mois)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nouveautes
  cancel-in-progress: false

jobs:
  nouveautes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recalculer les nouveautés
        run: python3 generate_nouveautes.py
      - name: Committer si changement
        run: |
          if git diff --quiet -- crm/v2/nouveautes-data.js; then
            echo "Pas de changement (BDPM inchangée)."
          else
            git config user.name  "JARVIS copilote"
            git config user.email "actions@users.noreplace.github.com"
            git add crm/v2/nouveautes-data.js
            git commit -m "data(copilote): nouveautés BDPM $(date -u +%Y-%m-%d)"
            # 24 robots poussent sur le meme depot et GitHub livre leurs executions
            # planifiees en paquet : une seule reprise ne suffit pas (le 03/08, ansm-dispo,
            # has et nouveautes ont perdu leur journee). On retente, en se remettant a jour
            # sur la branche courante, et on echoue BRUYAMMENT si tout est refuse.
            pousse=0
            for essai in 1 2 3 4 5; do
              if git push; then pousse=1; break; fi
              echo "push refuse (tentative $essai/5) — un autre robot est passe, rattrapage"
              git pull --rebase --autostash origin "$GITHUB_REF_NAME" || exit 1
              sleep $(( essai * 5 + RANDOM % 10 ))
            done
            [ "$pousse" = 1 ] || { echo "ECHEC : 5 tentatives de push refusees"; exit 1; }
          fi
