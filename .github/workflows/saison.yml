name: Copilote · saisonnalité

on:
  schedule:
    - cron: '47 4 6 * *'   # le 6 du mois (Medic'AM mensuel)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: saison
  cancel-in-progress: false

jobs:
  saison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install xlrd
      - run: python3 generate_saison.py
      - name: Committer si changement
        run: |
          if git diff --quiet -- crm/v2/saison-data.js; then
            echo "Pas de changement."
          else
            git config user.name  "JARVIS copilote"
            git config user.email "actions@users.noreplace.github.com"
            git add crm/v2/saison-data.js
            git commit -m "data(copilote): saisonnalité $(date -u +%Y-%m-%d)"
            # 24 robots poussent sur le meme depot. On ne se rattrape QUE si le push
            # echoue (collision), et sur la branche courante — pas sur « main » en dur.
            git push || {
              echo 'push refuse : un autre robot est passe avant, rattrapage'
              git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push
            }
          fi
