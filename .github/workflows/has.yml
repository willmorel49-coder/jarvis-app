name: Veille appro · anticipation HAS (remboursement)

# Robot GRATUIT : avis de la Commission de la Transparence (HAS) via les CSV ouverts
# data.gouv « Évaluation des médicaments ». Un avis favorable (ASMR I-IV) précède
# l'inscription au remboursement de 3-6 mois = le signal « prochain Wegovy ».
# Écrit crm/v2/has-avis.json (+ snapshot pour le diff mensuel). Aucune clé, aucun coût.

on:
  schedule:
    - cron: '33 5 3 * *'   # le 3 de chaque mois (les CSV HAS sont mensuels)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: has-avis
  cancel-in-progress: false

jobs:
  has:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recalculer les avis HAS
        run: python3 generate_has.py
      - name: Committer si changement
        run: |
          if git diff --quiet -- crm/v2/has-avis.json crm/v2/_has_snapshot.json; then
            echo "Pas de changement (avis HAS inchangés)."
          else
            git config user.name  "JARVIS copilote"
            git config user.email "actions@users.noreplace.github.com"
            git add crm/v2/has-avis.json crm/v2/_has_snapshot.json
            git commit -m "data(veille): avis HAS $(date -u +%Y-%m-%d)"
            # 24 robots poussent sur le meme depot et GitHub livre leurs executions
            # planifiees en paquet : une seule reprise ne suffit pas (le 03/08, ansm-dispo,
            # has et nouveautes ont perdu leur journee). On retente, en se remettant a jour
            # sur la branche courante, et on echoue BRUYAMMENT si tout est refuse.
            pousse=0
            for essai in 1 2 3 4 5; do
              if git push; then pousse=1; break; fi
              echo "push refuse (tentative $essai/5) — un autre robot est passe, rattrapage"
              git pull --rebase --autostash origin "$GITHUB_REF_NAME" || exit 1
              sleep $(( essai * 5 + RANDOM % 10 ))
            done
            [ "$pousse" = 1 ] || { echo "ECHEC : 5 tentatives de push refusees"; exit 1; }
          fi
