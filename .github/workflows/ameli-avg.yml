name: Copilote · marché France (Ameli)

# Robot GRATUIT : télécharge Medic'AM (Assurance Maladie), recalcule la moyenne de
# boîtes remboursées par pharmacie et par produit sur 12 mois glissants, et committe
# crm/v2/ameli-avg-data.js que le CRM lit. Medic'AM se met à jour ~tous les mois/semestres.
# Aucune clé, aucun coût. Déclenchable aussi à la main (workflow_dispatch).

on:
  schedule:
    # 1x/mois (le 3, à une minute non-ronde). Medic'AM ne bouge pas plus souvent.
    - cron: '41 4 3 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ameli-avg
  cancel-in-progress: false

jobs:
  ameli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les dépendances
        run: pip install xlrd
      - name: Recalculer le marché France
        run: python3 generate_ameli_avg.py
      - name: Committer si changement
        run: |
          if git diff --quiet -- crm/v2/ameli-avg-data.js; then
            echo "Pas de changement (Medic'AM inchangé)."
          else
            git config user.name  "JARVIS copilote"
            git config user.email "actions@users.noreplace.github.com"
            git add crm/v2/ameli-avg-data.js
            git commit -m "data(copilote): marché France Ameli $(date -u +%Y-%m-%d)"
            # 24 robots poussent sur le meme depot et GitHub livre leurs executions
            # planifiees en paquet : une seule reprise ne suffit pas (le 03/08, ansm-dispo,
            # has et nouveautes ont perdu leur journee). On retente, en se remettant a jour
            # sur la branche courante, et on echoue BRUYAMMENT si tout est refuse.
            pousse=0
            for essai in 1 2 3 4 5; do
              if git push; then pousse=1; break; fi
              echo "push refuse (tentative $essai/5) — un autre robot est passe, rattrapage"
              git pull --rebase --autostash origin "$GITHUB_REF_NAME" || exit 1
              sleep $(( essai * 5 + RANDOM % 10 ))
            done
            [ "$pousse" = 1 ] || { echo "ECHEC : 5 tentatives de push refusees"; exit 1; }
          fi
