name: Veille appro · génériques BDPM

# Robot GRATUIT : télécharge la base médicaments (BDPM/ANSM, miroir betagouv),
# détecte les groupes génériques et les princeps qui ont un générique dispo,
# et signale par diff mensuel les NOUVEAUX groupes génériques (falaise de brevet
# en pratique). Écrit crm/v2/generiques-bdpm.json (+ snapshot). Aucune clé, aucun coût.

on:
  schedule:
    - cron: '23 5 2 * *'   # le 2 de chaque mois (BDPM publie ~1x/mois)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generiques-bdpm
  cancel-in-progress: false

jobs:
  generiques:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recalculer la veille génériques
        run: python3 generate_generiques_bdpm.py
      - name: Committer si changement
        run: |
          if git diff --quiet -- crm/v2/generiques-bdpm.json crm/v2/_gener_snapshot.json; then
            echo "Pas de changement (base génériques inchangée)."
          else
            git config user.name  "JARVIS copilote"
            git config user.email "actions@users.noreplace.github.com"
            git add crm/v2/generiques-bdpm.json crm/v2/_gener_snapshot.json
            git commit -m "data(veille): génériques BDPM $(date -u +%Y-%m-%d)"
            # 24 robots poussent sur le meme depot et GitHub livre leurs executions
            # planifiees en paquet : une seule reprise ne suffit pas (le 03/08, ansm-dispo,
            # has et nouveautes ont perdu leur journee). On retente, en se remettant a jour
            # sur la branche courante, et on echoue BRUYAMMENT si tout est refuse.
            pousse=0
            for essai in 1 2 3 4 5; do
              if git push; then pousse=1; break; fi
              echo "push refuse (tentative $essai/5) — un autre robot est passe, rattrapage"
              git pull --rebase --autostash origin "$GITHUB_REF_NAME" || exit 1
              sleep $(( essai * 5 + RANDOM % 10 ))
            done
            [ "$pousse" = 1 ] || { echo "ECHEC : 5 tentatives de push refusees"; exit 1; }
          fi
