name: Reprises récentes (FINESS+)

# Robot GRATUIT : télécharge le flux FINESS+ (ANS) des établissements, détecte les
# officines dont l'entité juridique a changé (= reprise/rachat récent) et committe
# crm/v2/reprises.json (badge « Reprise récente » sur la fiche + la carte).
# Aucune clé, aucun coût. Mensuel (FINESS+ est actualisé ~mensuellement).

on:
  schedule:
    - cron: '41 4 3 * *'    # le 3 de chaque mois ~06h41 Paris (minute non-ronde = plus fiable)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reprises
  cancel-in-progress: false

jobs:
  reprises:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Détecter les reprises (diff entité juridique FINESS+)
        run: python3 generate_reprises.py
      - name: Committer si changement
        run: |
          if git diff --quiet -- crm/v2/reprises.json crm/v2/_finess_ej_snapshot.json; then
            echo "Pas de changement."
          else
            git config user.name  "JARVIS reprises"
            git config user.email "actions@users.noreplace.github.com"
            git add crm/v2/reprises.json crm/v2/_finess_ej_snapshot.json
            git commit -m "data(reprises): diff FINESS+ $(date -u +%Y-%m-%d)"
            # 24 robots poussent sur le meme depot et GitHub livre leurs executions
            # planifiees en paquet : une seule reprise ne suffit pas (le 03/08, ansm-dispo,
            # has et nouveautes ont perdu leur journee). On retente, en se remettant a jour
            # sur la branche courante, et on echoue BRUYAMMENT si tout est refuse.
            pousse=0
            for essai in 1 2 3 4 5; do
              if git push; then pousse=1; break; fi
              echo "push refuse (tentative $essai/5) — un autre robot est passe, rattrapage"
              git pull --rebase --autostash origin "$GITHUB_REF_NAME" || exit 1
              sleep $(( essai * 5 + RANDOM % 10 ))
            done
            [ "$pousse" = 1 ] || { echo "ECHEC : 5 tentatives de push refusees"; exit 1; }
          fi
