name: Agences des concurrents (carte du secteur)

# Robot GRATUIT, MENSUEL : lit le registre officiel des entreprises et committe
# crm/v2/concurrents-implantations.json, que « Infos du jour » lit pour la carte
# des agences concurrentes. Aucune clé, aucun coût. Déclenchable aussi à la main.

on:
  schedule:
    # Cron GitHub "best effort" -> minutes non-rondes + filet de sécurité.
    - cron: '23 5 3 * *'    # le 3 de chaque mois, ~07h23 Paris (été)
    - cron: '47 12 4 * *'   # le 4, ~14h47 Paris — filet si le 3 est sauté
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: concurrents-implantations
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Lire les agences
        run: python3 generate_concurrents_implantations.py
      - name: Committer si changement
        run: |
          if git diff --quiet -- crm/v2/concurrents-implantations.json; then
            echo "Pas de changement."
          else
            git config user.name  "JARVIS veille"
            git config user.email "actions@users.noreplace.github.com"
            git add crm/v2/concurrents-implantations.json
            git commit -m "data(concurrents): agences du $(date -u +%Y-%m-%d)"
            # 24 robots poussent sur le meme depot et GitHub livre leurs executions
            # planifiees en paquet : une seule reprise ne suffit pas. On retente, en
            # se remettant a jour sur la branche courante, et on echoue BRUYAMMENT
            # si tout est refuse.
            pousse=0
            for essai in 1 2 3 4 5; do
              if git push; then pousse=1; break; fi
              echo "push refuse (tentative $essai/5) — un autre robot est passe, rattrapage"
              git pull --rebase --autostash origin "$GITHUB_REF_NAME" || exit 1
              sleep $(( essai * 5 + RANDOM % 10 ))
            done
            [ "$pousse" = 1 ] || { echo "ECHEC : 5 tentatives de push refusees"; exit 1; }
          fi
