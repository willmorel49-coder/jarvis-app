name: Veille appro · médicaments critiques (MITM)

# Robot GRATUIT : liste ANSM des Médicaments d'Intérêt Thérapeutique Majeur (BDPM
# CIS_MITM) → mappés en CIP13 (via CIS_CIP). Une rupture sur un MITM = priorité max.
# Écrit crm/v2/mitm.json (restreint au catalogue). Aucune clé, aucun coût.

on:
  schedule:
    - cron: '19 4 4 * *'   # le 4 de chaque mois
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mitm
  cancel-in-progress: false

jobs:
  mitm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recalculer la liste MITM
        run: python3 generate_mitm.py
      - name: Committer si changement
        run: |
          if git diff --quiet -- crm/v2/mitm.json; then
            echo "Pas de changement (liste MITM inchangée)."
          else
            git config user.name  "JARVIS copilote"
            git config user.email "actions@users.noreplace.github.com"
            git add crm/v2/mitm.json
            git commit -m "data(veille): MITM $(date -u +%Y-%m-%d)"
            # 24 robots poussent sur le meme depot : sans rattrapage, celui qui arrive
            # second perd sa journee (vecu par « nouveautes » le 2026-08-03).
            git pull --rebase --autostash origin main
            git push
          fi
