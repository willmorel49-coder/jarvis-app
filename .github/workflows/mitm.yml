name: Veille appro · médicaments critiques (MITM)

# Robot GRATUIT : liste ANSM des Médicaments d'Intérêt Thérapeutique Majeur (BDPM
# CIS_MITM) → mappés en CIP13 (via CIS_CIP). Une rupture sur un MITM = priorité max.
# Écrit crm/v2/mitm.json (restreint au catalogue). Aucune clé, aucun coût.

on:
  schedule:
    - cron: '19 4 4 * *'   # le 4 de chaque mois
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mitm
  cancel-in-progress: false

jobs:
  mitm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recalculer la liste MITM
        run: python3 generate_mitm.py
      - name: Committer si changement
        run: |
          if git diff --quiet -- crm/v2/mitm.json; then
            echo "Pas de changement (liste MITM inchangée)."
          else
            git config user.name  "JARVIS copilote"
            git config user.email "actions@users.noreplace.github.com"
            git add crm/v2/mitm.json
            git commit -m "data(veille): MITM $(date -u +%Y-%m-%d)"
            # 24 robots poussent sur le meme depot et GitHub livre leurs executions
            # planifiees en paquet : une seule reprise ne suffit pas (le 03/08, ansm-dispo,
            # has et nouveautes ont perdu leur journee). On retente, en se remettant a jour
            # sur la branche courante, et on echoue BRUYAMMENT si tout est refuse.
            pousse=0
            for essai in 1 2 3 4 5; do
              if git push; then pousse=1; break; fi
              echo "push refuse (tentative $essai/5) — un autre robot est passe, rattrapage"
              git pull --rebase --autostash origin "$GITHUB_REF_NAME" || exit 1
              sleep $(( essai * 5 + RANDOM % 10 ))
            done
            [ "$pousse" = 1 ] || { echo "ECHEC : 5 tentatives de push refusees"; exit 1; }
          fi
