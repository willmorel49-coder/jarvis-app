name: Infos du matin (veille)

# Robot GRATUIT : agrège chaque matin les flux RSS (ANSM ruptures/sécurité/actu +
# Le Moniteur des pharmacies) et committe crm/v2/infos-jour.json que l'app CRM lit.
# Aucune clé, aucun coût. Déclenchable aussi à la main (workflow_dispatch).

on:
  schedule:
    # Le cron GitHub est "best effort" (souvent retardé/sauté aux heures rondes) -> minutes
    # non-rondes + 2 passages/jour (matin + midi) pour fiabiliser la mise à jour quotidienne.
    - cron: '23 5 * * *'    # ~07h23 Paris (été)
    - cron: '17 10 * * *'   # ~12h17 Paris — filet de sécurité si le matin est sauté
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: infos-matin
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Générer la veille
        run: python3 generate_infos.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # optionnel : synthèse IA si la clé existe, sinon récap calculé
      - name: Committer si changement
        run: |
          if git diff --quiet -- crm/v2/infos-jour.json; then
            echo "Pas de changement."
          else
            git config user.name  "JARVIS veille"
            git config user.email "actions@users.noreplace.github.com"
            git add crm/v2/infos-jour.json
            git commit -m "data(infos): veille du matin $(date -u +%Y-%m-%d)"
            # 24 robots poussent sur le meme depot : sans rattrapage, celui qui arrive
            # second perd sa journee (vecu par « nouveautes » le 2026-08-03).
            git pull --rebase --autostash origin main
            git push
          fi
