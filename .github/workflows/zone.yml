name: Copilote · potentiel de zone

# Robot GRATUIT : recalcule crm/v2/zone-data.js (commune + population par officine)
# depuis les fichiers STATS/*_geolocalisation + l'API geo.api.gouv.fr. Aucune clé.
# Change peu (adresses officines) → mensuel. Déclenchable à la main.

# ⚠️ PASSAGE MENSUEL SUSPENDU LE 13/08/2026.
# Ce robot lit STATS/*_geolocalisation_*.xlsx dans le dépôt CLONÉ par GitHub.
# Or STATS/ vient d'être retiré du dépôt public : ces classeurs contenaient les
# ventes des commerciaux et étaient téléchargeables par n'importe qui (vérifié :
# STATS/ALH_01_2026.xlsx répondait HTTP 200). Sans eux, generate_zone.py sort sur
# « Aucune zone résolue. » et le robot échouerait le 5 de chaque mois.
#
# Ce qu'on perd en attendant : le recalcul automatique de la commune et de la
# population par officine (crm/v2/zone-data.js). Le fichier DÉJÀ généré reste en
# place et l'app continue de fonctionner — ces données ne bougent quasiment pas.
#
# Pour le remettre en marche, deux voies : relancer à la main depuis un poste qui
# a les fichiers (le déclenchement manuel reste actif ci-dessous), ou donner au
# robot une source privée pour ces classeurs.
# Trouvé par le sous-agent gardien-deploiement, pas par moi.
on:
  # schedule:
  #   - cron: '51 4 5 * *'   # le 5 du mois — suspendu, voir ci-dessus
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zone
  cancel-in-progress: false

jobs:
  zone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les dépendances
        run: pip install openpyxl
      - name: Recalculer les zones
        run: python3 generate_zone.py
      - name: Committer si changement
        run: |
          if git diff --quiet -- crm/v2/zone-data.js; then
            echo "Pas de changement."
          else
            git config user.name  "JARVIS copilote"
            git config user.email "actions@users.noreplace.github.com"
            git add crm/v2/zone-data.js
            git commit -m "data(copilote): potentiel de zone $(date -u +%Y-%m-%d)"
            # 24 robots poussent sur le meme depot et GitHub livre leurs executions
            # planifiees en paquet : une seule reprise ne suffit pas (le 03/08, ansm-dispo,
            # has et nouveautes ont perdu leur journee). On retente, en se remettant a jour
            # sur la branche courante, et on echoue BRUYAMMENT si tout est refuse.
            pousse=0
            for essai in 1 2 3 4 5; do
              if git push; then pousse=1; break; fi
              echo "push refuse (tentative $essai/5) — un autre robot est passe, rattrapage"
              git pull --rebase --autostash origin "$GITHUB_REF_NAME" || exit 1
              sleep $(( essai * 5 + RANDOM % 10 ))
            done
            [ "$pousse" = 1 ] || { echo "ECHEC : 5 tentatives de push refusees"; exit 1; }
          fi
