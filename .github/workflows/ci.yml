name: CI (contrôle avant prod)

# Filet de sécurité au push : attrape les erreurs de syntaxe JS et les écrans blancs
# AVANT qu'ils n'arrivent en ligne. Ne se déclenche que si du code de l'app change
# (pas sur les commits de données comme la veille du matin).

on:
  push:
    branches: [main]
    paths:
      - 'crm/**/*.js'
      - 'crm/**/*.html'
      - 'crm/**/*.css'
      - 'tests/**'
      - '.github/scripts/smoke.mjs'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'crm/**/*.js'
      - 'crm/**/*.html'
      - 'crm/**/*.css'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Contrôle syntaxe (tous les JS de l'app, hors libs vendor)
        run: |
          set -e
          n=0
          while IFS= read -r f; do
            node --check "$f"
            n=$((n+1))
          done < <(find crm -name '*.js' -not -path '*/vendor/*')
          echo "✅ $n fichiers JS sans erreur de syntaxe"

      # ⚠️ `node --test tests/` cherche un MODULE nommé "tests", pas un dossier.
      # Il faut lui passer les fichiers, sinon l'étape échoue sans rien tester.
      - name: Tests unitaires (moteur de créneaux, .ics, modèles de mail)
        run: node --test tests/*.test.mjs

      # L'archive des épisodes ANSM clos est la SEULE mémoire des durées de rupture :
      # rien ne la reconstitue si un robot se remet à purger. D'où un test à part.
      - name: Test robot ANSM (l'archive des épisodes clos ne perd rien)
        run: python3 tests/ansm-archive.test.py

      # Les sources de prix sont des fenêtres glissantes (DILA ~20 jours, BDPM sans
      # historique) : ce qu'un robot voit et n'archive pas est perdu définitivement.
      - name: Test archive d'évènements (prix, avis CEPS)
        run: python3 tests/archive-evenements.test.py

      - name: Test journal du modèle national (mémoire de la tendance marché)
        run: python3 tests/national-histo.test.py

      - name: Installer Playwright (éphémère, non committé)
        run: |
          npm i --no-save playwright@latest >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Servir l'app + smoke test (chargement + zéro erreur JS)
        run: |
          python3 -m http.server 8080 >/dev/null 2>&1 &
          sleep 2
          node .github/scripts/smoke.mjs
