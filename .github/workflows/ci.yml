name: CI (contrôle avant prod)

# PORTAIL DE MISE EN LIGNE (19/10/2026) : le site n'est publié QUE si tous les
# contrôles du job « verifier » sont verts. GitHub Pages est réglé sur la source
# « GitHub Actions » : plus de publication directe depuis la branche. Un test rouge
# = la production reste sur la version d'avant, et GitHub envoie un e-mail d'échec.
#
# Trois déclencheurs publient :
#  - un push sur main (le Mac, les sessions Claude) ;
#  - la fin d'un robot de données (workflow_run). Les robots poussent avec le
#    GITHUB_TOKEN, et un push fait avec ce jeton NE DÉCLENCHE AUCUN workflow (règle
#    GitHub) : sans cette liste, leurs données n'arriveraient plus en ligne ;
#  - un lancement à la main (workflow_dispatch).
# ⚠️ Nouveau robot qui pousse sur main = ajouter son `name:` EXACT à la liste
# workflow_run. Sinon l'étape « Chaque robot qui pousse est dans la liste » échoue,
# et rien ne se publie tant que ce n'est pas corrigé.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'crm/**/*.js'
      - 'crm/**/*.html'
      - 'crm/**/*.css'
      - 'tests/**'
  workflow_run:
    types: [completed]
    branches: [main]
    workflows:
      - "Copilote · marché France (Ameli)"
      - "Veille appro · pourquoi les ruptures arrivent (causes ANSM)"
      - "Veille appro · ANSM disponibilités + dates de retour"
      - "Bodacc secteur (Dans ton secteur)"
      - "L'édition du matin (récap centralisé)"
      - "Agences des concurrents (carte du secteur)"
      - "Anticipation · génériques & biosimilaires en approche (EMA)"
      - "Anticipation · pénuries européennes (EMA)"
      - "Veille appro · signaux de demande (Sentinelles)"
      - "Veille appro · génériques BDPM"
      - "Actualités grossistes (veille concurrents)"
      - "Veille appro · anticipation HAS (remboursement)"
      - "Infos du matin (veille)"
      - "Veille Journal officiel · ce qui touche les marges"
      - "Veille appro · saison produit (Medic'AM)"
      - "Veille appro · médicaments critiques (MITM)"
      - "Marché · modèle national d'anticipation"
      - "Copilote · nouveautés BDPM"
      - "Demande · urgences par département (SurSaUD/Odissé)"
      - "Marché · demande nationale par produit (Open Medic)"
      - "Le parc bouge (officines · FINESS)"
      - "Couplage · table pivot CIP13"
      - "Anticipation · futures baisses de prix (CEPS / JO)"
      - "Prix · baisses de prix officielles (BDPM)"
      - "Qualité · rappels de LOTS de médicaments (ANSM)"
      - "Qualité · rappels de produits (RappelConso)"
      - "Reprises récentes (FINESS+)"
      - "Copilote · ruptures ANSM"
      - "Copilote · saisonnalité"
      - "Copilote · tendance marché"
      - "Copilote · potentiel de zone"
  workflow_dispatch:

permissions:
  contents: read

# Une seule publication à la fois, jamais interrompue en cours de route. Les passages
# arrivés entre-temps se résument au plus récent, qui contient tous les commits d'avant.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref) || 'publication' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Chaque robot qui pousse est dans la liste workflow_run
        run: |
          manque=0
          for f in .github/workflows/*.yml; do
            [ "$f" = .github/workflows/ci.yml ] && continue
            grep -q 'git push' "$f" || continue
            nom=$(sed -n 's/^name: *//p' "$f" | head -1 | sed 's/^["'"'"']//; s/["'"'"']$//')
            if ! grep -qF -- "- \"$nom\"" .github/workflows/ci.yml; then
              echo "::error::$f pousse sur main mais « $nom » manque dans workflow_run de ci.yml : ses données ne seraient jamais publiées"
              manque=1
            fi
          done
          [ "$manque" = 0 ] && echo "✅ Tous les robots qui poussent déclenchent la publication"
          exit $manque

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Contrôle syntaxe (tous les JS de l'app, hors libs vendor)
        run: |
          set -e
          n=0
          while IFS= read -r f; do
            node --check "$f"
            n=$((n+1))
          done < <(find crm -name '*.js' -not -path '*/vendor/*')
          echo "✅ $n fichiers JS sans erreur de syntaxe"

      # ⚠️ `node --test tests/` cherche un MODULE nommé "tests", pas un dossier.
      # Il faut lui passer les fichiers, sinon l'étape échoue sans rien tester.
      - name: Tests unitaires (moteur de créneaux, .ics, modèles de mail)
        run: node --test tests/*.test.mjs

      # L'archive des épisodes ANSM clos est la SEULE mémoire des durées de rupture :
      # rien ne la reconstitue si un robot se remet à purger. D'où un test à part.
      - name: Test robot ANSM (l'archive des épisodes clos ne perd rien)
        run: python3 tests/ansm-archive.test.py

      - name: Test robot ANSM (le mois nommé dans le texte est celui qu'on garde)
        run: python3 tests/ansm-mois-retour.test.py

      - name: Test robot ANSM (une liste effondrée ne remplace jamais celle de la veille)
        run: python3 tests/ansm-liste-vide.test.py

      - name: Test robot prix CEPS (la date d'effet de chaque ligne de l'avis prime sur la date de parution)
        run: python3 tests/prix-futurs-date-effet.test.py

      - name: Test brief du matin (le titre des baisses CEPS compte celles de la date annoncée)
        run: python3 tests/brief-baisses-titre.test.py

      # Les sources de prix sont des fenêtres glissantes (DILA ~20 jours, BDPM sans
      # historique) : ce qu'un robot voit et n'archive pas est perdu définitivement.
      - name: Test archive d'évènements (prix, avis CEPS)
        run: python3 tests/archive-evenements.test.py

      - name: Test journal du modèle national (mémoire de la tendance marché)
        run: python3 tests/national-histo.test.py

      - name: Test pénuries EMA (substances françaises = BDPM ou anglais, jamais inventées)
        run: python3 tests/ema-penuries-fr.test.py

      - name: Test catalogue (une association = l'étiquette de sa composition officielle)
        run: python3 tests/associations-catalogue.test.py

      # Visiteur sans compte (23/10/2026) : un inconnu muni de la seule clé publique doit
      # recevoir 401 sur chaque table et ne lister aucun document. Aucun secret, que des
      # lectures. Deux messages distincts : « FAILLE » ou « contrôle impossible » (témoin
      # rouge : Supabase injoignable ou clé changée, ce n'est PAS une faille). Une table
      # neuve dans Supabase s'ajoute à .github/scripts/visiteur-tables.txt.
      - name: Visiteur sans compte (401 partout, aucun document listé)
        run: node .github/scripts/visiteur-sans-compte.mjs

      # Trois essais : un téléchargement raté (npm, navigateur) bloquerait la mise en ligne.
      - name: Installer Playwright (éphémère, non committé)
        run: |
          for essai in 1 2 3; do
            npm i --no-save playwright@latest >/dev/null 2>&1 \
              && npx playwright install --with-deps chromium webkit >/dev/null 2>&1 && exit 0
            echo "installation ratée (essai $essai/3), nouvel essai dans 20 s"; sleep 20
          done
          exit 1

      - name: Servir l'app + smoke test (chargement + zéro erreur JS) · Chromium
        run: |
          python3 -m http.server 8080 >/dev/null 2>&1 &
          sleep 2
          BROWSER=chromium node .github/scripts/smoke.mjs

      # WebKit = le moteur de Safari, celui de l'équipe (23/10/2026). Chromium ne suffit pas :
      # il accepte des choses que Safari refuse.
      - name: Smoke test · WebKit (Safari)
        run: |
          python3 -m http.server 8081 >/dev/null 2>&1 &
          sleep 2
          PORT=8081 BROWSER=webkit node .github/scripts/smoke.mjs

      # Parcours connecté avec le compte de test permanent (secrets GitHub
      # JARVIS_CI_EMAIL et JARVIS_CI_MOT_DE_PASSE). Secrets absents = ÉCHEC volontaire.
      - name: Parcours connecté · WebKit (Safari)
        env:
          JARVIS_CI_EMAIL: ${{ secrets.JARVIS_CI_EMAIL }}
          JARVIS_CI_MOT_DE_PASSE: ${{ secrets.JARVIS_CI_MOT_DE_PASSE }}
        run: |
          python3 -m http.server 8082 >/dev/null 2>&1 &
          sleep 2
          PORT=8082 BROWSER=webkit node .github/scripts/parcours-connecte.mjs

      - name: Parcours connecté · Chromium
        env:
          JARVIS_CI_EMAIL: ${{ secrets.JARVIS_CI_EMAIL }}
          JARVIS_CI_MOT_DE_PASSE: ${{ secrets.JARVIS_CI_MOT_DE_PASSE }}
        run: |
          python3 -m http.server 8083 >/dev/null 2>&1 &
          sleep 2
          PORT=8083 BROWSER=chromium node .github/scripts/parcours-connecte.mjs

  # Ne part QUE si « verifier » est vert (needs). Même commit que celui testé :
  # les deux jobs extraient github.sha. Copie propre (sans le node_modules du test).
  publier:
    needs: verifier
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # include-hidden-files : comme l'ancienne publication depuis la branche
      # (.nojekyll, .gitignore… restaient servis ; .git et .github jamais).
      - uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
          include-hidden-files: true

      - id: deployment
        uses: actions/deploy-pages@v5
