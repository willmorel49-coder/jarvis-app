name: Marché · demande nationale par produit (Open Medic)

# Robot GRATUIT : boîtes remboursées en France par CIP13 (Open Medic, Assurance Maladie),
# millésime annuel. Croisé au sell-in réseau côté app -> « white space » : gros marché
# national où le réseau vend peu = potentiel de référencement. Écrit crm/v2/openmedic.json.
# Mensuel = capte la publication du nouveau millésime (~mi-année). Aucune clé, aucun coût.

on:
  schedule:
    - cron: '52 5 5 * *'   # le 5 de chaque mois
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openmedic
  cancel-in-progress: false

jobs:
  openmedic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Récupérer la demande nationale (Open Medic)
        run: python3 generate_openmedic.py
      - name: Committer si changement
        run: |
          if git diff --quiet -- crm/v2/openmedic.json; then
            echo "Pas de changement (Open Medic inchangé)."
          else
            git config user.name  "JARVIS copilote"
            git config user.email "actions@users.noreplace.github.com"
            git add crm/v2/openmedic.json
            git commit -m "data(marché): demande nationale Open Medic $(date -u +%Y-%m-%d)"
            # 24 robots poussent sur le meme depot et GitHub livre leurs executions
            # planifiees en paquet : une seule reprise ne suffit pas (le 03/08, ansm-dispo,
            # has et nouveautes ont perdu leur journee). On retente, en se remettant a jour
            # sur la branche courante, et on echoue BRUYAMMENT si tout est refuse.
            pousse=0
            for essai in 1 2 3 4 5; do
              if git push; then pousse=1; break; fi
              echo "push refuse (tentative $essai/5) — un autre robot est passe, rattrapage"
              git pull --rebase --autostash origin "$GITHUB_REF_NAME" || exit 1
              sleep $(( essai * 5 + RANDOM % 10 ))
            done
            [ "$pousse" = 1 ] || { echo "ECHEC : 5 tentatives de push refusees"; exit 1; }
          fi
