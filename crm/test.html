<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8">
<title>Test progressif</title>
<style>
  body { font: 16px -apple-system, system-ui, sans-serif; padding: 30px; max-width: 700px; margin: auto; color: #0B1F4D; }
  h1 { font-size: 22px; }
  .step { padding: 12px; margin: 8px 0; border-radius: 8px; background: #F2F2F7; display: flex; justify-content: space-between; }
  .ok { background: #E6F7EE; color: #14B86A; }
  .err { background: #FFE5EA; color: #FF3B30; }
  .pending { background: #FFF4E6; color: #FF9500; }
  b { font-family: monospace; }
</style>
</head><body>
<h1>Test progressif — charge un script à la fois</h1>
<p>Chaque ligne tente de charger un fichier. Le premier qui plante = le coupable.</p>
<div id="log"></div>
<script>
var log = document.getElementById('log');
var t0 = performance.now();
function row(label, status, detail) {
  var d = document.createElement('div');
  d.className = 'step ' + status;
  d.innerHTML = '<span>' + label + '</span><b>' + detail + '</b>';
  log.appendChild(d);
}
function step(label, url) {
  return new Promise(function (resolve) {
    var t = performance.now();
    var pending = document.createElement('div');
    pending.className = 'step pending';
    pending.innerHTML = '<span>' + label + '</span><b>en cours…</b>';
    log.appendChild(pending);
    var s = document.createElement('script');
    s.src = url;
    s.onload = function () {
      pending.className = 'step ok';
      pending.innerHTML = '<span>' + label + '</span><b>✓ ' + Math.round(performance.now() - t) + ' ms</b>';
      resolve(true);
    };
    s.onerror = function () {
      pending.className = 'step err';
      pending.innerHTML = '<span>' + label + '</span><b>✗ ECHEC LOAD</b>';
      resolve(false);
    };
    document.head.appendChild(s);
    // Watchdog 8s : si pas resolu = le script charge mais bloque ou throw
    setTimeout(function () {
      if (pending.className === 'step pending') {
        pending.className = 'step err';
        pending.innerHTML = '<span>' + label + '</span><b>⚠ BLOQUE/THROW (timeout)</b>';
        resolve(false);
      }
    }, 8000);
  });
}

var V = '?t=' + Date.now();
(async function () {
  row('Page HTML', 'ok', '✓ ' + Math.round(performance.now() - t0) + ' ms');
  // Data files
  if (!await step('clients-data.js', 'clients-data.js' + V)) return;
  if (!await step('pharmacies-geo.js', 'pharmacies-geo.js' + V)) return;
  if (!await step('groupements-data.js', 'groupements-data.js' + V)) return;
  if (!await step('sales-detail.js', 'sales-detail.js' + V)) return;
  row('CLIENTS lus', 'ok', (typeof CLIENTS !== 'undefined' ? CLIENTS.length : '?'));
  row('SALES_TOTAL.ca', 'ok', (window.SALES_TOTAL ? window.SALES_TOTAL.ca + ' €' : 'null'));
  // App scripts
  if (!await step('app.js', 'app.js' + V)) return;
  if (!await step('dashboard-v2.js', 'dashboard-v2.js' + V)) return;
  if (!await step('perf-boot.js', 'perf-boot.js' + V)) return;
  if (!await step('classic-overrides.js', 'classic-overrides.js' + V)) return;
  if (!await step('mobile-shell.js', 'mobile-shell.js' + V)) return;
  if (!await step('native-shell.js', 'native-shell.js' + V)) return;
  if (!await step('marketing.js', 'marketing.js' + V)) return;
  row('FIN', 'ok', 'tous les scripts charges OK');
})();
</script>
</body></html>
