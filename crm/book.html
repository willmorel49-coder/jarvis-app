<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#007AFF" />
  <title>Prendre rendez-vous · JARVIS</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="style-jarvis.css" />
  <style>
    body { overflow-y: auto; height: auto; min-height: 100vh; }
    .book-page {
      max-width: 480px;
      margin: 0 auto;
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .book-header {
      text-align: center;
    }
    .book-orb-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
    }
    .book-host {
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 6px;
    }
    .book-title {
      font-family: var(--font-display);
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -.6px;
      color: var(--text);
      margin: 0 0 6px;
    }
    .book-sub {
      font-size: 14px;
      color: var(--text-dim);
    }
    .book-card {
      background: var(--surface-glass-strong);
      backdrop-filter: blur(var(--blur));
      -webkit-backdrop-filter: blur(var(--blur));
      border: 1px solid var(--border-glass);
      border-radius: var(--r-xl);
      padding: 24px;
    }
    .book-slot-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 16px;
    }
    .book-slot {
      padding: 10px;
      border-radius: var(--r-md);
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      text-align: center;
    }
    .book-slot.active {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
    }
    .book-field {
      margin-bottom: 12px;
    }
    .book-field label {
      display: block;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 4px;
    }
    .book-field input, .book-field textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: var(--r-md);
      border: 1px solid var(--border);
      background: var(--surface);
      font-family: var(--font-body);
      font-size: 14px;
    }
    .book-confirm {
      width: 100%;
      padding: 14px;
      border-radius: var(--r-pill);
      background: linear-gradient(135deg, var(--blue), var(--indigo));
      color: #fff;
      border: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }
    .book-confirm:hover { opacity: .9; }
    .book-confirm:disabled { opacity: .4; cursor: not-allowed; }
    .book-notice {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      padding: 16px;
    }
    .book-success {
      padding: 40px 24px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="book-page" id="book-page">
    <div class="book-header">
      <div class="book-orb-wrap">
        <span class="jarvis-orb jarvis-orb--lg" aria-label="JARVIS"></span>
      </div>
      <div class="book-host">Intégral Pharma</div>
      <h1 class="book-title">Réserver avec William</h1>
      <p class="book-sub" id="event-label">Visite découverte · 30 min · en officine</p>
    </div>

    <div class="book-card">
      <div style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);">Créneaux disponibles</div>
      <div class="book-slot-grid" id="slot-grid"></div>
    </div>

    <form class="book-card" id="book-form" hidden>
      <h3 style="font-family:var(--font-display);font-size:18px;font-weight:800;margin:0 0 12px;">Tes coordonnées</h3>
      <div class="book-field">
        <label>Nom de l'officine</label>
        <input type="text" name="name" required />
      </div>
      <div class="book-field">
        <label>Email</label>
        <input type="email" name="email" required />
      </div>
      <div class="book-field">
        <label>Téléphone (optionnel)</label>
        <input type="tel" name="phone" />
      </div>
      <div class="book-field">
        <label>Message (optionnel)</label>
        <textarea name="note" rows="2"></textarea>
      </div>
      <button class="book-confirm" type="submit" id="confirm-btn">Confirmer ↵</button>
    </form>

    <div class="book-notice">
      Réservation envoyée à William Morel · Intégral Pharma. Tu recevras une confirmation par email.
    </div>
  </main>

  <script>
    // Page publique stub : sans backend live, on save en localStorage avec un message
    const params = new URLSearchParams(location.search);
    const eventSlug = params.get('type') || 'visite-decouverte';
    const eventLabels = {
      'visite-decouverte': 'Visite découverte · 30 min · en officine',
      'point-trimestriel': 'Point trimestriel · 1 h · en officine',
      'audit-annuel': 'Audit annuel · 1 h 30 · en officine',
    };
    if (eventLabels[eventSlug]) {
      document.getElementById('event-label').textContent = eventLabels[eventSlug];
    }

    // Slots fictifs (Phase 6 réelle : calcul depuis Google Calendar free/busy)
    const today = new Date();
    const slots = [];
    for (let i = 1; i <= 9; i++) {
      const d = new Date(today.getTime() + i * 86400000);
      if (d.getDay() === 0 || d.getDay() === 6) continue;
      ['09:00', '10:30', '14:00', '15:30'].forEach((time) => {
        slots.push({
          date: d.toISOString().slice(0, 10),
          time,
          label: `${d.toLocaleDateString('fr-FR', { weekday: 'short', day: '2-digit', month: 'short' })} · ${time}`,
        });
      });
    }
    const grid = document.getElementById('slot-grid');
    grid.innerHTML = slots.slice(0, 12).map((s, i) =>
      `<button class="book-slot" data-slot="${i}">${s.label}</button>`
    ).join('');

    let selectedSlot = null;
    grid.addEventListener('click', (e) => {
      const btn = e.target.closest('.book-slot');
      if (!btn) return;
      grid.querySelectorAll('.book-slot').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      selectedSlot = slots[+btn.dataset.slot];
      document.getElementById('book-form').hidden = false;
      btn.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });

    document.getElementById('book-form').addEventListener('submit', (e) => {
      e.preventDefault();
      if (!selectedSlot) { alert('Choisis un créneau d\'abord.'); return; }
      const fd = new FormData(e.target);
      const booking = {
        id: Date.now(),
        date: selectedSlot.date + 'T' + selectedSlot.time,
        event: eventLabels[eventSlug] || 'RDV',
        lead: fd.get('name'),
        email: fd.get('email'),
        phone: fd.get('phone'),
        note: fd.get('note'),
        status: 'confirmed',
        createdAt: new Date().toISOString(),
      };
      const all = JSON.parse(localStorage.getItem('jarvis.bookings.v1') || '[]');
      all.push(booking);
      localStorage.setItem('jarvis.bookings.v1', JSON.stringify(all));
      document.getElementById('book-page').innerHTML = `
        <div class="book-success">
          <div class="book-orb-wrap"><span class="jarvis-orb jarvis-orb--lg"></span></div>
          <h1 class="book-title" style="margin-top:24px">Confirmé !</h1>
          <p class="book-sub">${booking.lead}, ton RDV est calé pour le ${selectedSlot.label}.</p>
          <p class="book-sub" style="margin-top:14px;font-size:12px">Une confirmation par email arrive en Phase 6 (Resend). En attendant, William le voit dans son CRM.</p>
        </div>
      `;
    });
  </script>
</body>
</html>
