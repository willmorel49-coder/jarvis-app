<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0050E6" />
  <title>Intégral Pharma · CRM</title>
  <!-- Redirection vers la V2 (app principale depuis 2026-06-10).
       Ancienne app conservée et accessible : /crm/index-legacy.html -->
  <meta http-equiv="refresh" content="0; url=v2/" />
  <script>
    try {
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        navigator.serviceWorker.getRegistrations().then(function (r) { r.forEach(function (x) { x.unregister(); }); }).catch(function(){});
      }
    } catch (e) {}
    location.replace('v2/');
  </script>
  <style>
    html,body{margin:0;height:100%;font-family:-apple-system,system-ui,sans-serif;background:#FBFCFE;color:#10131C;
      display:flex;align-items:center;justify-content:center;text-align:center}
    .l{display:flex;flex-direction:column;align-items:center;gap:18px}
    .logo{width:54px;height:54px;border-radius:15px;background:linear-gradient(150deg,#0050E6,#0034A0);
      display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,80,230,.3)}
    .sp{width:26px;height:26px;border:3px solid rgba(16,19,28,.1);border-top-color:#0050E6;border-radius:50%;animation:s .8s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
    a{color:#0050E6;font-size:13px;text-decoration:none;font-weight:600}
    p{color:#737A8C;font-size:14px;margin:0}
  </style>
</head>
<body>
  <div class="l">
    <div class="logo"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M12 4.2v15.6M4.2 12h15.6" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg></div>
    <div class="sp"></div>
    <p>Ouverture de ton CRM…</p>
    <a href="v2/">Continuer →</a>
  </div>
</body>
</html>
