<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10 maquettes · Infos du matin</title>
<style>
  :root{--ip:#0050E6;--ink:#10131C;--muted:#6b7280;--line:#e6e9f0;--bg:#f4f6fb}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,-apple-system,sans-serif}
  header{padding:26px 20px 8px;max-width:1400px;margin:0 auto}
  header h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0}
  header p{color:var(--muted);font-size:14px;margin:6px 0 0}
  .grid{max-width:1400px;margin:0 auto;padding:18px;display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 6px 24px rgba(16,19,28,.06)}
  .card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .card-h .t{font-weight:800;font-size:14px}
  .card-h .t b{color:var(--ip)}
  .card-h .s{font-size:12px;color:var(--muted);font-weight:600}
  .card-h a{font-size:12px;font-weight:700;color:var(--ip);text-decoration:none;white-space:nowrap;border:1px solid var(--line);padding:6px 11px;border-radius:9px}
  .card-h a:hover{background:var(--bg)}
  .frame{position:relative;height:78vh;min-height:560px;background:#fff}
  iframe{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
<header>
  <h1>10 maquettes · « Infos du matin »</h1>
  <p>Même contenu réel, 10 styles inspirés d'apps d'actu. Donne-moi le numéro que tu préfères (ou un mix).</p>
</header>
<div class="grid" id="grid"></div>
<script>
  var M = [
    [1,'Apple News','éditorial premium'],
    [2,'Google News','flux + chips de sujets'],
    [3,'Artifact','cartes plein écran, bold'],
    [4,'Bloomberg','terminal sombre, ticker'],
    [5,'Flipboard','magazine, mosaïque'],
    [6,'Morning Brew','le brief du matin'],
    [7,'NYT / Le Monde','presse, colonnes serif'],
    [8,'X / Twitter','fil temps réel, filtres'],
    [9,'Notion','dashboard kanban minimal'],
    [10,'Bold / Wrapped','dégradés vifs, gros chiffres']
  ];
  document.getElementById('grid').innerHTML = M.map(function(m){
    var url = 'maquette-infos-' + m[0] + '.html';
    return '<div class="card"><div class="card-h"><div class="t"><b>'+m[0]+'.</b> '+m[1]+' <span class="s">· '+m[2]+'</span></div>'
      + '<a href="'+url+'" target="_blank" rel="noopener">Plein écran ↗</a></div>'
      + '<div class="frame"><iframe loading="lazy" src="'+url+'" title="'+m[1]+'"></iframe></div></div>';
  }).join('');
</script>
</body>
</html>
