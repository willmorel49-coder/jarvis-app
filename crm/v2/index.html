  <!-- Service Worker : mode hors-ligne (network-first sur la page, cache-first sur les assets versionnés) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        var hadController = !!navigator.serviceWorker.controller;
        navigator.serviceWorker.register('sw.js?v=20260730a').then(function (reg) {
          try { reg.update(); } catch (e) {}   // vérifie tout de suite au chargement
          // pendant une longue session, re-vérifier périodiquement s'il y a une nouvelle version
          setInterval(function () { try { reg.update(); } catch (e) {} }, 5 * 60 * 1000);
          // dès qu'on revient sur l'appli (onglet réactivé) : re-check -> bannière « Actualiser » si nouvelle version
          document.addEventListener('visibilitychange', function () { if (!document.hidden) { try { reg.update(); } catch (e) {} } });
        }).catch(function () {});
        // Un nouveau service worker prend la main = nouvelle version déployée → proposer d'actualiser
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (!hadController) return; // tout premier install : pas une mise à jour
          if (window.V2 && V2.showUpdateBanner) V2.showUpdateBanner();
          else window.__swUpdateReady = true;
        });
      });
    }
  </script>

  <!-- Capteur d'erreurs visible (debug) -->
  <script>
    window.addEventListener('error', function (e) {
      var p = document.getElementById('__err'); if (!p) { p = document.createElement('div'); p.id = '__err'; p.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#FFE5E5;color:#7A0000;padding:12px 18px;font:13px/1.4 -apple-system,system-ui;border-bottom:3px solid #FF3B30;white-space:pre-wrap;max-height:50vh;overflow:auto'; (document.body||document.documentElement).appendChild(p); }
      p.textContent = '⚠️ ' + (e.message||'') + (e.filename ? '\n→ ' + e.filename.split('/').pop() + ':' + (e.lineno||'?') : '');
    });
    // erreurs async non capturées (auth Supabase, loadFiles, .then) — sinon écran figé sans message
    window.addEventListener('unhandledrejection', function (e) {
      var p = document.getElementById('__err'); if (!p) { p = document.createElement('div'); p.id = '__err'; p.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#FFE5E5;color:#7A0000;padding:12px 18px;font:13px/1.4 -apple-system,system-ui;border-bottom:3px solid #FF3B30;white-space:pre-wrap;max-height:50vh;overflow:auto'; (document.body||document.documentElement).appendChild(p); }
      var r = e && e.reason; p.textContent = '⚠️ ' + ((r && (r.message || r)) || 'Promesse rejetée') ;
    });
  </script>
