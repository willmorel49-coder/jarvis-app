  <!-- Cleanup ServiceWorkers fantômes (évite cache cassé) -->
  <script>
    try {
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        navigator.serviceWorker.getRegistrations().then(function (r) { r.forEach(function (x) { x.unregister(); }); }).catch(function(){});
      }
    } catch (e) {}
  </script>

  <!-- Capteur d'erreurs visible (debug) -->
  <script>
    window.addEventListener('error', function (e) {
      var p = document.getElementById('__err'); if (!p) { p = document.createElement('div'); p.id = '__err'; p.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#FFE5E5;color:#7A0000;padding:12px 18px;font:13px/1.4 -apple-system,system-ui;border-bottom:3px solid #FF3B30;white-space:pre-wrap;max-height:50vh;overflow:auto'; (document.body||document.documentElement).appendChild(p); }
      p.textContent = '⚠️ ' + (e.message||'') + (e.filename ? '\n→ ' + e.filename.split('/').pop() + ':' + (e.lineno||'?') : '');
    });
  </script>
