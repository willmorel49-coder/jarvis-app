  <!-- Service Worker : mode hors-ligne (network-first sur la page, cache-first sur les assets versionnés) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        var hadController = !!navigator.serviceWorker.controller;
        navigator.serviceWorker.register('sw.js?v=20260911r').then(function (reg) {
          try { reg.update(); } catch (e) {}   // vérifie tout de suite au chargement          // pendant une longue session, re-vérifier périodiquement s'il y a une nouvelle version
          setInterval(function () { try { reg.update(); } catch (e) {} }, 5 * 60 * 1000);
          // dès qu'on revient sur l'appli (onglet réactivé) : re-check -> bannière « Actualiser » si nouvelle version
          document.addEventListener('visibilitychange', function () { if (!document.hidden) { try { reg.update(); } catch (e) {} } });
        }).catch(function () {});
        // Un nouveau service worker prend la main = nouvelle version déployée → proposer d'actualiser
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (!hadController) return; // tout premier install : pas une mise à jour
          if (window.V2 && V2.showUpdateBanner) V2.showUpdateBanner();
          else window.__swUpdateReady = true;
        });
      });
    }
  </script>

  <!-- Capteur d'erreurs visible (debug) -->
  <script>
    // ⚠️ TEMPORAIRE (13/08/2026) — à retirer une fois le diagnostic fait.
    // « RangeError: Maximum call stack size exceeded » n'apparaît QUE sur
    // l'iPhone de Will, jamais sur ordinateur, et n'est reproductible sur
    // aucun de nos moteurs de test. Recopier une pile d'appels depuis un
    // téléphone est illusoire : on l'envoie donc dans une table dédiée,
    // qu'on peut relire directement. Aucune donnée métier, aucune identité —
    // juste le message, l'écran, la pile et le navigateur.
    // Table `js_erreur`, insertion seule (personne ne peut la relire côté app).
    var __BUILD = '20260814a';   // pour savoir QUELLE version a produit un rapport

    // Le bandeau de diagnostic. Il était collé EN HAUT, plein écran : sur
    // iPhone il recouvrait la barre de navigation et son menu profil — Will
    // ne pouvait même plus se déconnecter. Un outil de diagnostic qui empêche
    // d'utiliser l'app est un deuxième bug, pas une aide.
    // Il vit donc EN BAS, limité en hauteur, et se ferme d'une croix.
    function __bandeau() {
      var p = document.getElementById('__err');
      if (p) return p.querySelector('.__errtxt') || p;
      p = document.createElement('div');
      p.id = '__err';
      p.style.cssText = 'position:fixed;bottom:0;left:0;right:0;z-index:99999;' +
        'background:#FFE5E5;color:#7A0000;font:12.5px/1.45 -apple-system,system-ui;' +
        'border-top:3px solid #FF3B30;max-height:34vh;display:flex;align-items:flex-start;' +
        'padding-bottom:env(safe-area-inset-bottom,0)';
      var t = document.createElement('div');
      t.className = '__errtxt';
      t.style.cssText = 'flex:1;min-width:0;padding:11px 4px 11px 14px;white-space:pre-wrap;' +
        'overflow:auto;max-height:34vh;-webkit-overflow-scrolling:touch';
      var x = document.createElement('button');
      x.textContent = '✕';
      x.setAttribute('aria-label', 'Fermer');
      x.style.cssText = 'flex:none;width:44px;height:44px;margin:4px;border:0;background:transparent;' +
        'color:#7A0000;font-size:19px;cursor:pointer';
      x.onclick = function () { p.parentNode && p.parentNode.removeChild(p); };
      p.appendChild(t); p.appendChild(x);
      (document.body || document.documentElement).appendChild(p);
      return t;
    }
    var __erreurEnvoyee = 0;
    function __signaler(message, ecran, pile) {
      message = '[' + __BUILD + '] ' + message;
      try {
        if (__erreurEnvoyee >= 3) return;   // jamais de déluge : 3 suffisent à comprendre
        __erreurEnvoyee++;
        fetch(window.SUPABASE_URL + '/rest/v1/js_erreur', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'apikey': window.SUPABASE_ANON_KEY,
                     'Authorization': 'Bearer ' + window.SUPABASE_ANON_KEY, 'Prefer': 'return=minimal' },
          body: JSON.stringify({
            message: String(message || '').slice(0, 500),
            ecran: String(ecran || '').slice(0, 60),
            pile: String(pile || '').slice(0, 2000),
            ua: String(navigator.userAgent || '').slice(0, 300),
            standalone: !!(window.navigator.standalone === true ||
              (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)),
            connecte: !!(window.V2 && window.V2.user)
          })
        }).catch(function () {});
      } catch (x) {}
    }

    window.addEventListener('error', function (e) {
      // ⚠️ Une erreur SANS fichier, SANS ligne et SANS objet d'erreur n'est pas
      // attribuable à notre code : c'est la règle de sécurité des scripts
      // servis par un AUTRE domaine, et le navigateur nous cache tout. Sur
      // l'iPhone de Will, une telle erreur revient en boucle depuis des heures
      // (« RangeError », parfois même le littéral « Script error. »), sur tous
      // les écrans, alors qu'aucun de nos filets ni de nos sondes ne la voit —
      // le profil d'une extension ou d'un bloqueur du navigateur.
      // On continue de l'ENREGISTRER, mais on cesse d'alarmer avec un grand
      // bandeau rouge pour quelque chose qu'on n'a pas causé et qu'on ne peut
      // pas réparer. Un voyant qui s'allume sans qu'on puisse agir finit par
      // être ignoré — y compris le jour où il a raison.
      var attribuable = !!(e.filename || (e.error && e.error.stack));
      if (!attribuable) {
        __signaler(e.message, (window.V2 && V2.route && V2.route.name) || '',
                   '(non attribuable — script d’un autre domaine ou extension)');
        return;
      }
      var p = __bandeau();
      var ou2 = ''; try { ou2 = (window.V2 && V2.route && V2.route.name) ? '\n[écran : ' + V2.route.name + ']' : ''; } catch (x) {}
      p.textContent = '⚠️ ' + (e.message||'') + (e.filename ? '\n→ ' + e.filename.split('/').pop() + ':' + (e.lineno||'?') : '') + ou2;
      __signaler(e.message, (window.V2 && V2.route && V2.route.name) || '',
                 (e.filename || '') + ':' + (e.lineno || '?') + ':' + (e.colno || '?') +
                 ((e.error && e.error.stack) ? '\n' + e.error.stack : ''));
    });
    // erreurs async non capturées (auth Supabase, loadFiles, .then) — sinon écran figé sans message
    //
    // ⚠️ 13/08/2026 : ce bandeau a affiché « RangeError: Maximum call stack size
    // exceeded » sur l'iPhone de Will, SANS aucun fichier ni ligne — impossible à
    // situer, et non reproductible sur un compte neuf (Chrome et WebKit). Un message
    // d'erreur qui ne dit pas OÙ ne sert à rien. On ajoute donc l'écran en cours et
    // le début de la pile d'appels : c'est ce qui manquait pour diagnostiquer.
    window.addEventListener('unhandledrejection', function (e) {
      var p = __bandeau();
      var r = e && e.reason;
      var ou = '';
      try { ou = (window.V2 && V2.route && V2.route.name) ? '\n[écran : ' + V2.route.name + ']' : ''; } catch (x) {}
      var pile = '';
      try { pile = (r && r.stack) ? '\n' + String(r.stack).split('\n').slice(0, 5).join('\n') : ''; } catch (x) {}
      p.textContent = '⚠️ ' + ((r && (r.message || r)) || 'Promesse rejetée') + ou + pile;
      __signaler((r && (r.message || r)) || 'Promesse rejetée',
                 (window.V2 && V2.route && V2.route.name) || '', (r && r.stack) || '');
    });
  </script>
