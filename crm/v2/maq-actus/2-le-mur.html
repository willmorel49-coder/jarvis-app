<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2 · Le Mur — maquette Infos JARVIS</title>
<link rel="stylesheet" href="_commun.css">
<style>
/* ═══ DIRECTION 2 · « LE MUR » ═══════════════════════════════════════════════
   Le parti pris de l'IMAGE D'ABORD. Aucune carte blanche : chaque article EST
   une tuile d'image, de taille variable, avec son titre posé dessus. Les articles
   sans photo deviennent des affiches de couleur pleine — donc le mur reste
   entièrement visuel, sans trou. On lit le mur d'un coup d'œil, on plonge ensuite.
   Ce qui le distingue : la densité. Trente articles tiennent dans deux écrans. */
body{background:#F4F6FB;color:#10131C}
.wrap{max-width:1440px;margin:0 auto;padding:0 20px 80px}

/* ── tête compacte, le mur commence tout de suite ── */
.tete{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;padding:38px 4px 22px}
.tete h1{font-family:var(--serif);font-weight:500;font-size:clamp(34px,5vw,58px);line-height:.96;letter-spacing:-.032em;margin:0}
.tete .d{font:600 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#737A8C;margin-bottom:9px;display:block}
.tete .k{text-align:right;font:600 11px/1.7 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:#8A91A4}
.tete .k b{color:#10131C;font-size:15px}

/* ── filtres en pastilles de couleur ── */
.rub{display:flex;gap:8px;flex-wrap:wrap;padding:0 4px 22px}
.rub button{height:38px;padding:0 15px;border-radius:999px;border:1.5px solid rgba(16,19,28,.14);background:#fff;
  font:650 12.5px/1 'Inter',sans-serif;color:#2A2F3C;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.rub button i{width:8px;height:8px;border-radius:50%;display:inline-block}
.rub button.on{background:#10131C;border-color:#10131C;color:#fff}

/* ── LE MUR ── */
.mur{columns:4;column-gap:14px}
@media(max-width:1180px){.mur{columns:3}}
@media(max-width:820px){.mur{columns:2}}
@media(max-width:520px){.mur{columns:1}}
.t{break-inside:avoid;position:relative;margin:0 0 14px;border-radius:14px;overflow:hidden;background:#10131C;
  box-shadow:0 1px 2px rgba(16,19,28,.06),0 8px 22px rgba(16,19,28,.08);
  transition:transform .3s cubic-bezier(.32,.72,0,1),box-shadow .3s cubic-bezier(.32,.72,0,1)}
.t:hover{transform:translateY(-4px);box-shadow:0 10px 30px rgba(16,19,28,.16)}
.t:hover .mq-cov img{transform:scale(1.06)}
.t .mq-cov{aspect-ratio:4/5}
.t.h .mq-cov{aspect-ratio:3/4}
.t.l .mq-cov{aspect-ratio:1/1}
.t.xl .mq-cov{aspect-ratio:4/6}
.veil{position:absolute;inset:0;z-index:2;
  background:linear-gradient(0deg,rgba(8,11,20,.94) 0%,rgba(8,11,20,.62) 40%,rgba(8,11,20,.04) 78%)}
.b{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:18px 17px 16px}
.cat{display:inline-block;font:700 9px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#fff;
  padding:6px 10px;border-radius:999px;margin-bottom:11px}
.t h3{font-family:var(--serif);font-weight:600;font-size:19px;line-height:1.2;letter-spacing:-.014em;color:#fff;margin:0 0 9px;text-wrap:balance}
.t.xl h3{font-size:24px}
.t h3 a{text-decoration:none}
.t h3 a::after{content:"";position:absolute;inset:0;z-index:4}
.f{font:600 10.5px/1.5 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.66)}
.f .ok{color:#7BE0AF}
/* la tuile de tête, à cheval sur deux colonnes en haut du mur */
.une{margin-bottom:22px;border-radius:18px;overflow:hidden;position:relative;background:#10131C;
  box-shadow:0 14px 40px rgba(16,19,28,.18)}
.une .mq-cov{aspect-ratio:21/9}
@media(max-width:820px){.une .mq-cov{aspect-ratio:4/5}}
.une .b{padding:34px 34px 30px;max-width:860px}
.une h2{font-family:var(--serif);font-weight:600;font-size:clamp(26px,3.8vw,48px);line-height:1.05;
  letter-spacing:-.026em;color:#fff;margin:0 0 12px;text-wrap:balance}
.une p{font-size:15.5px;line-height:1.55;color:rgba(255,255,255,.8);margin:0 0 14px;max-width:66ch}
.pour{display:inline-flex;gap:10px;align-items:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
  border-radius:999px;padding:9px 16px;color:#fff;font-size:13.5px;font-weight:600;margin-bottom:14px}
.pour b{font:700 9px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#8FB4FF}
/* l'étiquette de la planche doublonne quand un texte est posé dessus */
.mq-plaque-t{display:none}
</style>
</head>
<body>
<a class="mq-back" href="index.html">← Les 4 maquettes</a>
<div class="wrap" id="app"></div>

<script src="_socle.js"></script>
<script>
var DATA = null, SEL = '';
MAQ.charger(function (D) { DATA = D; rendre(); });

function rendre() {
  var D = DATA, e = MAQ.esc, une = D.une;
  var tout = D.tout.slice(1);
  var cpt = {}; tout.forEach(function (a) { cpt[a.theme] = (cpt[a.theme] || 0) + 1; });
  var vis = SEL ? tout.filter(function (a) { return a.theme === SEL; }) : tout;
  var tailles = ['', 'h', 'l', '', 'xl', 'l', 'h', ''];   /* rythme des hauteurs */

  var h = '<header class="tete"><div><span class="d">● ' + e(MAQ.dateFr()) + '</span>' +
      '<h1>L\'édition du matin</h1></div>' +
    '<div class="k"><b>' + D.tout.length + '</b> articles<br><b>' + D.compte.fichiers + '</b> sources gratuites</div></header>';

  /* la tuile de tête */
  if (une) {
    h += '<article class="une">' + MAQ.cover(une) + '<span class="veil"></span><div class="b">' +
      '<span class="cat" style="background:' + MAQ.acc(une.theme) + '">' + e(une.theme_l) + '</span>' +
      '<h2>' + e(une.t) + '</h2>' +
      (une.r ? '<p>' + e(une.r.slice(0, 175)) + '</p>' : '') +
      '<div class="pour"><b>Pour toi</b>' + e(une.pour_toi) + '</div>' +
      '<div class="f">' + e((une.srcs || [une.s]).slice(0, 3).join(' · ')) + ' · ' + e(MAQ.meta(une)) +
        (une.entier ? ' · <span class="ok">✓ en entier</span>' : '') + '</div>' +
      '<a href="' + e(une.u) + '" target="_blank" rel="noopener" style="position:absolute;inset:0;z-index:4"></a>' +
    '</div></article>';
  }

  h += '<div class="rub"><button class="' + (SEL ? '' : 'on') + '" onclick="filtre(\'\')">Tout <b>' + tout.length + '</b></button>' +
    (D.themes_ordre || Object.keys(cpt)).filter(function (t) { return cpt[t]; }).map(function (t) {
      return '<button class="' + (SEL === t ? 'on' : '') + '" onclick="filtre(\'' + t + '\')">' +
        '<i style="background:' + MAQ.acc(t) + '"></i>' + e(D.themes_l[t] || t) + ' <b>' + cpt[t] + '</b></button>';
    }).join('') + '</div>';

  h += '<div class="mur">' + vis.map(function (a, i) {
    return '<article class="t ' + tailles[i % tailles.length] + '">' + MAQ.cover(a) +
      '<span class="veil"></span><div class="b">' +
        '<span class="cat" style="background:' + MAQ.acc(a.theme) + '">' + e(a.theme_l) + '</span>' +
        '<h3><a href="' + e(a.u) + '" target="_blank" rel="noopener">' + e(a.t) + '</a></h3>' +
        '<div class="f">' + e(a.s) + ' · ' + e(MAQ.meta(a)) +
          (a.entier ? '<br><span class="ok">✓ lisible en entier</span>' : '') + '</div>' +
      '</div></article>';
  }).join('') + '</div>';

  document.getElementById('app').innerHTML = h;
}
function filtre(t) { SEL = (SEL === t) ? '' : t; rendre(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
</script>
</body>
</html>
