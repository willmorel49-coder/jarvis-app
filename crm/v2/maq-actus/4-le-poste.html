<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>4 · Le Poste — maquette Infos JARVIS</title>
<link rel="stylesheet" href="_commun.css">
<style>
/* ═══ DIRECTION 4 · « LE POSTE » ═════════════════════════════════════════════
   Le parti pris du POSTE DE COMMANDEMENT. Fond sombre CHAUD (jamais noir pur),
   les photos ressortent comme sur un mur d'écrans, les chiffres du radar sont
   traités comme des cadrans lumineux. C'est la seule direction sombre des quatre :
   elle existe pour que le choix soit un vrai choix, pas une validation.
   Ce qui la distingue : la donnée passe DEVANT l'article. On voit d'abord l'état
   du marché, on lit ensuite. Réservé à un usage « je regarde 20 secondes ». */
body{background:#141210;color:#F2EDE6}
.wrap{max-width:1340px;margin:0 auto;padding:0 30px 90px}
@media(max-width:640px){.wrap{padding:0 18px 70px}}
.mq-back{background:rgba(28,25,22,.92);color:#F2EDE6;border-color:rgba(255,255,255,.16)}

/* ── tête : le halo chaud, la source de lumière du sombre ── */
.tete{position:relative;padding:56px 0 30px;overflow:hidden}
.halo{position:absolute;left:6%;top:-260px;width:min(900px,120%);height:560px;pointer-events:none;
  background:radial-gradient(48% 58% at 50% 50%,rgba(255,176,74,.20) 0%,transparent 70%),
             radial-gradient(40% 50% at 78% 60%,rgba(84,146,255,.16) 0%,transparent 70%)}
.tete>*{position:relative}
.tete .d{font:600 11px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:#A79880}
.tete .d i{color:#FF6B7F;font-style:normal}
.tete h1{font-family:var(--serif);font-weight:500;font-size:clamp(36px,6vw,68px);line-height:.98;
  letter-spacing:-.032em;margin:14px 0 10px;color:#FFFBF4}
.tete p{font-size:15px;line-height:1.6;color:#A79880;max-width:58ch;margin:0}

/* ── LES CADRANS : la donnée passe devant ── */
.cadrans{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:12px;margin:26px 0 46px}
.cd{position:relative;background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.028));
  border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:18px 20px 17px;overflow:hidden}
.cd::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--a)}
.cd::after{content:"";position:absolute;right:-30px;top:-40px;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--a) 30%,transparent),transparent 66%)}
.cd b{position:relative;display:block;font-family:var(--serif);font-weight:600;font-size:44px;line-height:1;
  letter-spacing:-.032em;color:#FFFBF4}
.cd span{position:relative;display:block;font-size:12.5px;color:#C9BCA6;margin-top:7px;line-height:1.35}
.cd i{position:relative;display:block;font:600 9px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
  color:#8A7C67;margin-top:11px;font-style:normal}

/* ── la une : écran principal ── */
.une{position:relative;border-radius:20px;overflow:hidden;margin-bottom:16px;background:#0D0B0A;
  border:1px solid rgba(255,255,255,.09)}
.une .mq-cov{aspect-ratio:21/9;background:#0D0B0A}
@media(max-width:820px){.une .mq-cov{aspect-ratio:4/5}}
.veil{position:absolute;inset:0;z-index:2;background:linear-gradient(0deg,rgba(13,11,10,.95) 0%,rgba(13,11,10,.55) 44%,rgba(13,11,10,.1) 82%)}
.une .b{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:36px 38px 32px;max-width:880px}
@media(max-width:640px){.une .b{padding:22px 20px}}
.cat{display:inline-block;font:700 9.5px/1 var(--mono);letter-spacing:.17em;text-transform:uppercase;color:#141210;
  padding:7px 12px;border-radius:999px;margin-bottom:13px}
.une h2{font-family:var(--serif);font-weight:600;font-size:clamp(25px,3.6vw,44px);line-height:1.06;
  letter-spacing:-.026em;color:#FFFBF4;margin:0 0 12px;text-wrap:balance}
.une p{font-size:15.5px;line-height:1.55;color:rgba(255,251,244,.76);margin:0 0 13px;max-width:64ch}
.pour{display:inline-flex;gap:10px;align-items:center;background:rgba(255,176,74,.14);border:1px solid rgba(255,176,74,.3);
  border-radius:999px;padding:9px 16px;color:#FFE3BC;font-size:13.5px;font-weight:600;margin-bottom:13px}
.pour b{font:700 9px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#FFB04A}
.f{font:600 10.5px/1.6 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:rgba(255,251,244,.58)}
.f .ok{color:#6FE3A8}

/* ── le mur d'écrans ── */
.rub{display:flex;align-items:center;gap:12px;margin:44px 0 18px}
.rub b{font-family:var(--serif);font-weight:600;font-size:24px;letter-spacing:-.02em;color:#FFFBF4}
.rub span{flex:1 1 auto;height:1px;background:rgba(255,255,255,.13)}
.rub em{font:600 10.5px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:#8A7C67;font-style:normal}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px}
.e{position:relative;background:#1C1917;border:1px solid rgba(255,255,255,.08);border-radius:16px;overflow:hidden;
  transition:transform .3s cubic-bezier(.32,.72,0,1),border-color .3s ease}
.e:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.22)}
.e:hover .mq-cov img{transform:scale(1.06)}
.e .mq-cov{aspect-ratio:16/9;background:#0D0B0A}
.e-b{padding:15px 17px 17px}
.e-cat{font:700 9px/1 var(--mono);letter-spacing:.15em;text-transform:uppercase;display:inline-block;margin-bottom:9px}
.e h3{font-family:var(--serif);font-weight:600;font-size:17.5px;line-height:1.26;letter-spacing:-.014em;margin:0 0 8px;color:#FFFBF4}
.e h3 a{text-decoration:none}
.e h3 a::after{content:"";position:absolute;inset:0}
.e:hover h3{color:#FFD9A0}
.e p{font-size:13px;line-height:1.5;color:#A79880;margin:0 0 11px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.e-f{font:600 10px/1.5 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#7C6F5C}
.e-f .ok{color:#6FE3A8}
/* l'étiquette de la planche doublonne quand un texte est posé dessus */
.une .mq-plaque-t{display:none}
</style>
</head>
<body>
<a class="mq-back" href="index.html">← Les 4 maquettes</a>
<div class="wrap" id="app"></div>

<script src="_socle.js"></script>
<script>
MAQ.charger(function (D) {
  var e = MAQ.esc, une = D.une, reste = D.tout.slice(1);
  var h = '<header class="tete"><span class="halo"></span>' +
    '<div class="d"><i>●</i> Poste du matin · ' + e(MAQ.dateFr()) + '</div>' +
    '<h1>L\'édition du matin</h1>' +
    '<p>L\'état du marché d\'abord, les articles ensuite. ' + D.compte.fichiers +
      ' sources gratuites, ' + D.tout.length + ' articles lisibles en entier.</p></header>';

  /* les cadrans passent AVANT la une : c'est le parti pris de cette direction */
  h += '<div class="cadrans">' + (D.radar || []).map(function (r) {
    var c = { rose: '#FF6B7F', amber: '#FFB04A', green: '#4FD69C', blue: '#5492FF' }[r.ton] || '#5492FF';
    return '<div class="cd" style="--a:' + c + '"><b>' + e(r.v) + (r.unite || '') + '</b>' +
      '<span>' + e(r.l) + '</span><i>' + e(r.src) + '</i></div>';
  }).join('') + '</div>';

  if (une) {
    h += '<article class="une">' + MAQ.cover(une) + '<span class="veil"></span><div class="b">' +
      '<span class="cat" style="background:' + MAQ.acc(une.theme) + ';color:#fff">À la une · ' + e(une.theme_l) + '</span>' +
      '<h2>' + e(une.t) + '</h2>' +
      (une.r ? '<p>' + e(une.r.slice(0, 180)) + '</p>' : '') +
      '<div class="pour"><b>Pour toi</b>' + e(une.pour_toi) + '</div>' +
      '<div class="f">' + e((une.srcs || [une.s]).slice(0, 3).join(' · ')) + ' · ' + e(MAQ.meta(une)) +
        (une.entier ? ' · <span class="ok">✓ en entier</span>' : '') + '</div>' +
      '<a href="' + e(une.u) + '" target="_blank" rel="noopener" style="position:absolute;inset:0;z-index:4"></a>' +
    '</div></article>';
  }

  h += '<div class="rub"><b>Le mur</b><span></span><em>' + reste.length + ' articles</em></div>' +
    '<div class="grille">' + reste.map(function (a) {
      return '<article class="e">' + MAQ.cover(a) + '<div class="e-b">' +
        '<span class="e-cat" style="color:' + MAQ.acc(a.theme) + '">' + e(a.theme_l) + '</span>' +
        '<h3><a href="' + e(a.u) + '" target="_blank" rel="noopener">' + e(a.t) + '</a></h3>' +
        (a.r ? '<p>' + e(a.r.slice(0, 130)) + '</p>' : '') +
        '<div class="e-f">' + e(a.s) + ' · ' + e(MAQ.meta(a)) +
          (a.entier ? ' · <span class="ok">✓ en entier</span>' : '') + '</div>' +
      '</div></article>';
    }).join('') + '</div>';

  document.getElementById('app').innerHTML = h;
});
</script>
</body>
</html>
