<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3 · Le Kiosque — maquette Infos JARVIS</title>
<link rel="stylesheet" href="_commun.css">
<style>
/* ═══ DIRECTION 3 · « LE KIOSQUE » ═══════════════════════════════════════════
   Le parti pris de la NAVIGATION PAR RAYON. Une rangée par rubrique, qui défile
   à l'horizontale : Marge & distribution, Prix & remboursement, Ruptures…
   On ne descend plus dans un fil unique, on longe des rayons et on s'arrête à
   celui qui nous concerne. C'est le geste d'Apple News ou d'un kiosque.
   Ce qui le distingue : la page tient en 4 écrans au lieu de 20, et chaque
   rubrique garde de GRANDES images sans allonger la page. */
body{background:#FBFCFE;color:#10131C}
.wrap{max-width:1440px;margin:0 auto;padding:0 0 90px}
.pad{padding:0 32px}
@media(max-width:640px){.pad{padding:0 18px}}

/* ── tête avec halo (la source de lumière) ── */
.tete{position:relative;text-align:center;padding:52px 24px 34px;overflow:hidden}
.halo{position:absolute;left:50%;top:-220px;width:min(1100px,150%);height:520px;transform:translateX(-50%);pointer-events:none;
  background:radial-gradient(50% 60% at 50% 50%,rgba(0,80,230,.16) 0%,transparent 72%),
             radial-gradient(38% 46% at 24% 44%,rgba(199,121,26,.11) 0%,transparent 70%)}
.tete>*{position:relative}
.tete .d{font:600 11px/1 var(--mono);letter-spacing:.17em;text-transform:uppercase;color:#737A8C}
.tete .d i{color:#C7283D;font-style:normal}
.tete h1{font-family:var(--serif);font-weight:500;font-size:clamp(38px,6.4vw,74px);line-height:.98;
  letter-spacing:-.034em;margin:14px 0 12px}
.tete p{font-size:15.5px;line-height:1.6;color:#737A8C;max-width:56ch;margin:0 auto}

/* ── la une, en bandeau large ── */
.une{position:relative;margin:14px 32px 12px;border-radius:22px;overflow:hidden;background:#10131C;
  box-shadow:0 16px 44px rgba(16,19,28,.18)}
@media(max-width:640px){.une{margin:14px 18px 12px;border-radius:16px}}
.une .mq-cov{aspect-ratio:24/9}
@media(max-width:820px){.une .mq-cov{aspect-ratio:4/5}}
.veil{position:absolute;inset:0;z-index:2;background:linear-gradient(0deg,rgba(8,11,20,.92) 0%,rgba(8,11,20,.5) 42%,rgba(8,11,20,.04) 80%)}
.une .b{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:38px 40px 34px;max-width:900px}
@media(max-width:640px){.une .b{padding:24px 20px 22px}}
.cat{display:inline-block;font:700 9.5px/1 var(--mono);letter-spacing:.17em;text-transform:uppercase;color:#fff;
  padding:7px 12px;border-radius:999px;margin-bottom:13px}
.une h2{font-family:var(--serif);font-weight:600;font-size:clamp(25px,3.6vw,46px);line-height:1.06;
  letter-spacing:-.026em;color:#fff;margin:0 0 12px;text-wrap:balance}
.une p{font-size:15.5px;line-height:1.55;color:rgba(255,255,255,.82);margin:0 0 14px;max-width:64ch}
.pour{display:inline-flex;gap:10px;align-items:center;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);
  border-radius:999px;padding:9px 16px;color:#fff;font-size:13.5px;font-weight:600;margin-bottom:13px}
.pour b{font:700 9px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#8FB4FF}
.f{font:600 10.5px/1.6 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:rgba(255,255,255,.68)}
.f .ok{color:#7BE0AF}

/* ── le radar, en ligne de jetons ── */
.jetons{display:flex;gap:10px;overflow-x:auto;padding:22px 32px 4px;scrollbar-width:none}
.jetons::-webkit-scrollbar{display:none}
.j{flex:0 0 auto;min-width:186px;background:#fff;border:1px solid rgba(16,19,28,.08);border-radius:16px;padding:16px 18px;
  box-shadow:0 1px 2px rgba(16,19,28,.05),0 6px 16px rgba(16,19,28,.05)}
.j b{display:block;font-family:var(--serif);font-weight:600;font-size:34px;line-height:1;letter-spacing:-.03em}
.j span{display:block;font-size:12.5px;color:#4A5162;margin-top:6px;line-height:1.35}
.j i{display:block;font:600 9px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#8A91A4;margin-top:9px;font-style:normal}

/* ── LES RAYONS ── */
.rayon{margin-top:44px}
.rayon-h{display:flex;align-items:center;gap:13px;padding:0 32px 14px}
@media(max-width:640px){.rayon-h{padding:0 18px 14px}}
.rayon-h i{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
.rayon-h b{font-family:var(--serif);font-weight:600;font-size:25px;letter-spacing:-.02em}
.rayon-h span{font:600 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#8A91A4}
.piste{display:flex;gap:16px;overflow-x:auto;padding:4px 32px 16px;scroll-snap-type:x mandatory;scrollbar-width:thin}
@media(max-width:640px){.piste{padding:4px 18px 16px}}
.c{flex:0 0 320px;scroll-snap-align:start;background:#fff;border:1px solid rgba(16,19,28,.08);border-radius:18px;
  overflow:hidden;box-shadow:0 1px 2px rgba(16,19,28,.05),0 6px 18px rgba(16,19,28,.06);position:relative;
  transition:transform .3s cubic-bezier(.32,.72,0,1),box-shadow .3s cubic-bezier(.32,.72,0,1)}
@media(max-width:520px){.c{flex:0 0 268px}}
.c:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(16,19,28,.14)}
.c:hover .mq-cov img{transform:scale(1.06)}
.c .mq-cov{aspect-ratio:16/9}
.c-b{padding:15px 17px 17px}
.c h3{font-family:var(--serif);font-weight:600;font-size:18px;line-height:1.24;letter-spacing:-.014em;margin:0 0 8px}
.c h3 a{text-decoration:none}
.c h3 a::after{content:"";position:absolute;inset:0}
.c:hover h3{color:#0050E6}
.c p{font-size:13.5px;line-height:1.5;color:#737A8C;margin:0 0 11px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-f{font:600 10.5px/1.5 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#8A91A4}
.c-f .ok{color:#0F7A52}
/* l'étiquette de la planche doublonne quand un texte est posé dessus */
.une .mq-plaque-t{display:none}
</style>
</head>
<body>
<a class="mq-back" href="index.html">← Les 4 maquettes</a>
<div class="wrap" id="app"></div>

<script src="_socle.js"></script>
<script>
MAQ.charger(function (D) {
  var e = MAQ.esc, une = D.une, reste = D.tout.slice(1);
  var h = '<header class="tete"><span class="halo"></span>' +
    '<div class="d"><i>●</i> Édition du jour · ' + e(MAQ.dateFr()) + '</div>' +
    '<h1>L\'édition du matin</h1>' +
    '<p>' + D.compte.fichiers + ' sources gratuites relues, ' + D.tout.length +
      ' articles retenus — tous lisibles en entier, rangés par rayon.</p></header>';

  if (une) {
    h += '<article class="une">' + MAQ.cover(une) + '<span class="veil"></span><div class="b">' +
      '<span class="cat" style="background:' + MAQ.acc(une.theme) + '">À la une · ' + e(une.theme_l) + '</span>' +
      '<h2>' + e(une.t) + '</h2>' +
      (une.r ? '<p>' + e(une.r.slice(0, 180)) + '</p>' : '') +
      '<div class="pour"><b>Pour toi</b>' + e(une.pour_toi) + '</div>' +
      '<div class="f">' + e((une.srcs || [une.s]).slice(0, 3).join(' · ')) + ' · ' + e(MAQ.meta(une)) +
        (une.entier ? ' · <span class="ok">✓ en entier</span>' : '') + '</div>' +
      '<a href="' + e(une.u) + '" target="_blank" rel="noopener" style="position:absolute;inset:0;z-index:4"></a>' +
    '</div></article>';
  }

  h += '<div class="jetons">' + (D.radar || []).map(function (r) {
    return '<div class="j"><b>' + e(r.v) + (r.unite || '') + '</b><span>' + e(r.l) + '</span><i>' + e(r.src) + '</i></div>';
  }).join('') + '</div>';

  /* un rayon par rubrique, du plus fourni au moins fourni */
  var par = {};
  reste.forEach(function (a) { (par[a.theme] = par[a.theme] || []).push(a); });
  /* ⚠️ trier par VOLUME mettait « Autre » en tête de page. L'ordre est métier :
     ce qui touche l'argent d'Intégral d'abord, la culture générale en dernier. */
  var ordre = D.themes_ordre || Object.keys(par);
  ordre.filter(function (t) { return par[t] && par[t].length; }).forEach(function (t) {
    var lot = par[t];
    h += '<section class="rayon"><div class="rayon-h">' +
      '<i style="background:' + MAQ.acc(t) + '"></i>' +
      '<b>' + e(D.themes_l[t] || t) + '</b><span>' + lot.length + ' article' + (lot.length > 1 ? 's' : '') + '</span></div>' +
      '<div class="piste">' + lot.map(function (a) {
        return '<article class="c">' + MAQ.cover(a) + '<div class="c-b">' +
          '<h3><a href="' + e(a.u) + '" target="_blank" rel="noopener">' + e(a.t) + '</a></h3>' +
          (a.r ? '<p>' + e(a.r.slice(0, 130)) + '</p>' : '') +
          '<div class="c-f">' + e(a.s) + ' · ' + e(MAQ.meta(a)) +
            (a.entier ? ' · <span class="ok">✓ en entier</span>' : '') + '</div>' +
        '</div></article>';
      }).join('') + '</div></section>';
  });

  document.getElementById('app').innerHTML = h;
});
</script>
</body>
</html>
