<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>1 · La Une — maquette Infos JARVIS</title>
<link rel="stylesheet" href="_commun.css">
<style>
/* ═══ DIRECTION 1 · « LA UNE » ═══════════════════════════════════════════════
   Le parti pris du QUOTIDIEN GRAND FORMAT. Pas de cartes, pas de boîtes : des
   filets et des colonnes, comme un journal papier. Une seule photo, immense,
   qui occupe le premier écran — le titre est posé DESSUS. Ensuite le lecteur
   descend dans une grille dense à trois colonnes séparées par des filets.
   Ce qui le distingue : la hiérarchie est violente. Un sujet écrase les autres. */
body{background:#FBFCFE;color:#10131C}
.wrap{max-width:1240px;margin:0 auto;padding:0 28px 90px}

/* ── nameplate ── */
.np{padding:34px 0 0;text-align:center;position:relative}
.np-rule{height:3px;background:#10131C}
.np-rule.b{height:1px;opacity:.28}
.np-line{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:9px 0;
  font:600 10.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#737A8C}
.np-line .r{color:#C7283D;font-weight:700}
.np h1{font-family:var(--serif);font-weight:500;font-size:clamp(44px,8.2vw,92px);line-height:.92;
  letter-spacing:-.035em;margin:16px 0 14px}
.np-sub{font-size:14px;color:#737A8C;max-width:60ch;margin:0 auto 18px;line-height:1.6}

/* ── LA UNE : photo pleine largeur, titre posé dessus ── */
.une{position:relative;margin:26px 0 0;border-radius:4px;overflow:hidden}
.une .mq-cov{aspect-ratio:21/9}
.une-veil{position:absolute;inset:0;z-index:2;
  background:linear-gradient(0deg,rgba(8,11,20,.88) 0%,rgba(8,11,20,.55) 34%,rgba(8,11,20,.06) 70%)}
.une-b{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:46px 48px 40px;max-width:960px}
.une-cat{display:inline-block;font:700 10.5px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;
  color:#fff;padding:8px 13px;border-radius:999px;margin-bottom:16px}
.une h2{font-family:var(--serif);font-weight:600;font-size:clamp(30px,4.6vw,60px);line-height:1.04;
  letter-spacing:-.028em;color:#fff;margin:0 0 14px;text-wrap:balance}
.une p{font-size:16.5px;line-height:1.55;color:rgba(255,255,255,.86);margin:0 0 16px;max-width:74ch}
.une-m{display:flex;gap:16px;flex-wrap:wrap;font:600 11.5px/1 var(--mono);letter-spacing:.08em;
  text-transform:uppercase;color:rgba(255,255,255,.72)}
.une-m .ok{color:#7BE0AF}
@media(max-width:820px){.une .mq-cov{aspect-ratio:4/5}.une-b{padding:26px 22px 24px}}

/* ── « pour toi » : le bandeau qui n'existe nulle part ailleurs ── */
.pour{display:flex;gap:14px;align-items:flex-start;margin:0;padding:20px 24px;background:#10131C;color:#fff;border-radius:0 0 4px 4px}
.pour b{font:700 10px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:#8FB4FF;flex:0 0 auto;padding-top:3px}
.pour span{font-size:15px;line-height:1.5}

/* ── grille éditoriale à filets ── */
.sec{margin-top:56px}
.sec-h{display:flex;align-items:baseline;gap:14px;border-bottom:2px solid #10131C;padding-bottom:9px;margin-bottom:22px}
.sec-h b{font-family:var(--serif);font-weight:600;font-size:26px;letter-spacing:-.02em}
.sec-h span{font-size:12.5px;color:#737A8C}
.cols{column-count:3;column-gap:34px;column-rule:1px solid rgba(16,19,28,.12)}
@media(max-width:1000px){.cols{column-count:2}}
@media(max-width:660px){.cols{column-count:1;column-rule:none}}
.art{break-inside:avoid;padding-bottom:24px;margin-bottom:24px;border-bottom:1px solid rgba(16,19,28,.1);position:relative}
.art .mq-cov{aspect-ratio:16/10;margin-bottom:12px;border-radius:3px}
.art:hover .mq-cov img{transform:scale(1.05)}
.art-cat{font:700 9.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;display:block;margin-bottom:8px}
.art h3{font-family:var(--serif);font-weight:600;font-size:21px;line-height:1.2;letter-spacing:-.016em;margin:0 0 8px}
.art h3 a{text-decoration:none}
.art h3 a::after{content:"";position:absolute;inset:0}
.art:hover h3{color:#0050E6}
.art p{font-size:14px;line-height:1.55;color:#4A5162;margin:0 0 10px}
.art-f{font:500 11.5px/1 var(--mono);letter-spacing:.05em;color:#8A91A4;text-transform:uppercase}
.art-f .ok{color:#0F7A52}
/* le gros article de tête de colonne */
.art.gros h3{font-size:27px}
.art.gros .mq-cov{aspect-ratio:4/3}

/* ── la bande de chiffres ── */
.chiffres{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0;margin-top:56px;
  border-top:2px solid #10131C;border-bottom:2px solid #10131C}
.ch{padding:22px 20px;border-left:1px solid rgba(16,19,28,.12)}
.ch:first-child{border-left:0}
.ch b{display:block;font-family:var(--serif);font-weight:600;font-size:42px;line-height:1;letter-spacing:-.03em}
.ch span{display:block;font-size:12.5px;color:#4A5162;margin-top:7px;line-height:1.35}
.ch i{display:block;font:600 9.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#8A91A4;margin-top:10px;font-style:normal}
/* l'étiquette de la planche doublonne quand un texte est posé dessus */
.une .mq-plaque-t{display:none}
</style>
</head>
<body>
<a class="mq-back" href="index.html">← Les 4 maquettes</a>
<div class="wrap" id="app"></div>

<script src="_socle.js"></script>
<script>
MAQ.charger(function (D) {
  var e = MAQ.esc, une = D.une, autres = D.tout.slice(1);
  var h = '';

  /* ── nameplate ── */
  h += '<header class="np">' +
    '<div class="np-rule"></div>' +
    '<div class="np-line"><span class="r">● Édition du jour</span><span>' + e(MAQ.dateFr()) + '</span>' +
      '<span>' + D.compte.fichiers + ' sources · ' + D.tout.length + ' articles</span></div>' +
    '<div class="np-rule b"></div>' +
    '<h1>L\'édition du matin</h1>' +
    '<p class="np-sub">Le journal du comptoir et de la répartition. Uniquement des articles gratuits, ' +
      'lisibles en entier, relus chaque matin.</p>' +
  '</header>';

  /* ── LA UNE ── */
  if (une) {
    h += '<article class="une">' + MAQ.cover(une) + '<span class="une-veil"></span>' +
      '<div class="une-b">' +
        '<span class="une-cat" style="background:' + MAQ.acc(une.theme) + '">' + e(une.theme_l) + '</span>' +
        '<h2>' + e(une.t) + '</h2>' +
        (une.r ? '<p>' + e(une.r.slice(0, 190)) + '</p>' : '') +
        '<div class="une-m"><span>' + e((une.srcs || [une.s]).slice(0, 3).join(' · ')) + '</span>' +
          '<span>' + e(MAQ.meta(une)) + '</span>' +
          (une.entier ? '<span class="ok">✓ lisible en entier</span>' : '') + '</div>' +
      '</div></article>' +
      '<div class="pour"><b>Pour toi</b><span>' + e(une.pour_toi) + '</span></div>';
  }

  /* ── la bande de chiffres ── */
  h += '<div class="chiffres">' + (D.radar || []).slice(0, 5).map(function (r) {
    return '<div class="ch"><b>' + e(r.v) + (r.unite || '') + '</b><span>' + e(r.l) + '</span>' +
      '<i>' + e(r.src) + '</i></div>';
  }).join('') + '</div>';

  /* ── la grille éditoriale ── */
  h += '<section class="sec"><div class="sec-h"><b>Tout le journal</b>' +
    '<span>' + autres.length + ' articles · doublons regroupés · 3 semaines</span></div>' +
    '<div class="cols">' + autres.map(function (a, i) {
      return '<article class="art' + (i % 7 === 0 ? ' gros' : '') + '">' +
        MAQ.cover(a) +
        '<span class="art-cat" style="color:' + MAQ.accT(a.theme) + '">' + e(a.theme_l) + '</span>' +
        '<h3><a href="' + e(a.u) + '" target="_blank" rel="noopener">' + e(a.t) + '</a></h3>' +
        (a.r ? '<p>' + e(a.r.slice(0, 150)) + '</p>' : '') +
        '<div class="art-f">' + e(a.s) + ' · ' + e(MAQ.meta(a)) +
          (a.entier ? ' · <span class="ok">✓ en entier</span>' : '') + '</div>' +
      '</article>';
    }).join('') + '</div></section>';

  document.getElementById('app').innerHTML = h;
});
</script>
</body>
</html>
