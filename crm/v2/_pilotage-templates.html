<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pilotage pharma — 10 templates</title>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:#dfe4ec;color:#0f1420;padding:22px;-webkit-font-smoothing:antialiased}
  .gwrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:30px}
  .gtitle{text-align:center;padding:14px 0 2px}
  .gtitle b{font-size:19px;font-weight:800;letter-spacing:-.02em}
  .gtitle span{display:block;font-size:13px;color:#5b6473;margin-top:4px}
  .gnav{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:12px}
  .gnav a{font-size:12px;font-weight:700;color:#41495a;text-decoration:none;background:#fff;border:1px solid #cfd6e2;border-radius:8px;padding:6px 11px}
  .thead{display:flex;align-items:baseline;gap:11px;margin:2px 4px -8px}
  .thead b{font-size:15px;font-weight:800;letter-spacing:-.02em}
  .thead span{font-size:12.5px;color:#5b6473}
  .mono{font-family:'Geist Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}

  /* ===== base dashboard ===== */
  .dash{border-radius:20px;padding:26px 28px;overflow:hidden}
  .hd{display:flex;align-items:center;gap:11px;margin-bottom:20px}
  .hd .b{width:28px;height:28px;border-radius:8px;background:linear-gradient(150deg,#3B82F6,#0050E6);position:relative;flex:none}
  .hd .b::before,.hd .b::after{content:"";position:absolute;background:#fff;border-radius:2px}
  .hd .b::before{left:50%;top:22%;width:2.4px;height:56%;transform:translateX(-50%)}
  .hd .b::after{top:50%;left:22%;height:2.4px;width:56%;transform:translateY(-50%)}
  .hd .tt{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
  .hd .seg{margin-left:auto;display:inline-flex;gap:3px;padding:3px;border-radius:10px}
  .hd .seg b{font-size:12px;font-weight:700;padding:6px 12px;border-radius:7px;cursor:default}
  .hero-l{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;opacity:.65;margin-bottom:7px}
  .hero-v{font-size:clamp(38px,7vw,60px);font-weight:800;letter-spacing:-.04em;line-height:.95}
  .hero-d{margin-top:11px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;padding:4px 11px;border-radius:999px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:18px 0 16px}
  .kpi{padding:14px 15px;border-radius:13px}
  .kpi .l{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:.62;display:flex;align-items:center;gap:6px}
  .kpi .l i{width:6px;height:6px;border-radius:50%;display:inline-block}
  .kpi .v{font-size:22px;font-weight:800;letter-spacing:-.03em;margin-top:7px}
  .kpi .v small{font-size:11px;font-weight:500;opacity:.6}
  .kpi .d{font-size:11px;font-weight:700;margin-top:5px}
  .ch-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
  .ch-h b{font-size:14px;font-weight:800}.ch-h span{font-size:11px;opacity:.55}
  .chart{position:relative;display:flex;align-items:flex-end;gap:6px;height:150px}
  .bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
  .bar .v{font-size:9px;font-weight:700;opacity:.5;margin-bottom:4px}
  .bar .trk{width:100%;max-width:26px;height:calc(100% - 26px);display:flex;align-items:flex-end}
  .bar .fl{width:100%;border-radius:5px 5px 2px 2px}
  .bar .x{font-size:9.5px;opacity:.55;margin-top:7px;font-weight:600}
  .pos{color:#0F7A52}.neg{color:#C7283D}

  /* ============ 1 · COLD LEDGER ============ */
  .t-ledger{background:#fff;border:1px solid rgba(16,20,32,.08)}
  .t-ledger .seg{background:#F2F5FA;border:1px solid #e6eaf1}.t-ledger .seg b:first-child{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06)}.t-ledger .seg b{color:#6B7488}
  .t-ledger .hero-v{color:#0f1420;font-family:'Geist Mono',monospace;font-weight:700}
  .t-ledger .hero-d{background:#E7F5EE;color:#0F7A52}
  .t-ledger .kpi{background:#fff;border:1px solid rgba(16,20,32,.07);box-shadow:0 1px 2px rgba(16,20,32,.04)}
  .t-ledger .kpi .v{font-family:'Geist Mono',monospace}
  .t-ledger .chart{background:repeating-linear-gradient(to top,rgba(16,20,32,.05) 0 1px,transparent 1px 37px)}
  .t-ledger .bar .fl{background:color-mix(in srgb,#0050E6 var(--t,40%),#fff)}
  .t-ledger .bar.rec .fl{background:linear-gradient(180deg,#0050E6,#0034A0)}

  /* ============ 2 · EDITORIAL ============ */
  .t-editorial{background:#FBFAF6;border:1px solid #EBE6DB;font-family:'Inter',sans-serif}
  .t-editorial .hero-l{letter-spacing:.16em}
  .t-editorial .hero-v{font-family:'Fraunces',serif;font-weight:800;color:#14100c;letter-spacing:-.02em}
  .t-editorial .hero-d{background:none;color:#0F7A52;padding:0;font-size:15px}
  .t-editorial .heroline{height:4px;width:66px;background:#B85C1E;margin:14px 0 4px}
  .t-editorial .kpi{background:transparent;border:0;border-left:2px solid #E4DECE;border-radius:0;padding:2px 0 2px 14px}
  .t-editorial .kpi .v{font-family:'Fraunces',serif}
  .t-editorial .bar .fl{background:#DCD5C6}.t-editorial .bar.rec .fl{background:#B85C1E}
  .t-editorial .seg b{color:#8a8576}.t-editorial .seg b:first-child{color:#14100c;border-bottom:2px solid #B85C1E;border-radius:0}

  /* ============ 3 · POULS ============ */
  .t-pouls{background:#fff;border:1px solid #E7ECF3}
  .t-pouls .hero{position:relative;border-radius:16px;padding:22px;background:radial-gradient(120% 150% at 12% 0%,rgba(0,80,230,.08),transparent 55%),#fff;border:1px solid #EAF0F8;box-shadow:0 8px 26px -14px rgba(0,80,230,.2)}
  .t-pouls .hero-v{font-family:'Geist Mono',monospace;color:#0f1420;font-weight:700}
  .t-pouls .hero-d{background:#DFF5EA;color:#05432f}
  .t-pouls .seg{background:#F2F5FA}.t-pouls .seg b:first-child{background:#0050E6;color:#fff}.t-pouls .seg b{color:#6B7488}
  .t-pouls .kpi{background:#F8FAFD;border:1px solid #EBF0F7}
  .t-pouls .bar .fl{background:linear-gradient(180deg,#3B82F6,#0050E6);box-shadow:0 2px 9px rgba(0,80,230,.16)}
  .t-pouls .bar.rec .fl{background:linear-gradient(180deg,#5b9bff,#0034A0)}
  .t-pouls .bar.cur .fl{position:relative}.t-pouls .bar.cur .fl::after{content:"";position:absolute;top:-6px;left:50%;width:9px;height:9px;border-radius:50%;background:#0050E6;transform:translateX(-50%);box-shadow:0 0 0 3px rgba(0,80,230,.2)}

  /* ============ 4 · DARK COCKPIT ============ */
  .t-cockpit{background:linear-gradient(180deg,#0c1017,#090c11);border:1px solid rgba(255,255,255,.07);color:#E9EDF5}
  .t-cockpit .hero-v{font-family:'Geist Mono',monospace;color:#fff;font-weight:700;text-shadow:0 0 26px rgba(56,189,248,.25)}
  .t-cockpit .hero-d{background:rgba(52,211,153,.14);color:#34D399}
  .t-cockpit .seg{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}.t-cockpit .seg b:first-child{background:rgba(56,189,248,.18);color:#7fd3ff}.t-cockpit .seg b{color:#8a93a6}
  .t-cockpit .kpi{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08)}
  .t-cockpit .chart{background:repeating-linear-gradient(to top,rgba(255,255,255,.05) 0 1px,transparent 1px 37px)}
  .t-cockpit .bar .fl{background:linear-gradient(180deg,#38BDF8,#2563EB);box-shadow:0 0 14px rgba(56,189,248,.3)}
  .t-cockpit .bar.rec .fl{background:linear-gradient(180deg,#22D3EE,#0EA5E9);box-shadow:0 0 22px rgba(34,211,238,.5)}
  .t-cockpit .bar.cur .x{color:#38BDF8;font-weight:800}

  /* ============ 5 · WARM MINIMAL ============ */
  .t-warm{background:#FFFDF9;border:1px solid #F0E9E0}
  .t-warm .hero-v{color:#2a241d;font-weight:800}
  .t-warm .hero-d{background:#EAF6EF;color:#0F7A52}
  .t-warm .seg{background:#F6F0E8}.t-warm .seg b:first-child{background:#E08B4C;color:#fff}.t-warm .seg b{color:#a6957f}
  .t-warm .kpi{background:#fff;border:1px solid #F2EBE2;border-radius:17px;box-shadow:0 3px 14px rgba(120,90,40,.06)}
  .t-warm .kpi .l{color:#a6957f}
  .t-warm .bar .trk{max-width:30px}.t-warm .bar .fl{background:#E6C39C;border-radius:9px 9px 3px 3px}.t-warm .bar.rec .fl{background:#E08B4C}

  /* ============ 6 · BENTO ============ */
  .t-bento{background:#EEF1F6;border:1px solid #e2e7ef;padding:16px}
  .t-bento .bento{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(96px,auto);gap:12px}
  .t-bento .box{background:#fff;border:1px solid #e6eaf1;border-radius:16px;padding:16px 17px;box-shadow:0 2px 8px rgba(16,20,32,.04)}
  .t-bento .b-hero{grid-column:span 2;grid-row:span 2;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(150deg,#0050E6,#0034A0);color:#fff;border:0}
  .t-bento .b-hero .hero-l{opacity:.8}.t-bento .b-hero .hero-v{font-size:clamp(34px,5vw,48px);font-weight:800}.t-bento .b-hero .hero-d{background:rgba(255,255,255,.18);color:#fff}
  .t-bento .b-chart{grid-column:span 2;grid-row:span 2}
  .t-bento .kpi{padding:0}.t-bento .kpi .v{font-size:24px}
  .t-bento .bar .fl{background:linear-gradient(180deg,#3B82F6,#0050E6)}.t-bento .bar.rec .fl{background:#0034A0}
  .t-bento .chart{height:120px}

  /* ============ 7 · CLINICAL PHARMA ============ */
  .t-clinical{background:#fff;border:1px solid #DBE9E6}
  .t-clinical .hd .b{background:#0FB39A}
  .t-clinical .hero-v{color:#0b2b28;font-weight:800}
  .t-clinical .hero-d{background:#E1F5F0;color:#0a7d6b}
  .t-clinical .seg{background:#EAF6F3}.t-clinical .seg b:first-child{background:#0FB39A;color:#fff}.t-clinical .seg b{color:#5d8a83}
  .t-clinical .kpi{background:#F6FBFA;border:1px solid #E1EFEC}
  .t-clinical .kpi .l i{background:#0FB39A}
  .t-clinical .chart{background:repeating-linear-gradient(to top,#EAF3F1 0 1px,transparent 1px 37px)}
  .t-clinical .bar .fl{background:linear-gradient(180deg,#22C7AE,#0FB39A)}.t-clinical .bar.rec .fl{background:linear-gradient(180deg,#0FB39A,#0a7d6b)}

  /* ============ 8 · TERMINAL / DATA-DENSE ============ */
  .t-terminal{background:#0a0e13;border:1px solid #1c2530;color:#c9d4e0;font-family:'Geist Mono',monospace}
  .t-terminal .hd .tt,.t-terminal .hero-l,.t-terminal .kpi .l,.t-terminal .ch-h,.t-terminal .bar .x,.t-terminal .bar .v{font-family:'Geist Mono',monospace}
  .t-terminal .hero-v{font-family:'Geist Mono',monospace;color:#e9f0f7;font-weight:700;font-size:clamp(34px,6vw,50px)}
  .t-terminal .hero-d{background:none;color:#3ddc84;padding:0;font-size:14px}
  .t-terminal .seg{background:#111823;border:1px solid #1c2530}.t-terminal .seg b:first-child{background:#16324a;color:#7ec8ff}.t-terminal .seg b{color:#6b7a8c}
  .t-terminal .kpis{gap:1px;background:#1c2530;border:1px solid #1c2530;border-radius:8px;overflow:hidden}
  .t-terminal .kpi{background:#0e141c;border-radius:0}.t-terminal .kpi .v{font-family:'Geist Mono',monospace;color:#e9f0f7}
  .t-terminal .chart{height:130px}
  .t-terminal .bar .fl{background:#2E7DFF}.t-terminal .bar.rec .fl{background:#3ddc84}.t-terminal .bar.cur .fl{background:#ffcf5c}
  .t-terminal .bar .v{opacity:.7;color:#7ec8ff}

  /* ============ 9 · GRADIENT SOFT ============ */
  .t-gradient{background:linear-gradient(135deg,#F5F7FF,#EEF1FB);border:1px solid #E4E8F6}
  .t-gradient .hero{border-radius:18px;padding:24px;background:linear-gradient(120deg,#0050E6,#6D28D9);color:#fff;box-shadow:0 18px 40px -20px rgba(80,40,200,.5)}
  .t-gradient .hero-l{opacity:.85}.t-gradient .hero-v{color:#fff;font-weight:800}.t-gradient .hero-d{background:rgba(255,255,255,.2);color:#fff}
  .t-gradient .seg{background:rgba(255,255,255,.6)}.t-gradient .seg b:first-child{background:#fff;color:#4f46e5;box-shadow:0 1px 3px rgba(0,0,0,.08)}.t-gradient .seg b{color:#6a72a8}
  .t-gradient .kpi{background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.9);box-shadow:0 6px 18px -10px rgba(80,40,200,.25)}
  .t-gradient .bar .fl{background:linear-gradient(180deg,#6D28D9,#0050E6)}.t-gradient .bar.rec .fl{background:linear-gradient(180deg,#8B5CF6,#4f46e5)}

  /* ============ 10 · NEO-BRUTALIST ============ */
  .t-brutalist{background:#FFF7E8;border:2px solid #10131C;box-shadow:8px 8px 0 #10131C}
  .t-brutalist .hero-v{color:#10131C;font-weight:900;font-family:'Space Grotesk',sans-serif}
  .t-brutalist .hero-d{background:#12C26A;color:#062e18;border:2px solid #10131C;border-radius:0}
  .t-brutalist .hd .tt{font-weight:800}
  .t-brutalist .seg{background:#fff;border:2px solid #10131C;border-radius:0;padding:0}.t-brutalist .seg b{border-radius:0;border-right:2px solid #10131C}.t-brutalist .seg b:first-child{background:#FFD84D}.t-brutalist .seg b:last-child{border-right:0}
  .t-brutalist .kpi{background:#fff;border:2px solid #10131C;border-radius:0;box-shadow:4px 4px 0 #10131C}
  .t-brutalist .kpi .v{font-family:'Space Grotesk',sans-serif;font-weight:800}
  .t-brutalist .bar .trk{max-width:30px}.t-brutalist .bar .fl{background:#2E7DFF;border:2px solid #10131C;border-bottom:0;border-radius:0}.t-brutalist .bar.rec .fl{background:#FF5C8A}.t-brutalist .bar.cur .fl{background:#12C26A}

  @media(max-width:720px){.kpis{grid-template-columns:repeat(2,1fr)}.t-bento .bento{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><div class="gwrap">
  <div class="gtitle"><b>Pilotage pharma — 10 templates</b><span>même contenu (CA + KPIs + 13 mois), 10 partis-pris de design</span>
    <div class="gnav" id="gnav"></div></div>
  <div id="gal"></div>
</div>
<script>
var DATA=[{m:'J',v:0},{m:'J',v:0},{m:'A',v:0},{m:'S',v:0},{m:'O',v:198},{m:'N',v:222},{m:'D',v:240},{m:'J',v:268},{m:'F',v:255},{m:'M',v:300},{m:'A',v:372},{m:'M',v:460,rec:1},{m:'J',v:417,cur:1}];
var MAX=470;
function bars(){return DATA.map(function(b){var hh=b.v>0?Math.max(4,b.v/MAX*100):0;var t=Math.round(20+hh*.55);
 return '<div class="bar'+(b.rec?' rec':'')+(b.cur?' cur':'')+'" style="--t:'+t+'%">'+
  '<div class="v">'+(b.v>0?b.v+'k':'')+'</div><div class="trk"><span class="fl" style="height:'+hh+'%"></span></div><div class="x">'+b.m+'</div></div>';}).join('');}
var KP=[{l:'vs moyenne',c:'#00C98A',v:'318 k€',s:'/mois',d:'▲ +31 %',dc:'pos'},{l:'Meilleur mois',c:'#3B82F6',v:'460 k€',d:'Mai 2026'},{l:'Pharmacies',c:'#7C3AED',v:'76',s:'/630',d:'12 % réseau'},{l:'Marge MDL',c:'#F5A524',v:'52 k€',d:'12,4 % CA'}];
function kpi(k){return '<div class="kpi"><div class="l"><i style="background:'+k.c+'"></i>'+k.l+'</div><div class="v">'+k.v+(k.s?'<small>'+k.s+'</small>':'')+'</div>'+(k.d?'<div class="d '+(k.dc||'')+'">'+k.d+'</div>':'')+'</div>';}
function hd(){return '<div class="hd"><span class="b"></span><span class="tt">Pilotage · Réseau</span><span class="seg"><b>Mois</b><b>3 mois</b><b>Année</b></span></div>';}
function hero(rule){return '<div class="hero"><div class="hero-l">CA net HT · juin 2026</div>'+(rule?'':'')+'<div class="hero-v">416 831 €</div>'+(rule?'<div class="heroline"></div>':'')+'<div class="hero-d">▲ +12,4 % vs mois dernier</div></div>';}
function chart(){return '<div class="ch-h"><b>Évolution du CA · 13 mois</b><span>juin 2025 → juin 2026</span></div><div class="chart">'+bars()+'</div>';}
function std(cls,rule){return '<div class="dash '+cls+'">'+hd()+hero(rule)+'<div class="kpis">'+KP.map(kpi).join('')+'</div>'+chart()+'</div>';}
function bento(){return '<div class="dash t-bento"><div class="bento">'+
 '<div class="box b-hero"><div class="hero-l">CA net HT · juin</div><div class="hero-v">416 831 €</div><div class="hero-d">▲ +12,4 %</div></div>'+
 KP.map(function(k){return '<div class="box kpi"><div class="l"><i style="background:'+k.c+'"></i>'+k.l+'</div><div class="v">'+k.v+(k.s?'<small>'+k.s+'</small>':'')+'</div>'+(k.d?'<div class="d '+(k.dc||'')+'">'+k.d+'</div>':'')+'</div>';}).join('')+
 '<div class="box b-chart">'+chart()+'</div></div></div>';}

var TPL=[
 ['t-ledger','1 · Cold Ledger','SaaS premium monochrome — filets, un seul bleu, mono tabulaire'],
 ['t-editorial','2 · Editorial','magazine financier — chiffre serif géant, filet terracotta'],
 ['t-pouls','3 · Pouls','doux, héro glow, barres bleu dégradé + battement (ta préférée)'],
 ['t-cockpit','4 · Dark Cockpit','sombre premium, néon bleu/cyan, verre'],
 ['t-warm','5 · Warm Minimal','clair chaud, arrondi, accent ambre, respiration'],
 ['t-bento','6 · Bento','grille de tuiles, héro bleu plein'],
 ['t-clinical','7 · Clinical Pharma','médical, vert/teal, propre et rassurant'],
 ['t-terminal','8 · Terminal','dense, mono partout, vert/rouge — façon salle de marché'],
 ['t-gradient','9 · Gradient Soft','héro dégradé bleu→violet, cartes translucides'],
 ['t-brutalist','10 · Neo-brutalist','bords noirs, aplats vifs, ombres décalées']
];
var only=new URLSearchParams(location.search).get('t');
var gal=document.getElementById('gal'),nav=document.getElementById('gnav');
TPL.forEach(function(t,i){
 if(only && String(i+1)!==only) return;
 var block='<div><div class="thead"><b>'+t[1]+'</b><span>'+t[2]+'</span></div>'+(t[0]==='t-bento'?bento():std(t[0],t[0]==='t-editorial'))+'</div>';
 gal.insertAdjacentHTML('beforeend',block);
 nav.insertAdjacentHTML('beforeend','<a href="?t='+(i+1)+'">'+(i+1)+'</a>');
});
nav.insertAdjacentHTML('beforeend','<a href="?">Tout</a>');
</script>
</body></html>
