<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ressources concurrents — quatre ergonomies</title>
<style>
:root{--ip-blue:#0050E6;--ip-ink:#10131C;--muted:#737A8C;--card:#fff;--line:rgba(16,19,28,.07)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,'Helvetica Neue',sans-serif;color:var(--ip-ink);background:linear-gradient(180deg,#E4EDFC 0,#FBFCFE 220px);display:flex;flex-direction:column}
header{padding:14px 18px 0;display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 18px}
h1{font-size:18px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px}
h1 small{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:3px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
nav button{font:inherit;font-size:13px;font-weight:700;padding:10px 14px;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ip-ink);cursor:pointer;box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 2px 5px rgba(16,19,28,.05)}
nav button.on{background:var(--ip-blue);border-color:var(--ip-blue);color:#fff}
nav button span{display:block;font-size:11px;font-weight:500;opacity:.75}
main{flex:1;display:flex;flex-direction:column;padding:12px 18px 18px;min-height:0}
.cadre{flex:1;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 10px 26px rgba(16,19,28,.08);min-height:0}
.cadre iframe{flex:1;width:100%;border:0;min-height:0}
.repere{flex:1;overflow:auto;padding:16px;display:grid;grid-template-columns:2fr 2fr 1fr;gap:14px;align-content:start}
.repere figure{margin:0}
.repere img{width:100%;border-radius:10px;border:1px solid var(--line)}
.repere figcaption{font-size:12px;color:var(--muted);margin-top:6px}
.note{font-size:12px;color:var(--muted);padding:0 18px 10px}
@media (max-width:700px){.repere{grid-template-columns:1fr}nav{margin-left:0}}
</style>
</head>
<body>
<header>
  <h1>Ressources concurrents — quatre ergonomies<small>Le repère 0 est l'écran en ligne aujourd'hui. Prix Intégral et bilans : chiffres de démonstration.</small></h1>
  <nav id="nav"></nav>
</header>
<div class="note" id="note"></div>
<main><div class="cadre" id="cadre"></div></main>
<script>
var P=[
 {id:'0',nom:'Repère',sous:"l'écran actuel"},
 {id:'1',nom:'Le produit d’abord',sous:'une recherche, une matrice produit × concurrent',page:'d1.html'},
 {id:'2',nom:'Le tableau de bord',sous:'où en sommes-nous, puis deux volets',page:'d2.html'},
 {id:'3',nom:'Le dossier concurrent',sous:'une fiche par concurrent, comme une officine',page:'d3.html'},
 {id:'4',nom:'Le comptoir',sous:'téléphone d’abord, un produit = tous les prix',page:'d4.html'}
];
var nav=document.getElementById('nav'),cadre=document.getElementById('cadre'),note=document.getElementById('note');
function go(id){
  location.hash=id;
  Array.prototype.forEach.call(nav.children,function(b){b.classList.toggle('on',b.dataset.id===id)});
  var p=P.filter(function(x){return x.id===id})[0]||P[0];
  if(p.id==='0'){cadre.innerHTML='<div class="repere"><figure><img src="repere0/hub.png" alt="Hub actuel"><figcaption>Le hub : une tuile par source</figcaption></figure><figure><img src="repere0/table.png" alt="Tableau actuel"><figcaption>Une source ouverte : tableau, chips, verdict par ligne</figcaption></figure><figure><img src="repere0/mobile.png" alt="Mobile actuel"><figcaption>Sur iPhone</figcaption></figure></div>';note.textContent='';}
  else{cadre.innerHTML='<iframe src="'+p.page+'" title="'+p.nom+'"></iframe>';note.textContent=p.nom+' — '+p.sous+'. Ouvrir en plein écran : '+p.page;}
}
P.forEach(function(p){var b=document.createElement('button');b.dataset.id=p.id;b.innerHTML=p.id+' · '+p.nom+'<span>'+p.sous+'</span>';b.onclick=function(){go(p.id)};nav.appendChild(b)});
go((location.hash||'#0').slice(1));
</script>
</body>
</html>
