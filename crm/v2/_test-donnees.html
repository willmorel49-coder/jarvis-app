<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Test des fichiers de données</title>
<!--
  ⚠️ TEMPORAIRE (13/08/2026) — page de diagnostic, à retirer avec le capteur.

  « RangeError: Maximum call stack size exceeded » n'apparaît que sur l'iPhone
  de Will. Tout a été éliminé un par un : les minuteurs, les animations, les
  écouteurs, les fonctions de l'app (une sonde de profondeur est restée muette
  sur deux essais). Il ne reste que l'hypothèse du POIDS : avaler un fichier
  JavaScript de 27 Mo — 437 848 lignes de ventes — demande beaucoup de pile,
  et un iPhone en a bien moins qu'un ordinateur.

  Cette page ne charge RIEN d'autre : ni l'app, ni Supabase, ni aucune donnée
  client. Elle prend les fichiers un par un, et dit lequel casse.
-->
<style>
  body{font:16px/1.5 -apple-system,system-ui,sans-serif;margin:0;padding:18px;
       background:#FBFCFE;color:#10131C}
  h1{font-size:20px;margin:0 0 4px}
  p.sub{color:#737A8C;font-size:14px;margin:0 0 18px}
  li{list-style:none;padding:12px 14px;margin:0 0 8px;border:1px solid #E4E8F0;
     border-radius:12px;background:#fff}
  .nom{font-weight:700}
  .ko{color:#C7283D;font-weight:700}
  .ok{color:#0F7A52;font-weight:700}
  .att{color:#737A8C}
  .det{font-size:13px;color:#737A8C;margin-top:4px;word-break:break-word}
  #fin{margin-top:18px;padding:14px;border-radius:12px;background:#fff;
       border:1px solid #E4E8F0;font-size:15px}
</style>
</head>
<body>
<h1>Test des fichiers de données</h1>
<p class="sub">Chaque fichier est chargé seul, l'un après l'autre. Laisse la page
ouverte jusqu'au message final — le premier fichier est gros, compte une minute.</p>
<ul id="liste"></ul>
<div id="fin">Test en cours…</div>

<script>
var SUPABASE_URL = 'https://iyvavhnlhxksokkerkos.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml5dmF2aG5saHhrc29ra2Vya29zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1NjU2NTYsImV4cCI6MjA5MzE0MTY1Nn0.eMdW6vUdoyVpZbqKXp6FNYTajwKEf4x-Xyj5zj1igO4';

// Les fichiers, du plus lourd au plus léger. La variable attendue permet de
// distinguer « chargé mais vide » de « chargé et exploitable ».
var FICHIERS = [
  { nom: 'Officines + ventes (27 Mo)', src: 'wml-officines-data.js', v: 'WML_SALES' },
  { nom: 'Annuaire national (2,8 Mo)', src: 'pharma-fr-data.js',     v: 'PHARMA_FR' },
  { nom: 'Statistiques produits (1 Mo)', src: 'prod-stats-data.js',  v: 'PROD_STATS' },
  { nom: 'Catalogue (3,6 Mo)', src: '../benchmark-data.js',          v: 'BENCHMARK' }
];

var liste = document.getElementById('liste');
var bilan = [];
var erreurCourante = null;

// Une erreur pendant l'évaluation d'un script remonte ici, sans être rattachée
// à un fichier — c'est justement le symptôme qu'on cherche à confirmer.
window.addEventListener('error', function (e) {
  erreurCourante = (e.message || 'erreur') +
    (e.filename ? ' (' + e.filename.split('/').pop() + ':' + (e.lineno || '?') + ')' : ' (sans fichier)');
});

function ligne(f) {
  var li = document.createElement('li');
  li.innerHTML = '<div class="nom"></div><div class="det att">en attente…</div>';
  li.querySelector('.nom').textContent = f.nom;
  liste.appendChild(li);
  return li;
}

function taille(v) {
  try {
    // ⚠️ Ces fichiers déclarent leurs données en `const` : la variable existe
    // bien, mais elle n'est PAS posée sur `window`. Chercher `window[v]` seul
    // renvoyait « variable absente » sur un fichier parfaitement chargé.
    var o = window[v];
    if (o == null) { try { o = new Function('return typeof ' + v + ' !== "undefined" ? ' + v + ' : null')(); } catch (e2) { o = null; } }
    if (!o) return 'variable absente';
    if (o.length != null) return o.length.toLocaleString('fr-FR') + ' entrées';
    if (o.p && o.p.length != null) return o.p.length.toLocaleString('fr-FR') + ' entrées';
    return 'chargé';
  } catch (x) { return 'illisible'; }
}

function suivant(i) {
  if (i >= FICHIERS.length) return terminer();
  var f = FICHIERS[i], li = ligne(f), det = li.querySelector('.det');
  det.textContent = 'chargement…';
  erreurCourante = null;
  var t0 = Date.now();
  var s = document.createElement('script');
  s.src = f.src + '?t=' + Date.now();      // jamais de cache : on veut une vraie lecture
  s.onload = function () {
    var ms = Date.now() - t0;
    // Le script a pu se charger ET lever une erreur pendant son évaluation.
    setTimeout(function () {
      if (erreurCourante) {
        det.className = 'det ko';
        det.textContent = 'ÉCHEC — ' + erreurCourante;
        bilan.push({ nom: f.nom, etat: 'ECHEC', detail: erreurCourante, ms: ms });
      } else {
        det.className = 'det ok';
        det.textContent = 'OK — ' + taille(f.v) + ' en ' + (ms / 1000).toFixed(1) + ' s';
        bilan.push({ nom: f.nom, etat: 'OK', detail: taille(f.v), ms: ms });
      }
      suivant(i + 1);
    }, 400);
  };
  s.onerror = function () {
    det.className = 'det ko';
    det.textContent = 'ÉCHEC — le fichier n’a pas pu être téléchargé';
    bilan.push({ nom: f.nom, etat: 'TELECHARGEMENT', detail: '', ms: Date.now() - t0 });
    suivant(i + 1);
  };
  document.head.appendChild(s);
}

function terminer() {
  var casses = bilan.filter(function (b) { return b.etat !== 'OK'; });
  var fin = document.getElementById('fin');
  fin.innerHTML = casses.length
    ? '<b class="ko">Trouvé.</b> ' + casses.length + ' fichier(s) en échec — c’est la cause.'
    : '<b class="ok">Tous les fichiers passent.</b> Le problème n’est donc pas leur poids : '
      + 'il vient d’ailleurs, et je cherche autre part.';
  // On envoie le bilan pour pouvoir le lire sans rien te demander de recopier.
  try {
    fetch(SUPABASE_URL + '/rest/v1/js_erreur', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY,
                 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'Prefer': 'return=minimal' },
      body: JSON.stringify({
        message: 'TEST-DONNEES ' + (casses.length ? 'ECHEC x' + casses.length : 'tout OK'),
        ecran: 'test-donnees',
        pile: bilan.map(function (b) { return b.nom + ' = ' + b.etat + ' (' + b.detail + ', ' + b.ms + ' ms)'; }).join('\n'),
        ua: String(navigator.userAgent || '').slice(0, 300),
        standalone: !!(window.navigator.standalone === true),
        connecte: false
      })
    }).catch(function () {});
  } catch (x) {}
}

suivant(0);
</script>
</body>
</html>
