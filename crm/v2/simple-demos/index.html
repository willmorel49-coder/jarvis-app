<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accueil ultra simple · 4 directions</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--ip:#0050E6;--ink:#10131C;--muted:#6b7280;--line:#e6e9f0;--bg:#f4f6fb}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif}
  header{padding:26px 20px 8px;max-width:1500px;margin:0 auto}
  header h1{font-size:23px;font-weight:700;letter-spacing:-.02em;margin:0}
  header p{color:var(--muted);font-size:14px;margin:6px 0 0}
  .grid{max-width:1500px;margin:0 auto;padding:18px;display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 6px 24px rgba(16,19,28,.06)}
  .card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 15px;border-bottom:1px solid var(--line)}
  .card-h .t{font-weight:700;font-size:14px}.card-h .t b{color:var(--ip)}
  .card-h a{font-size:12px;font-weight:700;color:var(--ip);text-decoration:none;white-space:nowrap;border:1px solid var(--line);padding:6px 11px;border-radius:9px}
  .card-h a:hover{background:var(--bg)}
  .frame{height:64vh;min-height:420px;background:#fff}
  iframe{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
<header>
  <h1>Accueil <span style="color:#F39A1B">ultra simple</span> · 4 directions</h1>
  <p>Le but : une app épurée, où le design fait la simplicité. Choisis la direction, je rebâtis le vrai accueil dessus.</p>
</header>
<div class="grid" id="g"></div>
<script>
  var M=[
    ['01','Launcher','recherche + 4 cartes, façon Raycast/Linear','home-01-launcher.html'],
    ['02','Liste calme','une colonne, liste élégante, façon Notion/Things','home-02-liste-calme.html'],
    ['03','Focus tâche','« qu\'est-ce qu\'on fait ? » 3 gros choix, façon Superhuman','home-03-focus-tache.html'],
    ['04','Dashboard mini','recherche + 3 chiffres + grille 2×2, façon Linear','home-04-dashboard-mini.html']
  ];
  document.getElementById('g').innerHTML=M.map(function(m){
    return '<div class="card"><div class="card-h"><div class="t"><b>'+m[0]+'.</b> '+m[1]+' <span style="color:#6b7280;font-weight:500">· '+m[2]+'</span></div>'
    +'<a href="'+m[3]+'" target="_blank" rel="noopener">Plein écran ↗</a></div>'
    +'<div class="frame"><iframe loading="lazy" src="'+m[3]+'" title="'+m[1]+'"></iframe></div></div>';
  }).join('');
</script>
</body>
</html>
