<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>01 · Grille + halo — Intégral Pharma</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #FBFCFE;
    --blue: #0050E6;
    --orange: #F39A1B;
    --ink: #0e1526;
    --muted: #5a6478;
    --line: rgba(20, 40, 90, 0.045);
    --grid-size: 44px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--ink);
    overflow: hidden;
    min-height: 100vh;
    display: grid;
    place-items: center;
    position: relative;
  }

  /* ---- FINE GRID (very discreet) ---- */
  .grid {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(to right, var(--line) 1px, transparent 1px),
      linear-gradient(to bottom, var(--line) 1px, transparent 1px);
    background-size: var(--grid-size) var(--grid-size);
    /* fade the grid toward the edges so it feels centered */
    -webkit-mask-image: radial-gradient(ellipse 80% 75% at 50% 45%, #000 40%, transparent 100%);
    mask-image: radial-gradient(ellipse 80% 75% at 50% 45%, #000 40%, transparent 100%);
    z-index: 0;
  }

  /* ---- SOFT HALO (blue + orange), fades to edges ---- */
  .halo {
    position: fixed;
    inset: -20%;
    z-index: 0;
    background:
      radial-gradient(38% 42% at 42% 40%, rgba(0, 80, 230, 0.16), transparent 70%),
      radial-gradient(34% 40% at 62% 58%, rgba(243, 154, 27, 0.13), transparent 72%);
    -webkit-mask-image: radial-gradient(ellipse 62% 62% at 50% 48%, #000 0%, transparent 78%);
    mask-image: radial-gradient(ellipse 62% 62% at 50% 48%, #000 0%, transparent 78%);
    filter: blur(8px);
    animation: drift 26s ease-in-out infinite alternate;
    will-change: transform;
  }

  @keyframes drift {
    0%   { transform: translate3d(-1.5%, -1%, 0) scale(1); }
    100% { transform: translate3d(2%, 1.5%, 0) scale(1.06); }
  }

  /* ---- CONTENT ---- */
  .stage {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 26px;
    padding: 24px;
  }

  .tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--muted);
    background: rgba(255, 255, 255, 0.7);
    border: 1px solid rgba(20, 40, 90, 0.08);
    padding: 7px 14px;
    border-radius: 999px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .tag .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--blue);
  }

  /* fake translucent UI card */
  .card {
    width: min(340px, 88vw);
    background: rgba(255, 255, 255, 0.62);
    border: 1px solid rgba(20, 40, 90, 0.09);
    border-radius: 18px;
    padding: 22px 22px 20px;
    backdrop-filter: blur(14px) saturate(1.2);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.6) inset,
      0 18px 40px -18px rgba(15, 30, 70, 0.28);
  }
  .card h2 {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin-bottom: 12px;
  }
  .card .row {
    height: 9px;
    border-radius: 6px;
    background: rgba(20, 40, 90, 0.08);
    margin-bottom: 9px;
  }
  .card .row.short { width: 62%; }
  .card .btn {
    margin-top: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 40px;
    border: none;
    border-radius: 10px;
    background: var(--blue);
    color: #fff;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 8px 18px -8px rgba(0, 80, 230, 0.7);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .card .btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 12px 22px -8px rgba(0, 80, 230, 0.75);
  }

  @media (prefers-reduced-motion: reduce) {
    .halo { animation: none; }
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="halo"></div>

  <div class="stage">
    <span class="tag"><span class="dot"></span>01 · Grille + halo</span>

    <div class="card">
      <h2>Tableau de bord</h2>
      <div class="row"></div>
      <div class="row short"></div>
      <button class="btn" type="button">Continuer</button>
    </div>
  </div>
</body>
</html>
