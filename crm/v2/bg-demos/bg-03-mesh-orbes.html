<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>03 · Mesh orbes — Intégral Pharma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBFCFE;
    --blue:#0050E6;
    --orange:#F39A1B;
    --ink:#0e1c33;
    --muted:#5a6b85;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"DM Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:var(--bg);
    color:var(--ink);
    overflow:hidden;
    min-height:100vh;
    min-height:100dvh;
  }

  /* Scene =========================================================== */
  .scene{
    position:fixed;
    inset:0;
    overflow:hidden;
  }
  .scene::after{
    /* léger voile pour uniformiser et adoucir les bords */
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(120% 120% at 50% 40%,transparent 55%,rgba(251,252,254,.55) 100%);
    pointer-events:none;
  }

  .orb{
    position:absolute;
    border-radius:50%;
    filter:blur(90px);
    opacity:.55;
    will-change:transform;
  }
  .orb--blue{
    width:46vmax;height:46vmax;
    top:-8vmax;left:-6vmax;
    background:radial-gradient(circle at 35% 35%,rgba(0,80,230,.9),rgba(0,80,230,0) 70%);
    animation:drift-a 34s ease-in-out infinite alternate;
  }
  .orb--orange{
    width:40vmax;height:40vmax;
    bottom:-10vmax;right:-6vmax;
    background:radial-gradient(circle at 50% 50%,rgba(243,154,27,.85),rgba(243,154,27,0) 70%);
    animation:drift-b 42s ease-in-out infinite alternate;
    opacity:.5;
  }
  .orb--blue2{
    width:34vmax;height:34vmax;
    top:38%;left:44%;
    background:radial-gradient(circle at 50% 50%,rgba(0,80,230,.55),rgba(0,80,230,0) 70%);
    animation:drift-c 50s ease-in-out infinite alternate;
    opacity:.4;
  }

  @keyframes drift-a{
    0%  {transform:translate(0,0) scale(1)}
    100%{transform:translate(8vmax,6vmax) scale(1.15)}
  }
  @keyframes drift-b{
    0%  {transform:translate(0,0) scale(1.05)}
    100%{transform:translate(-7vmax,-5vmax) scale(1)}
  }
  @keyframes drift-c{
    0%  {transform:translate(-4vmax,-3vmax) scale(1)}
    100%{transform:translate(5vmax,4vmax) scale(1.2)}
  }

  /* Label =========================================================== */
  .label{
    position:fixed;
    top:22px;left:24px;
    z-index:3;
    font-size:13px;
    font-weight:600;
    letter-spacing:.02em;
    color:var(--muted);
    background:rgba(255,255,255,.55);
    border:1px solid rgba(14,28,51,.06);
    padding:7px 14px;
    border-radius:999px;
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
  }

  /* Fake UI card ==================================================== */
  .stage{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:2;
    padding:24px;
  }
  .card{
    width:min(380px,90vw);
    background:rgba(255,255,255,.62);
    border:1px solid rgba(255,255,255,.7);
    box-shadow:0 20px 60px -20px rgba(14,28,51,.28), 0 2px 8px rgba(14,28,51,.05);
    backdrop-filter:blur(22px) saturate(140%);
    -webkit-backdrop-filter:blur(22px) saturate(140%);
    border-radius:22px;
    padding:26px 26px 24px;
  }
  .card .dot{
    width:38px;height:38px;border-radius:11px;
    background:linear-gradient(135deg,var(--blue),#3d78ff);
    box-shadow:0 6px 16px -4px rgba(0,80,230,.5);
    margin-bottom:16px;
  }
  .card h1{
    font-size:19px;
    font-weight:700;
    letter-spacing:-.01em;
    margin-bottom:12px;
  }
  .card p{
    font-size:14px;
    line-height:1.55;
    color:var(--muted);
    margin-bottom:8px;
  }
  .card p.two{margin-bottom:20px;width:88%}
  .card button{
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    color:#fff;
    background:linear-gradient(135deg,var(--blue),#2f6bff);
    border:none;
    border-radius:12px;
    padding:12px 22px;
    cursor:pointer;
    box-shadow:0 10px 24px -8px rgba(0,80,230,.6);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card button:hover{
    transform:translateY(-1px);
    box-shadow:0 14px 28px -8px rgba(0,80,230,.65);
  }

  @media (prefers-reduced-motion:reduce){
    .orb{animation:none !important}
  }
</style>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="orb orb--blue"></div>
    <div class="orb orb--orange"></div>
    <div class="orb orb--blue2"></div>
  </div>

  <span class="label">03 · Mesh orbes</span>

  <div class="stage">
    <div class="card">
      <div class="dot"></div>
      <h1>Anticipez vos appros.</h1>
      <p>Votre tableau de bord Intégral Pharma centralise remises et opportunités.</p>
      <p class="two">Suivez vos conditions en temps réel, sans engagement ni franco.</p>
      <button type="button">Ouvrir le CRM</button>
    </div>
  </div>
</body>
</html>
