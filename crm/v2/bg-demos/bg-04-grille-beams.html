<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>04 · Grille + beams — Intégral Pharma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bleu:#0050E6;
    --orange:#F39A1B;
    --fond:#FBFCFE;
    --grid:rgba(11,31,74,.045);
    --ink:#0B1F4A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'DM Sans',system-ui,sans-serif;
    background:var(--fond);
    color:var(--ink);
    min-height:100vh;
    overflow:hidden;
    position:relative;
  }

  /* Grille fine */
  .grid{
    position:fixed;inset:0;
    background-image:
      linear-gradient(var(--grid) 1px,transparent 1px),
      linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:44px 44px;
    -webkit-mask-image:radial-gradient(ellipse 120% 90% at 50% 40%,#000 55%,transparent 100%);
            mask-image:radial-gradient(ellipse 120% 90% at 50% 40%,#000 55%,transparent 100%);
    pointer-events:none;
  }

  /* Faisceaux lumineux */
  .beams{position:fixed;inset:0;overflow:hidden;pointer-events:none;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent),
                       linear-gradient(180deg,transparent,#000 12%,#000 88%,transparent);
            mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent),
                       linear-gradient(180deg,transparent,#000 12%,#000 88%,transparent);
    -webkit-mask-composite:source-in;mask-composite:intersect;
  }
  .beam{
    position:absolute;top:-40%;height:180%;
    width:2px;
    filter:blur(1px);
    opacity:0;
    transform:rotate(18deg);
    transform-origin:center;
    animation:sweep linear infinite;
  }
  .beam::after{
    content:"";position:absolute;inset:0;
    border-radius:2px;
    background:linear-gradient(180deg,transparent,var(--c,var(--bleu)),transparent);
    box-shadow:0 0 14px 1px var(--c,var(--bleu));
  }
  .beam.b1{left:18%;--c:var(--bleu);  animation-duration:11s;animation-delay:0s;  width:2px}
  .beam.b2{left:38%;--c:var(--orange);animation-duration:14s;animation-delay:3s;  width:1.5px}
  .beam.b3{left:62%;--c:var(--bleu);  animation-duration:12.5s;animation-delay:6s;width:2.5px}
  .beam.b4{left:82%;--c:var(--orange);animation-duration:16s;animation-delay:2s;  width:1.5px}

  @keyframes sweep{
    0%  {opacity:0;transform:rotate(18deg) translateY(-25%)}
    12% {opacity:.9}
    88% {opacity:.9}
    100%{opacity:0;transform:rotate(18deg) translateY(25%)}
  }

  /* Halos doux d'ambiance */
  .glow{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;opacity:.35}
  .glow.a{width:420px;height:420px;background:var(--bleu);top:-120px;left:-80px}
  .glow.b{width:380px;height:380px;background:var(--orange);bottom:-140px;right:-90px;opacity:.28}

  /* Étiquette */
  .tag{
    position:fixed;left:24px;bottom:22px;z-index:5;
    font-size:12.5px;font-weight:600;letter-spacing:.02em;
    color:#4a5b7d;
    background:rgba(255,255,255,.7);
    border:1px solid rgba(11,31,74,.08);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    padding:7px 13px;border-radius:999px;
    box-shadow:0 2px 12px rgba(11,31,74,.06);
  }
  .tag b{color:var(--bleu)}

  /* Fausse carte UI translucide */
  .stage{position:relative;z-index:4;height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{
    width:min(420px,92vw);
    background:rgba(255,255,255,.62);
    -webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);
    border:1px solid rgba(255,255,255,.8);
    border-radius:20px;
    box-shadow:0 20px 60px -20px rgba(11,31,74,.28),0 2px 8px rgba(11,31,74,.05);
    padding:26px 26px 22px;
  }
  .card .head{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .dot{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--bleu),#3b7bff);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;
    box-shadow:0 6px 16px -4px rgba(0,80,230,.5)}
  .card h1{font-size:16px;font-weight:600;line-height:1.2}
  .card .sub{font-size:12.5px;color:#6b7a99;font-weight:500}
  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .metric{background:rgba(255,255,255,.55);border:1px solid rgba(11,31,74,.06);border-radius:13px;padding:13px 14px}
  .metric .lbl{font-size:11px;color:#7a88a6;font-weight:500;margin-bottom:5px}
  .metric .val{font-size:22px;font-weight:700;letter-spacing:-.02em}
  .metric .val.up{color:#12a150}
  .metric .val.or{color:var(--orange)}
  .bar{margin-top:18px}
  .bar .row{display:flex;justify-content:space-between;font-size:11.5px;color:#6b7a99;margin-bottom:7px;font-weight:500}
  .track{height:8px;background:rgba(11,31,74,.07);border-radius:99px;overflow:hidden}
  .fill{height:100%;width:72%;border-radius:99px;background:linear-gradient(90deg,var(--bleu),var(--orange))}

  @media (max-width:480px){
    .metric .val{font-size:19px}
    .tag{left:14px;bottom:14px;font-size:11.5px}
  }

  @media (prefers-reduced-motion:reduce){
    .beam{animation:none;opacity:.7;transform:rotate(18deg)}
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow a"></div>
  <div class="glow b"></div>
  <div class="beams">
    <span class="beam b1"></span>
    <span class="beam b2"></span>
    <span class="beam b3"></span>
    <span class="beam b4"></span>
  </div>

  <div class="stage">
    <div class="card">
      <div class="head">
        <div class="dot">IP</div>
        <div>
          <h1>Tableau de bord</h1>
          <div class="sub">Intégral Pharma · Approvisionnement</div>
        </div>
      </div>
      <div class="metrics">
        <div class="metric"><div class="lbl">Remise moyenne</div><div class="val up">+7,4 %</div></div>
        <div class="metric"><div class="lbl">Réf. Offilog</div><div class="val">14 320</div></div>
        <div class="metric"><div class="lbl">Ruptures évitées</div><div class="val or">18</div></div>
        <div class="metric"><div class="lbl">Commandes</div><div class="val">42</div></div>
      </div>
      <div class="bar">
        <div class="row"><span>Objectif du mois</span><span>72 %</span></div>
        <div class="track"><div class="fill"></div></div>
      </div>
    </div>
  </div>

  <div class="tag"><b>04</b> · Grille + beams</div>
</body>
</html>
