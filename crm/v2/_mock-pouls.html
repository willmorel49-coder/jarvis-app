<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pilotage · Pouls (maquette claire)</title>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EAEFF6; --ink:#0F1420; --muted:#6B7488; --muted2:#9AA2B2;
    --blue:#0050E6; --blue-l:#3B82F6; --mint:#0F7A52; --mintbg:#DFF5EA; --rose:#C7283D;
    --line:rgba(16,20,32,.08); --line2:rgba(16,20,32,.05);
    --card:#fff; --mono:'Geist Mono',ui-monospace,monospace;
    --sh1:0 1px 2px rgba(16,20,32,.05),0 8px 24px -16px rgba(16,20,32,.18);
    --sh2:0 12px 40px -18px rgba(16,20,32,.28);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--ink);min-height:100vh;overflow-x:hidden;
    background:radial-gradient(120% 90% at 50% -10%,#F3F6FB 0%,var(--bg) 55%);-webkit-font-smoothing:antialiased}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  #fxNet{position:fixed;inset:0;z-index:0;opacity:.4;pointer-events:none}
  #fxNet canvas{display:block;width:100%;height:100%}
  .no-webgl #fxNet{display:none}
  .wrap{position:relative;z-index:2;max-width:1120px;margin:0 auto;padding:30px 26px 70px}
  .top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .brand{width:30px;height:30px;border-radius:9px;background:linear-gradient(150deg,var(--blue-l),var(--blue));position:relative;box-shadow:0 6px 18px rgba(0,80,230,.3)}
  .brand::before,.brand::after{content:"";position:absolute;background:#fff;border-radius:2px}
  .brand::before{left:50%;top:22%;width:2.5px;height:56%;transform:translateX(-50%)}
  .brand::after{top:50%;left:22%;height:2.5px;width:56%;transform:translateY(-50%)}
  .top .t{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .top .seg{margin-left:auto;display:inline-flex;gap:3px;padding:4px;background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:var(--sh1)}
  .top .seg button{border:none;background:none;color:var(--muted);font:inherit;font-size:12.5px;font-weight:700;padding:7px 14px;border-radius:8px;cursor:pointer}
  .top .seg button.on{background:var(--blue);color:#fff}

  /* HERO clair */
  .hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:22px;background:#fff;padding:30px 32px;margin-bottom:16px;box-shadow:var(--sh1)}
  .hero .aurora{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;opacity:.32}
  .hero .aurora span{position:absolute;width:60%;height:220%;top:-60%;border-radius:50%;will-change:transform}
  .hero .aurora .a{left:-10%;background:radial-gradient(closest-side,rgba(0,80,230,.22),transparent 70%);animation:au1 22s ease-in-out infinite alternate}
  .hero .aurora .b{left:45%;background:radial-gradient(closest-side,rgba(124,58,237,.16),transparent 70%);animation:au2 30s ease-in-out infinite alternate}
  .hero .aurora .c{left:70%;background:radial-gradient(closest-side,rgba(0,229,160,.16),transparent 72%);animation:au3 26s ease-in-out infinite alternate}
  @keyframes au1{to{transform:translate(24%,14%) scale(1.25) rotate(30deg)}}
  @keyframes au2{to{transform:translate(-20%,18%) scale(1.3) rotate(-26deg)}}
  @keyframes au3{to{transform:translate(-26%,-10%) scale(1.2) rotate(24deg)}}
  .hero .spot{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(340px 340px at var(--mx,50%) var(--my,40%),rgba(0,80,230,.09),transparent 60%)}
  .hero:hover .spot{opacity:1}
  .hero-in{position:relative;z-index:2;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
  .hero-l{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .live{width:7px;height:7px;border-radius:50%;background:#00C98A;box-shadow:0 0 0 3px rgba(0,201,138,.2);animation:pulse 1.8s infinite}
  @keyframes pulse{50%{opacity:.4}}
  .hero-v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:clamp(42px,8vw,70px);font-weight:700;letter-spacing:-.04em;line-height:.92;color:var(--ink)}
  .hero-d{margin-top:12px;display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:800;padding:5px 12px;border-radius:999px;color:#05432f;background:var(--mintbg)}
  .hero-spark{width:min(320px,42vw);height:88px;flex:none}

  /* KPI tilt 3D (clair) */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
  @media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}.hero-spark{display:none}}
  .fx-tilt{--rx:0deg;--ry:0deg;--mx:50%;--my:50%;perspective:800px}
  .fx-tilt-in{position:relative;padding:16px 17px;border-radius:15px;background:#fff;border:1px solid var(--line);
    transform:rotateX(var(--rx)) rotateY(var(--ry));transform-style:preserve-3d;transition:transform .4s cubic-bezier(.2,.8,.2,1);box-shadow:var(--sh1);will-change:transform}
  .fx-tilt-in::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(200px 200px at var(--mx) var(--my),var(--glow,rgba(0,80,230,.14)),transparent 60%)}
  .fx-tilt:hover .fx-tilt-in::before{opacity:1}
  .kc{transform:translateZ(24px)}
  .kpi-l{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:7px}
  .kpi-l .dot{width:7px;height:7px;border-radius:50%}
  .kpi-v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:25px;font-weight:700;letter-spacing:-.03em;margin-top:8px;color:var(--ink)}
  .kpi-v small{font-size:12px;color:var(--muted);font-weight:500}
  .kpi-d{font-size:12px;font-weight:700;margin-top:7px}
  .kpi-d.up{color:var(--mint)}.kpi-d.mut{color:var(--muted)}

  /* CHART clair — barres + tracé + moyenne dans LE MÊME repère (.plot) */
  .chart-card{border:1px solid var(--line);border-radius:20px;background:#fff;padding:22px 24px 16px;box-shadow:var(--sh1)}
  .chart-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}
  .chart-h b{font-size:15px;font-weight:800;letter-spacing:-.01em}
  .chart-h span{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
  .chart{position:relative;height:230px}
  .plot{position:absolute;left:0;right:0;top:14px;bottom:30px}
  .grid{position:absolute;inset:0;background:repeating-linear-gradient(to top,var(--line2) 0 1px,transparent 1px 25%)}
  .avg{position:absolute;left:0;right:0;border-top:1px dashed var(--muted2);transform:scaleX(0);transform-origin:left;transition:transform .7s .9s cubic-bezier(.2,.8,.2,1)}
  .avg.in{transform:scaleX(1)}
  .avg span{position:absolute;right:2px;top:-15px;font-size:9.5px;color:var(--muted);font-family:var(--mono);background:#fff;padding:0 5px}
  .bars{position:absolute;inset:0;display:flex;align-items:flex-end;gap:6px}
  .bar{position:relative;flex:1;height:100%}
  .fill{position:absolute;left:50%;bottom:0;transform:translateX(-50%) scaleY(0);transform-origin:bottom;width:66%;max-width:28px;border-radius:6px 6px 2px 2px;
    background:linear-gradient(180deg,var(--blue-l),var(--blue));transition:transform .6s cubic-bezier(.2,.8,.2,1);box-shadow:0 2px 10px rgba(0,80,230,.18)}
  .bar.rec .fill{background:linear-gradient(180deg,#5b9bff,#0034A0)}
  .bar .d{position:absolute;left:0;right:0;text-align:center;font-size:9px;font-weight:800;font-family:var(--mono);opacity:0;transition:opacity .25s}
  .bar .d.up{color:var(--mint)}.bar .d.dn{color:var(--rose)}
  .bar:hover .d,.bar.rec .d,.bar.cur .d{opacity:1}
  .traj{position:absolute;inset:0;pointer-events:none;overflow:visible}
  .traj path{fill:none;stroke:#0050E6;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;opacity:.85}
  .dot{position:absolute;width:7px;height:7px;border-radius:50%;background:#0050E6;transform:translate(-50%,50%);box-shadow:0 0 0 2px #fff}
  .ping{position:absolute;width:12px;height:12px;border-radius:50%;background:#0050E6;transform:translate(-50%,50%);opacity:0}
  .ping.go{animation:ping 1.2s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes ping{0%{opacity:1;box-shadow:0 0 0 0 rgba(0,80,230,.5)}70%{box-shadow:0 0 0 15px rgba(0,80,230,0)}100%{opacity:1;box-shadow:0 0 0 2px #fff}}
  .xlabels{position:absolute;left:0;right:0;bottom:8px;display:flex;gap:6px}
  .xlabels div{flex:1;text-align:center;font-size:10px;color:var(--muted);font-weight:600}
  .xlabels .cur{color:var(--blue);font-weight:800}
  .note{margin-top:26px;text-align:center;font-size:12px;color:var(--muted2)}
  @media(prefers-reduced-motion:reduce){.fill{transform:translateX(-50%) scaleY(1)!important;transition:none}.avg{transform:scaleX(1)}.hero .aurora span{animation:none}.ping{opacity:1}}
</style></head>
<body>
<div class="wrap">
  <div class="top"><div class="brand"></div><div class="t">Pilotage · Réseau Intégral</div>
    <div class="seg"><button class="on">Mois</button><button>3 mois</button><button>Année</button></div></div>

  <div class="hero" id="hero">
    <div class="aurora"><span class="a"></span><span class="b"></span><span class="c"></span></div>
    <div class="spot"></div>
    <div class="hero-in">
      <div>
        <div class="hero-l"><span class="live"></span>CA net HT · juin 2026</div>
        <div class="hero-v" data-count="416831" data-suffix=" €"></div>
        <div class="hero-d">▲ +12,4 % vs mois dernier</div>
      </div>
      <svg class="hero-spark" viewBox="0 0 320 88" preserveAspectRatio="none" aria-hidden="true"></svg>
    </div>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="chart-card">
    <div class="chart-h"><b>Évolution du CA · 13 mois</b><span>juin 2025 → juin 2026 · le présent bat une fois</span></div>
    <div class="chart" id="chart">
      <div class="plot" id="plot">
        <div class="grid"></div>
        <div class="avg" id="avg"><span>moy. 318 k€</span></div>
        <div class="bars" id="bars"></div>
        <div class="ping" id="ping"></div>
      </div>
      <div class="xlabels" id="xlabels"></div>
    </div>
  </div>
  <div class="note">Maquette « Pouls » claire — bouge la souris sur le héro et les cartes KPI.</div>
</div>

<script>
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
var DATA=[{m:'J',v:0},{m:'J',v:0},{m:'A',v:0},{m:'S',v:0},{m:'O',v:198},{m:'N',v:222},{m:'D',v:240},{m:'J',v:268},{m:'F',v:255},{m:'M',v:300},{m:'A',v:372},{m:'M',v:460,rec:1},{m:'J',v:417,cur:1}];
var MAX=470,AVG=318,N=DATA.length;
function evol(i){if(i<1)return null;var p=DATA[i-1].v,c=DATA[i].v;return(p>0&&c>0)?Math.round((c-p)/p*100):null;}

var KP=[
 {l:'vs moyenne',c:'#00C98A',glow:'rgba(0,201,138,.16)',v:318,suf:' k€/mois',d:'▲ +31 % vs moyenne',dc:'up'},
 {l:'Meilleur mois',c:'#3B82F6',glow:'rgba(0,80,230,.16)',v:460,suf:' k€',d:'Mai 2026',dc:'mut'},
 {l:'Pharmacies actives',c:'#7C3AED',glow:'rgba(124,58,237,.16)',v:76,suf:' /630',d:'12 % du réseau',dc:'mut'},
 {l:'Marge MDL',c:'#F5A524',glow:'rgba(245,165,36,.18)',v:52,suf:' k€',d:'12,4 % du CA net',dc:'mut'}
];
document.getElementById('kpis').innerHTML=KP.map(function(k){return '<div class="fx-tilt" data-fx-tilt style="--glow:'+k.glow+'"><div class="fx-tilt-in"><div class="kc">'+
 '<div class="kpi-l"><span class="dot" style="background:'+k.c+'"></span>'+k.l+'</div>'+
 '<div class="kpi-v"><span data-count="'+k.v+'" data-suffix="'+k.suf+'"></span></div>'+
 '<div class="kpi-d '+k.dc+'">'+k.d+'</div></div></div></div>';}).join('');

/* bars + xlabels */
document.getElementById('bars').innerHTML=DATA.map(function(b,i){var e=evol(i);var hh=b.v>0?Math.max(3,b.v/MAX*100):0;
 return '<div class="bar'+(b.rec?' rec':'')+(b.cur?' cur':'')+'">'+
  (e!=null?'<div class="d '+(e>=0?'up':'dn')+'" style="bottom:calc('+hh+'% + 5px)">'+(e>=0?'+':'')+e+'%</div>':'')+
  '<span class="fill" data-h="'+hh+'" style="height:'+hh+'%"></span></div>';}).join('');
document.getElementById('xlabels').innerHTML=DATA.map(function(b){return '<div'+(b.cur?' class="cur"':'')+'>'+b.m+'</div>';}).join('');

/* count-up */
(function(){var nf=new Intl.NumberFormat('fr-FR');
 function fmt(el,val){var suf=el.dataset.suffix||'';el.textContent=nf.format(Math.round(val))+suf;}
 function run(el){var t=parseFloat(el.dataset.count)||0,dur=1500;if(reduce){fmt(el,t);return;}var s=null;
  (function tick(ts){if(!s)s=ts;var p=Math.min(1,(ts-s)/dur);var e=1-Math.pow(1-p,3);fmt(el,t*e);if(p<1)requestAnimationFrame(tick);})(performance.now());}
 document.querySelectorAll('[data-count]').forEach(run);})();

/* tilt */
(function(){if(reduce||matchMedia('(pointer:coarse)').matches)return;
 document.querySelectorAll('[data-fx-tilt]').forEach(function(card){var inner=card.querySelector('.fx-tilt-in');var max=8;
  card.addEventListener('mousemove',function(e){var r=inner.getBoundingClientRect();var px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;
   card.style.setProperty('--ry',((px-.5)*2*max).toFixed(2)+'deg');card.style.setProperty('--rx',((py-.5)*-2*max).toFixed(2)+'deg');
   card.style.setProperty('--mx',(px*100).toFixed(1)+'%');card.style.setProperty('--my',(py*100).toFixed(1)+'%');});
  card.addEventListener('mouseleave',function(){card.style.setProperty('--rx','0deg');card.style.setProperty('--ry','0deg');});});})();

/* hero spotlight */
(function(){var h=document.getElementById('hero'),sp=h.querySelector('.spot');h.addEventListener('mousemove',function(e){var r=h.getBoundingClientRect();
 sp.style.setProperty('--mx',((e.clientX-r.left)/r.width*100)+'%');sp.style.setProperty('--my',((e.clientY-r.top)/r.height*100)+'%');});})();

/* hero sparkline draw */
(function(){var vals=DATA.filter(function(b){return b.v>0;});var pts=vals.map(function(b,i,a){return [i/(a.length-1)*320,88-(b.v/MAX*78)-5];});
 var d=pts.map(function(p,i){return(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' ');
 var area=d+' L320 88 L'+pts[0][0]+' 88 Z';var svg=document.querySelector('.hero-spark');
 svg.innerHTML='<defs><linearGradient id="hs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0050E6" stop-opacity=".22"/><stop offset="1" stop-color="#0050E6" stop-opacity="0"/></linearGradient></defs>'+
  '<path d="'+area+'" fill="url(#hs)"/><path d="'+d+'" fill="none" stroke="#0050E6" stroke-width="2.2" stroke-linejoin="round" vector-effect="non-scaling-stroke" pathLength="1" stroke-dasharray="1" stroke-dashoffset="'+(reduce?0:1)+'">'+(reduce?'':'<animate attributeName="stroke-dashoffset" from="1" to="0" dur="1.1s" begin="0.25s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1" values="1;0"/>')+'</path>';})();

/* CHART : barres poussent, ligne de moyenne, battement sur le mois courant (SANS tracé) */
(function(){
 document.getElementById('avg').style.bottom=(AVG/MAX*100)+'%';
 var cur=DATA[N-1],cx=(N-0.5)/N*100,cy=(cur.v/MAX*100);
 var ping=document.getElementById('ping');ping.style.left=cx+'%';ping.style.bottom=cy+'%';
 function play(){
  document.querySelectorAll('.fill').forEach(function(f,i){setTimeout(function(){f.style.transform='translateX(-50%) scaleY(1)';},reduce?0:90+i*32);});
  setTimeout(function(){document.getElementById('avg').classList.add('in');},reduce?0:400);
  setTimeout(function(){ping.classList.add('go');},reduce?0:1400);
 }
 var io=new IntersectionObserver(function(en){en.forEach(function(e){if(e.isIntersecting){play();io.disconnect();}});},{threshold:.15});
 io.observe(document.getElementById('chart'));
})();
</script>
</body></html>
