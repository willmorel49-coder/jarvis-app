<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pilotage · Pouls (maquette)</title>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --bg:#070B14; --bg2:#0B1120; --ink:#EDF1F8; --muted:#8A93A6; --muted2:#5C6577;
    --blue:#2E7DFF; --blue-d:#0050E6; --mint:#00E5A0; --mint-d:#0F7A52; --rose:#FF5C7A;
    --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.055);
    --card:linear-gradient(165deg,rgba(24,31,48,.92),rgba(13,18,31,.92));
    --mono:'Geist Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);
    min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  /* constellation 3D fixe en fond */
  #fxNet{position:fixed;inset:0;z-index:0;opacity:.5}
  #fxNet canvas{display:block;width:100%;height:100%}
  .fxnet-fb{position:fixed;inset:0;z-index:0;display:none;background:
    radial-gradient(2px 2px at 20% 30%,rgba(46,125,255,.8),transparent),
    radial-gradient(2px 2px at 72% 55%,rgba(0,229,160,.6),transparent),
    radial-gradient(70% 70% at 50% 30%,rgba(46,125,255,.14),transparent 70%)}
  .no-webgl #fxNet{display:none}.no-webgl .fxnet-fb{display:block}
  .wrap{position:relative;z-index:2;max-width:1120px;margin:0 auto;padding:30px 26px 70px}
  .top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .top .brand{width:30px;height:30px;border-radius:9px;background:linear-gradient(150deg,var(--blue),var(--blue-d));position:relative;box-shadow:0 6px 20px rgba(46,125,255,.4)}
  .top .brand::before,.top .brand::after{content:"";position:absolute;background:#fff;border-radius:2px}
  .top .brand::before{left:50%;top:22%;width:2.5px;height:56%;transform:translateX(-50%)}
  .top .brand::after{top:50%;left:22%;height:2.5px;width:56%;transform:translateY(-50%)}
  .top .t{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .top .seg{margin-left:auto;display:inline-flex;gap:3px;padding:4px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:11px}
  .top .seg button{border:none;background:none;color:var(--muted);font:inherit;font-size:12.5px;font-weight:700;padding:7px 14px;border-radius:8px;cursor:pointer}
  .top .seg button.on{background:rgba(46,125,255,.16);color:#cfe0ff}

  /* HERO */
  .hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:22px;
    background:var(--card);padding:30px 32px;margin-bottom:16px;box-shadow:0 30px 80px -40px rgba(0,0,0,.9)}
  .hero .aurora{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;opacity:.5}
  .hero .aurora span{position:absolute;top:-40%;left:-20%;width:70%;height:180%;border-radius:50%;mix-blend-mode:screen;will-change:transform}
  .hero .aurora .a{background:radial-gradient(closest-side,var(--blue),transparent 70%);animation:au1 22s ease-in-out infinite alternate}
  .hero .aurora .b{background:radial-gradient(closest-side,#7C3AED,transparent 70%);left:40%;animation:au2 30s ease-in-out infinite alternate}
  .hero .aurora .c{background:radial-gradient(closest-side,var(--mint),transparent 72%);left:65%;opacity:.5;animation:au3 26s ease-in-out infinite alternate}
  @keyframes au1{to{transform:translate(30%,12%) scale(1.3) rotate(35deg)}}
  @keyframes au2{to{transform:translate(-24%,20%) scale(1.35) rotate(-30deg)}}
  @keyframes au3{to{transform:translate(-30%,-14%) scale(1.25) rotate(28deg)}}
  .hero .spot{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .3s;
    background:radial-gradient(360px 360px at var(--mx,50%) var(--my,40%),rgba(46,125,255,.14),transparent 60%)}
  .hero:hover .spot{opacity:1}
  .hero-in{position:relative;z-index:2;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
  .hero-l{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .live{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 3px rgba(0,229,160,.22);animation:pulse 1.8s infinite}
  @keyframes pulse{50%{opacity:.4}}
  .hero-v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:clamp(44px,8vw,72px);font-weight:700;letter-spacing:-.04em;line-height:.92;color:#fff}
  .hero-d{margin-top:12px;display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:800;padding:5px 12px;border-radius:999px}
  .hero-d.up{color:#062e20;background:linear-gradient(180deg,#22e39c,#00c98a)}
  .hero-spark{width:min(320px,42vw);height:88px;flex:none}

  /* KPI tilt 3D */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
  @media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}.hero-spark{display:none}}
  .fx-tilt{--rx:0deg;--ry:0deg;--mx:50%;--my:50%;perspective:800px}
  .fx-tilt-in{position:relative;padding:16px 17px;border-radius:15px;background:var(--card);border:1px solid var(--line);
    transform:rotateX(var(--rx)) rotateY(var(--ry));transform-style:preserve-3d;transition:transform .4s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 18px 40px -26px rgba(0,0,0,.8);will-change:transform}
  .fx-tilt-in::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;
    background:radial-gradient(200px 200px at var(--mx) var(--my),var(--glow,rgba(46,125,255,.4)),transparent 60%)}
  .fx-tilt:hover .fx-tilt-in::before{opacity:1}
  .kc{transform:translateZ(26px)}
  .kpi-l{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:7px}
  .kpi-l .dot{width:7px;height:7px;border-radius:50%}
  .kpi-v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:25px;font-weight:700;letter-spacing:-.03em;margin-top:8px;color:#fff}
  .kpi-v small{font-size:12px;color:var(--muted);font-weight:500}
  .kpi-d{font-size:12px;font-weight:700;margin-top:7px}
  .kpi-d.up{color:var(--mint)}.kpi-d.dn{color:var(--rose)}.kpi-d.mut{color:var(--muted)}

  /* CHART */
  .chart-card{border:1px solid var(--line);border-radius:20px;background:var(--card);padding:22px 24px 18px;box-shadow:0 30px 80px -46px rgba(0,0,0,.9)}
  .chart-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}
  .chart-h b{font-size:15px;font-weight:800;letter-spacing:-.01em}
  .chart-h span{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
  .chart{position:relative;height:210px;padding-top:22px}
  .grid{position:absolute;inset:22px 0 26px;background:repeating-linear-gradient(to top,var(--line2) 0 1px,transparent 1px 25%)}
  .avg{position:absolute;left:0;right:0;border-top:1px dashed var(--muted2);transform:scaleX(0);transform-origin:left;transition:transform .7s .9s cubic-bezier(.2,.8,.2,1)}
  .avg.in{transform:scaleX(1)}
  .avg span{position:absolute;right:2px;top:-15px;font-size:9.5px;color:var(--muted);font-family:var(--mono);background:var(--bg2);padding:0 5px;border-radius:4px}
  .traj{position:absolute;inset:22px 0 26px;pointer-events:none;overflow:visible}
  .traj path{fill:none;stroke:url(#tg);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;filter:none}
  .bars{position:absolute;inset:22px 0 0;display:flex;align-items:flex-end;gap:6px}
  .bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
  .bar .d{font-size:9px;font-weight:800;font-family:var(--mono);margin-bottom:3px;opacity:0;transition:opacity .3s}
  .bar .d.up{color:var(--mint)}.bar .d.dn{color:var(--rose)}
  .bar:hover .d{opacity:1}
  .bar .v{font-size:9.5px;font-weight:700;font-family:var(--mono);color:var(--muted);margin-bottom:5px}
  .bar .track{width:100%;max-width:30px;height:calc(100% - 40px);display:flex;align-items:flex-end}
  .bar .fill{width:100%;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,var(--blue),var(--blue-d));
    transform:scaleY(0);transform-origin:bottom;transition:transform .6s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 16px rgba(46,125,255,.3)}
  .bar.rec .fill{background:linear-gradient(180deg,#5b9bff,var(--blue-d));box-shadow:0 0 26px rgba(46,125,255,.55)}
  .bar .lbl{font-size:10px;color:var(--muted);margin-top:8px;font-weight:600}
  .bar.cur .lbl{color:#9fc3ff;font-weight:800}
  .ping{position:absolute;width:13px;height:13px;border-radius:50%;background:#9fc3ff;box-shadow:0 0 12px #5b9bff;opacity:0}
  .ping.go{animation:ping 1.1s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes ping{0%{opacity:1;box-shadow:0 0 0 0 rgba(159,195,255,.7)}70%{box-shadow:0 0 0 16px rgba(159,195,255,0)}100%{opacity:1;box-shadow:0 0 12px #5b9bff}}
  .note{margin-top:26px;text-align:center;font-size:12px;color:var(--muted2)}
  @media(prefers-reduced-motion:reduce){.fill{transform:none!important;transition:none}.avg{transform:scaleX(1)}.hero .aurora span{animation:none}.ping{opacity:1}}
</style></head>
<body>
<div id="fxNet"></div><div class="fxnet-fb"></div>
<div class="wrap">
  <div class="top"><div class="brand"></div><div class="t">Pilotage · Réseau Intégral</div>
    <div class="seg"><button class="on">Mois</button><button>3 mois</button><button>Année</button></div></div>

  <div class="hero" id="hero">
    <div class="aurora"><span class="a"></span><span class="b"></span><span class="c"></span></div>
    <div class="spot"></div>
    <div class="hero-in">
      <div>
        <div class="hero-l"><span class="live"></span>CA net HT · juin 2026</div>
        <div class="hero-v" data-count="416831" data-suffix=" €"></div>
        <div class="hero-d up">▲ +12,4 % vs mois dernier</div>
      </div>
      <svg class="hero-spark" viewBox="0 0 320 88" preserveAspectRatio="none" aria-hidden="true"></svg>
    </div>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="chart-card">
    <div class="chart-h"><b>Évolution du CA · 13 mois</b><span>juin 2025 → juin 2026 · le présent bat une fois</span></div>
    <div class="chart" id="chart">
      <div class="grid"></div>
      <div class="avg" id="avg"><span>moy. 318 k€</span></div>
      <svg class="traj" id="traj" viewBox="0 0 100 100" preserveAspectRatio="none">
        <defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2E7DFF" stop-opacity=".2"/><stop offset="1" stop-color="#9fc3ff"/></linearGradient></defs>
        <path id="trajP" d="" vector-effect="non-scaling-stroke"/></svg>
      <div class="bars" id="bars"></div>
      <div class="ping" id="ping"></div>
    </div>
  </div>
  <div class="note">Maquette « Pouls » — motion + 3D. Bouge la souris sur le héro et les cartes KPI.</div>
</div>

<script>
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
var DATA=[{m:'J',v:0},{m:'J',v:0},{m:'A',v:0},{m:'S',v:0},{m:'O',v:198},{m:'N',v:222},{m:'D',v:240},{m:'J',v:268},{m:'F',v:255},{m:'M',v:300},{m:'A',v:372},{m:'M',v:460,rec:1},{m:'J',v:417,cur:1}];
var MAX=470, AVG=318;
function evol(i){if(i<1)return null;var p=DATA[i-1].v,c=DATA[i].v;return(p>0&&c>0)?Math.round((c-p)/p*100):null;}

/* KPI cards */
var KP=[
 {l:'vs moyenne',c:'#00E5A0',glow:'rgba(0,229,160,.35)',v:318,suf:' k€/mois',d:'▲ +31 % vs moyenne',dc:'up'},
 {l:'Meilleur mois',c:'#5b9bff',glow:'rgba(46,125,255,.4)',v:460,suf:' k€',d:'Mai 2026',dc:'mut'},
 {l:'Pharmacies actives',c:'#7C3AED',glow:'rgba(124,58,237,.4)',v:76,suf:' /630',d:'12 % du réseau',dc:'mut'},
 {l:'Marge MDL',c:'#F5A524',glow:'rgba(245,165,36,.4)',v:52,suf:' k€',d:'12,4 % du CA net',dc:'mut'}
];
document.getElementById('kpis').innerHTML=KP.map(function(k){return '<div class="fx-tilt" data-fx-tilt style="--glow:'+k.glow+'"><div class="fx-tilt-in"><div class="kc">'+
 '<div class="kpi-l"><span class="dot" style="background:'+k.c+'"></span>'+k.l+'</div>'+
 '<div class="kpi-v"><span data-count="'+k.v+'" data-suffix="'+k.suf+'"></span></div>'+
 '<div class="kpi-d '+k.dc+'">'+k.d+'</div></div></div></div>';}).join('');

/* bars */
document.getElementById('bars').innerHTML=DATA.map(function(b,i){var e=evol(i);var hh=b.v>0?Math.max(4,b.v/MAX*100):0;
 return '<div class="bar'+(b.rec?' rec':'')+(b.cur?' cur':'')+'">'+
  (e!=null?'<div class="d '+(e>=0?'up':'dn')+'">'+(e>=0?'+':'')+e+'%</div>':'<div class="d"></div>')+
  '<div class="v">'+(b.v>0?b.v+'k':'·')+'</div>'+
  '<div class="track"><span class="fill" data-h="'+hh+'"></span></div>'+
  '<div class="lbl">'+b.m+'</div></div>';}).join('');

/* count-up */
(function(){var nf=new Intl.NumberFormat('fr-FR');
 function fmt(el,val){var suf=el.dataset.suffix||'';el.textContent=nf.format(Math.round(val))+suf;}
 function run(el){var t=parseFloat(el.dataset.count)||0,dur=1500;if(reduce){fmt(el,t);return;}var s=null;
  (function tick(ts){if(!s)s=ts;var p=Math.min(1,(ts-s)/dur);var e=1-Math.pow(1-p,3);fmt(el,t*e);if(p<1)requestAnimationFrame(tick);})(performance.now());}
 document.querySelectorAll('[data-count]').forEach(run);})();

/* tilt */
(function(){if(reduce||matchMedia('(pointer:coarse)').matches)return;
 document.querySelectorAll('[data-fx-tilt]').forEach(function(card){var inner=card.querySelector('.fx-tilt-in');var max=9;
  card.addEventListener('mousemove',function(e){var r=inner.getBoundingClientRect();var px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;
   card.style.setProperty('--ry',((px-.5)*2*max).toFixed(2)+'deg');card.style.setProperty('--rx',((py-.5)*-2*max).toFixed(2)+'deg');
   card.style.setProperty('--mx',(px*100).toFixed(1)+'%');card.style.setProperty('--my',(py*100).toFixed(1)+'%');});
  card.addEventListener('mouseleave',function(){card.style.setProperty('--rx','0deg');card.style.setProperty('--ry','0deg');});});})();

/* hero spotlight */
(function(){var h=document.getElementById('hero');h.addEventListener('mousemove',function(e){var r=h.getBoundingClientRect();
 h.querySelector('.spot').style.setProperty('--mx',((e.clientX-r.left)/r.width*100)+'%');h.querySelector('.spot').style.setProperty('--my',((e.clientY-r.top)/r.height*100)+'%');});})();

/* hero sparkline draw */
(function(){var pts=DATA.filter(function(b){return b.v>0;}).map(function(b,i,a){return [i/(a.length-1)*320,88-(b.v/MAX*80)-4];});
 var d=pts.map(function(p,i){return(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' ');
 var area=d+' L320 88 L'+pts[0][0]+' 88 Z';
 var svg=document.querySelector('.hero-spark');
 svg.innerHTML='<defs><linearGradient id="hs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E7DFF" stop-opacity=".35"/><stop offset="1" stop-color="#2E7DFF" stop-opacity="0"/></linearGradient></defs>'+
  '<path d="'+area+'" fill="url(#hs)"/><path d="'+d+'" fill="none" stroke="#5b9bff" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur="1.1s" begin="0.2s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1" values="1;0"/></path>';})();

/* chart : grow bars, draw trajectory, ping */
(function(){
 var pts=DATA.map(function(b,i){return b.v>0?[(i+0.5)/DATA.length*100,100-(b.v/MAX*100)]:null;}).filter(Boolean);
 var d=pts.map(function(p,i){return(i?'L':'M')+p[0].toFixed(2)+' '+p[1].toFixed(2);}).join(' ');
 var pth=document.getElementById('trajP');pth.setAttribute('d',d);
 var len=pth.getTotalLength?pth.getTotalLength():100;pth.style.strokeDasharray=len;pth.style.strokeDashoffset=reduce?0:len;
 // avg line position
 document.getElementById('avg').style.bottom=(AVG/MAX*100)+'%';
 function play(){
  document.querySelectorAll('.fill').forEach(function(f,i){setTimeout(function(){f.style.transform='scaleY('+(f.dataset.h/100)+')';},reduce?0:90+i*34);});
  setTimeout(function(){document.getElementById('avg').classList.add('in');},reduce?0:400);
  if(!reduce){setTimeout(function(){pth.style.transition='stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)';pth.style.strokeDashoffset=0;},560);}
  // ping on current bar
  setTimeout(function(){var bars=document.querySelectorAll('.bars .bar');var cur=null;bars.forEach(function(b){if(b.classList.contains('cur'))cur=b;});
   if(cur){var ch=document.getElementById('chart').getBoundingClientRect();var r=cur.getBoundingClientRect();var ping=document.getElementById('ping');
    ping.style.left=(r.left-ch.left+r.width/2-6.5)+'px';ping.style.top=(r.top-ch.top+ (cur.querySelector('.v').getBoundingClientRect().bottom-r.top) -2)+'px';
    ping.style.top=( (100-DATA[12].v/MAX*100)/100*(ch.height-48)+22-6 )+'px';ping.classList.add('go');}},reduce?0:1600);
 }
 // lancer quand visible
 var io=new IntersectionObserver(function(en){en.forEach(function(e){if(e.isIntersecting){play();io.disconnect();}});},{threshold:.3});
 io.observe(document.getElementById('chart'));
})();

/* particle-network 3D (Three.js) */
(function(){var host=document.getElementById('fxNet');var gl=null;try{gl=document.createElement('canvas').getContext('webgl');}catch(e){}
 if(!window.THREE||!gl||reduce){document.body.classList.add('no-webgl');return;}
 var COUNT=120,RADIUS=34,LINK=8.5;
 var w=function(){return innerWidth;},h=function(){return innerHeight;};
 var scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(60,w()/h(),1,300);cam.position.z=54;
 var rnd=new THREE.WebGLRenderer({antialias:true,alpha:true});rnd.setPixelRatio(Math.min(devicePixelRatio,2));rnd.setSize(w(),h());host.appendChild(rnd.domElement);
 var pos=new Float32Array(COUNT*3),vel=[];
 for(var i=0;i<COUNT;i++){var r=RADIUS*Math.cbrt(Math.random()),th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1);
  pos[i*3]=r*Math.sin(ph)*Math.cos(th);pos[i*3+1]=r*Math.sin(ph)*Math.sin(th);pos[i*3+2]=r*Math.cos(ph);
  vel.push([(Math.random()-.5)*.03,(Math.random()-.5)*.03,(Math.random()-.5)*.03]);}
 var pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
 var points=new THREE.Points(pg,new THREE.PointsMaterial({size:.85,color:0x9fc3ff,transparent:true,opacity:.9}));
 var lineGeo=new THREE.BufferGeometry(),maxSeg=COUNT*10,linePos=new Float32Array(maxSeg*6);
 lineGeo.setAttribute('position',new THREE.BufferAttribute(linePos,3));
 var lines=new THREE.LineSegments(lineGeo,new THREE.LineBasicMaterial({color:0x2E7DFF,transparent:true,opacity:.22}));
 var world=new THREE.Group();world.add(points,lines);scene.add(world);
 var tmx=0,tmy=0,mx=0,my=0;
 addEventListener('pointermove',function(e){tmx=e.clientX/innerWidth-.5;tmy=e.clientY/innerHeight-.5;});
 addEventListener('resize',function(){cam.aspect=w()/h();cam.updateProjectionMatrix();rnd.setSize(w(),h());});
 function rebuild(){var n=0;for(var i=0;i<COUNT;i++)for(var j=i+1;j<COUNT;j++){var dx=pos[i*3]-pos[j*3],dy=pos[i*3+1]-pos[j*3+1],dz=pos[i*3+2]-pos[j*3+2];
  if(dx*dx+dy*dy+dz*dz<LINK*LINK&&n<maxSeg){linePos[n*6]=pos[i*3];linePos[n*6+1]=pos[i*3+1];linePos[n*6+2]=pos[i*3+2];linePos[n*6+3]=pos[j*3];linePos[n*6+4]=pos[j*3+1];linePos[n*6+5]=pos[j*3+2];n++;}}
  lineGeo.setDrawRange(0,n*2);lineGeo.attributes.position.needsUpdate=true;}
 (function loop(){requestAnimationFrame(loop);for(var i=0;i<COUNT;i++)for(var a=0;a<3;a++){pos[i*3+a]+=vel[i][a];if(pos[i*3+a]>RADIUS||pos[i*3+a]<-RADIUS)vel[i][a]*=-1;}
  pg.attributes.position.needsUpdate=true;rebuild();mx+=(tmx-mx)*.05;my+=(tmy-my)*.05;world.rotation.y+=.0011;world.rotation.x=my*.5;world.rotation.y+=mx*.02;rnd.render(scene,cam);})();
})();
</script>
</body></html>
