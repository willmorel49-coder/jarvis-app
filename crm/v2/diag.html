<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>JARVIS · Où ça casse</title>
<!--
  Diagnostic par ETAPES — 15/08/2026.
  Sur l'iPhone de Will : « Données non chargées », alors que le même compte
  fonctionne sur ordinateur. Le fichier vient maintenant de notre propre
  serveur (plus de Supabase) et ne pèse que 6,3 Mo sur le réseau, compressé.
  Reste à savoir OÙ ça casse : au téléchargement, à l'exécution, au décodage,
  ou à la mise en forme.

  Cette page refait EXACTEMENT les quatre étapes de l'app, dans l'ordre, et
  affiche le résultat de chacune AU FUR ET A MESURE — pour que le verdict
  reste lisible même si la page est tuée par le téléphone en cours de route.

  Aucun mot de passe : le fichier est public. Elle ne modifie rien.
  A SUPPRIMER une fois la panne comprise.
-->
<style>
  :root{ --bleu:#0050E6; --encre:#10131C; --gris:#737A8C; --ligne:#E4E8F0;
         --fond:#FBFCFE; --vert:#12A150; --rouge:#D92D20; }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--fond);color:var(--encre);
    font:16px/1.5 -apple-system,system-ui,sans-serif;-webkit-text-size-adjust:100%}
  .w{max-width:620px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--gris);font-size:14px;margin:0 0 18px}
  button{width:100%;min-height:52px;background:var(--bleu);color:#fff;border:none;
    border-radius:12px;font:600 17px system-ui;cursor:pointer;margin-bottom:18px}
  .e{background:#fff;border:1px solid var(--ligne);border-left-width:5px;
     border-radius:12px;padding:13px 15px;margin-bottom:10px}
  .e .t{font-weight:600;font-size:15px}
  .e .d{font-size:14px;color:var(--gris);margin-top:3px}
  .att{border-left-color:#C9CEDA}
  .ok{border-left-color:var(--vert)}  .ok .t{color:var(--vert)}
  .ko{border-left-color:var(--rouge)} .ko .t{color:var(--rouge)}
  #fin{margin-top:18px;padding:15px;border-radius:12px;background:#fff;
       border:1px solid var(--ligne);font-size:15px;display:none}
  #fin b{display:block;margin-bottom:6px}
</style>
</head>
<body>
<div class="w">
  <h1>Où est-ce que ça casse ?</h1>
  <p class="sub">Quatre étapes, dans l'ordre. La première qui passe au rouge est la réponse.</p>

  <button id="go">Lancer</button>

  <div id="etapes"></div>
  <div id="fin"></div>
</div>

<script>
(function () {
  var FICHIER = 'wml-officines-data.js?v=20260813s';
  var etapes = document.getElementById('etapes');
  var boites = {};

  function etape(cle, titre) {
    var d = document.createElement('div');
    d.className = 'e att';
    d.innerHTML = '<div class="t">' + titre + '</div><div class="d">en attente…</div>';
    etapes.appendChild(d);
    boites[cle] = d;
  }
  function maj(cle, etat, detail) {
    var d = boites[cle];
    if (!d) return;
    d.className = 'e ' + etat;
    d.querySelector('.d').textContent = detail;
  }
  function verdict(txt) {
    var f = document.getElementById('fin');
    f.style.display = 'block';
    f.innerHTML = '<b>Ce qu\'il faut retenir</b>' + txt;
  }
  function mo(n) { return (Math.round(n / 1e5) / 10) + ' Mo'; }

  document.getElementById('go').onclick = function () {
    this.disabled = true;
    this.textContent = 'En cours…';
    etapes.innerHTML = ''; boites = {};

    etape('appareil', 'L\'appareil');
    etape('tel', '1 · Télécharger le fichier');
    etape('exe', '2 · Le lire (c\'est ici que la mémoire compte)');
    etape('dec', '3 · Décoder les ventes');
    etape('obj', '4 · Mettre en forme les 437 848 ventes');

    var ua = navigator.userAgent || '';
    var quoi = /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) ? 'iPad' : /Mac/.test(ua) ? 'Mac' : 'autre';
    var inst = false;
    try { inst = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) {}
    maj('appareil', 'ok', quoi + (inst ? ' · depuis l\'icône installée' : ' · dans le navigateur')
      + (navigator.deviceMemory ? ' · ' + navigator.deviceMemory + ' Go annoncés' : ''));

    // Une erreur non rattrapée (mémoire saturée) doit être VUE.
    window.addEventListener('error', function (ev) {
      verdict('Le navigateur a levé une erreur : <b style="display:inline">'
        + ((ev && ev.message) || 'inconnue') + '</b>');
    });

    var t0 = Date.now();
    fetch(FICHIER, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function (txt) {
        maj('tel', 'ok', mo(txt.length) + ' reçus en ' + Math.round((Date.now() - t0) / 1000) + ' s');
        // ── 2. LIRE : c'est l'étape qui coûte le plus de mémoire ────────
        return new Promise(function (res, rej) {
          var s = document.createElement('script');
          s.src = URL.createObjectURL(new Blob([txt], { type: 'application/javascript' }));
          s.onload = function () { res(); };
          s.onerror = function () { rej(new Error('le fichier n\'a pas pu être lu')); };
          document.head.appendChild(s);
        });
      })
      .then(function () {
        var O = window.WML_OFFICINES, V = window.WML_SALES;
        if (!O || !V) {
          maj('exe', 'ko', 'le fichier a été lu, mais il n\'a rien déposé — la lecture s\'est arrêtée en route');
          verdict('C\'est la MÉMOIRE du téléphone. Le fichier arrive bien, mais l\'iPhone '
            + 'n\'arrive pas à le lire jusqu\'au bout. Le correctif est de le découper.');
          throw new Error('stop');
        }
        maj('exe', 'ok', O.length + ' officines · ' + V.length + ' lignes de vente');

        // ── 3. DÉCODER (format compacté du 13/08) ───────────────────────
        var dO = window.WML_D_OFFICINES, dC = window.WML_D_COMMERCIAUX, dP = window.WML_D_PRODUITS;
        if (!(dO && dC && dP)) { maj('dec', 'ok', 'pas nécessaire (fichier en clair)'); return V; }
        var t1 = Date.now();
        var dec = V.map(function (s) { return [dO[s[0]], s[1], dC[s[2]], dP[s[3]], s[4], s[5], s[6]]; });
        maj('dec', 'ok', 'fait en ' + (Date.now() - t1) + ' ms');
        return dec;
      })
      .then(function (V) {
        // ── 4. METTRE EN FORME : 437 848 objets, l'étape la plus lourde ──
        var t2 = Date.now();
        var out = V.map(function (s) {
          return { pharmacyId: String(s[0]), month: s[1], year: 2026, commercial: s[2] || '',
                   artCode: s[3], qte: s[4] || 0, puNet: s[5] || 0, mntNetHt: s[6] || 0 };
        });
        maj('obj', 'ok', out.length.toLocaleString('fr-FR') + ' ventes mises en forme en '
          + (Date.now() - t2) + ' ms');
        verdict('Tout passe sur cet appareil. Si l\'app échoue quand même ici, '
          + 'c\'est qu\'elle fait autre chose en plus au même moment.');
      })
      .catch(function (e) {
        if (e && e.message === 'stop') return;
        // Quelle étape était encore en attente ? C'est celle qui a cassé.
        var ordre = ['tel', 'exe', 'dec', 'obj'];
        for (var i = 0; i < ordre.length; i++) {
          if (boites[ordre[i]] && boites[ordre[i]].className.indexOf('att') >= 0) {
            maj(ordre[i], 'ko', (e && e.message) || 'échec');
            if (ordre[i] === 'tel') {
              verdict('C\'est le RÉSEAU : le fichier n\'arrive pas. Réessaie en Wi-Fi.');
            } else {
              verdict('C\'est la MÉMOIRE du téléphone : il n\'arrive pas à traiter '
                + 'un fichier de cette taille. Le correctif est de le découper.');
            }
            break;
          }
        }
      });
  };
})();
</script>
</body>
</html>
