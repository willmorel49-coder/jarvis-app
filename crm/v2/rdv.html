<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<title>Prendre rendez-vous</title>
<!-- Sans ça le navigateur du pharmacien réclame /favicon.ico à la racine du
     domaine et se prend un 404 : page nue dans l'onglet, erreur dans la console. -->
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<style>
  /* ── Direction « Trois moments » (p1), choisie par Will le 25/08/2026 ──
     La page disait CORRECTEMENT quoi faire, mais elle était anonyme : cinq
     cartes blanches identiques, ni le nom de l'expéditeur, ni la durée, ni
     ce qui se passe après. Un pharmacien qui ne sait pas ce qu'il engage
     ne clique pas. Fond clair AVEC source de lumière — un aplat clair sans
     lumière est plus mort qu'un noir. */
  :root { --bleu:#0050E6; --bleu-f:#0039A8; --bleu-c:#EAF0FE; --encre:#10131C;
          --gris:#5B6577; --gris-c:#8792A6; --bord:#E3E8F0; --fond:#FBFCFE;
          --vert:#0F7A52; --vert-f:#E6F5EE; }
  * { box-sizing:border-box; }
  body { margin:0; color:var(--encre); overflow-x:clip;
         font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         background:#F7F9FC;
         background-image:radial-gradient(130% 55% at 50% -8%,#FFFFFF 0%,#F1F5FC 48%,#EAEFF8 100%);
         background-attachment:fixed;
         -webkit-text-size-adjust:100%; }
  .wrap { max-width:560px; margin:0 auto; padding:24px 18px 56px; }
  .carte { background:#fff; border:1px solid var(--bord); border-radius:16px; padding:20px; margin-bottom:14px; }
  h1 { font-size:22px; margin:0 0 6px; letter-spacing:-.01em; }
  .sub { color:var(--gris); margin:0 0 4px; }
  .jour { font-weight:600; margin:0 0 10px; }
  .creneaux { display:flex; flex-wrap:wrap; gap:10px; }
  .cr { min-height:48px; min-width:96px; padding:12px 16px; font-size:17px; font-weight:600;
        background:#fff; color:var(--bleu); border:1.5px solid var(--bleu); border-radius:12px;
        cursor:pointer; font-family:inherit; }
  .cr:active { background:var(--bleu); color:#fff; }
  .lien { display:inline-block; min-height:44px; padding:12px 0; color:var(--bleu); background:none;
          border:0; font-size:16px; text-decoration:underline; cursor:pointer; font-family:inherit; }
  .btn { display:inline-block; min-height:48px; padding:14px 22px; background:var(--bleu); color:#fff;
         border:0; border-radius:12px; font-size:17px; font-weight:600; text-decoration:none;
         cursor:pointer; font-family:inherit; }
  .btn[disabled] { opacity:.6; }
  label { display:block; font-weight:600; margin:14px 0 6px; }
  input, textarea { width:100%; font-size:16px; padding:12px; border:1px solid var(--bord);
                    border-radius:10px; font-family:inherit; }
  a { color:var(--bleu); }
  .err { color:#C7283D; }
  .ok { font-size:19px; font-weight:600; margin:0 0 6px; }

  /* ── Qui écrit. Une page signée se lit, une page anonyme se ferme. ── */
  .qui { display:flex; align-items:center; gap:14px; padding:22px 4px 20px; }
  .av { flex:0 0 52px; height:52px; border-radius:99px; display:flex; align-items:center;
        justify-content:center; font-size:20px; font-weight:800; color:#fff; letter-spacing:-.02em;
        background:linear-gradient(150deg,#0B5BEE,#0039A8);
        box-shadow:0 1px 0 rgba(255,255,255,.35) inset, 0 10px 22px -12px rgba(0,57,168,.9); }
  .qui b { display:block; font-size:16px; font-weight:700; }
  .qui small { display:block; font-size:13.5px; color:var(--gris); }

  /* ── Ce que ça engage, dit AVANT le choix, pas après. ──
     ⚠️ La durée est LUE dans le réglage du commercial, jamais écrite ici :
     le 19/08/2026 un mail promettait « quinze minutes » pendant que l'agenda
     en bloquait 45. Un chiffre annoncé à un tiers se lit, il ne se code pas. */
  .faits { display:flex; gap:9px; flex-wrap:wrap; margin:0 0 22px; }
  .fait { display:inline-flex; align-items:center; gap:7px; padding:8px 13px; border-radius:99px;
          background:#fff; border:1px solid var(--bord); font-size:13.5px; font-weight:600;
          box-shadow:0 1px 0 #fff inset, 0 5px 14px -10px rgba(16,19,28,.3); }
  .fait svg { color:var(--bleu); flex:0 0 auto; }

  .lbl { font-size:13px; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
         color:var(--gris-c); margin:0 0 11px; }

  /* ── Un jour = une carte. Les heures restent DEDANS : la maquette n'en
     montrait qu'une, mais le moteur en propose trois, et n'en garder qu'une
     ferait perdre six choix sur neuf. ── */
  .jc { padding:15px 16px 16px; margin-bottom:11px; background:#fff; border:1px solid var(--bord);
        border-radius:18px; box-shadow:0 1px 0 #fff inset, 0 10px 24px -16px rgba(16,19,28,.34); }
  .jc-t { display:flex; align-items:center; gap:14px; margin-bottom:13px; }
  .cal { flex:0 0 56px; height:60px; border-radius:14px; background:var(--bleu-c);
         border:1px solid #D8E5FD; display:flex; flex-direction:column; align-items:center;
         justify-content:center; line-height:1; }
  .cal .m { font-size:13px; font-weight:800; letter-spacing:.04em; text-transform:uppercase;
            color:var(--bleu); }
  .cal .d { font-size:24px; font-weight:800; letter-spacing:-.03em; color:var(--bleu-f);
            margin-top:3px; font-variant-numeric:tabular-nums; }
  .jc-t b { display:block; font-size:17px; font-weight:750; letter-spacing:-.015em; }
  .jc-t small { display:block; font-size:13.5px; color:var(--gris); margin-top:2px; }

  /* ── Les liens de secours étaient des mots soulignés de 17 px de haut.
     C'est pourtant CE lien qu'on touche quand rien ne convient. ── */
  .secours { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
  .secours a, .secours button { display:inline-flex; align-items:center; justify-content:center;
        gap:8px; min-height:48px; padding:0 18px; border-radius:14px; border:1px solid var(--bord);
        background:#fff; color:var(--encre); font:inherit; font-size:15px; font-weight:650;
        text-decoration:none; cursor:pointer; white-space:nowrap;
        box-shadow:0 1px 0 #fff inset, 0 6px 16px -12px rgba(16,19,28,.32); }
  .secours a[href^="tel:"] { color:var(--bleu); border-color:#CFDFFB; background:var(--bleu-c); }
  .pied { margin-top:22px; padding-top:18px; border-top:1px solid var(--bord);
          font-size:14px; color:var(--gris); }
  .autre { display:block; width:100%; min-height:52px; margin-top:4px; border-radius:14px;
           border:1px solid var(--bord); background:#fff; color:var(--encre); font-size:15.5px;
           font-weight:650; cursor:pointer; font-family:inherit; }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
