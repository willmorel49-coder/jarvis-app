<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Copilote — 10 propositions de refonte</title>
<style>
  :root{ --blue:#0057FF; --ink:#0B131C; --turq:#0E7C86; --bg:#F4F6FB; --line:#E2E7F0; --muted:#6B7590; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100dvh;overflow:hidden}
  header{flex:none;background:#fff;border-bottom:1px solid var(--line);padding:12px 16px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 1px 0 rgba(11,19,28,.03)}
  .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  h1{font-size:16px;font-weight:800;letter-spacing:-.01em;margin:0}
  h1 b{color:var(--blue)}
  .sub{font-size:12.5px;color:var(--muted)}
  .cur{margin:9px 0 11px;font-size:13px;line-height:1.45;color:var(--ink)}
  .cur b{font-weight:800}
  .cur .ap{color:var(--muted);display:block;margin-top:2px;font-size:12px}
  nav{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;scrollbar-width:thin}
  nav button{flex:none;display:inline-flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:128px;
    border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;cursor:pointer;font-family:inherit;
    text-align:left;transition:border-color .15s,transform .12s,box-shadow .15s;color:var(--ink)}
  nav button:hover{border-color:color-mix(in srgb,var(--blue) 40%,var(--line))}
  nav button.on{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 14%,transparent);transform:translateY(-1px)}
  nav .num{font-weight:800;font-size:13px}
  nav button.on .num{color:var(--blue)}
  nav .lbl{font-size:11px;color:var(--muted);white-space:nowrap}
  .frame{flex:1;position:relative;background:#fff}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
  .full{position:absolute;top:10px;right:12px;z-index:5;background:rgba(11,19,28,.92);color:#fff;text-decoration:none;
    font-size:12px;font-weight:700;padding:8px 12px;border-radius:9px;box-shadow:0 6px 18px rgba(11,19,28,.25);backdrop-filter:blur(4px)}
  .full:hover{background:var(--blue)}
</style>
</head>
<body>
<header>
  <div class="top"><h1>Copilote · carte — <b>10 propositions</b></h1><span class="sub">Touche un numéro · « Plein écran » pour bien tester · pensé pour tes 3 points : listing filtré, tournée, Google Maps</span></div>
  <div class="cur" id="cur"></div>
  <nav id="nav"></nav>
</header>
<div class="frame">
  <a class="full" id="full" href="#" target="_blank" rel="noopener">Ouvrir en plein écran ↗</a>
  <iframe id="fr" title="Maquette" src="_maq/copilote-design-11.html"></iframe>
</div>
<script>
  var D = [
    { n:11, lbl:'⭐ La fusion', title:'⭐ La fusion (4 + 6 + 9 + 10)', ap:'Ta sélection combinée : recherche pilote + listing filtré toujours visible + zones par département (drill-down) + composeur de tournée héros + gros bouton GPS Google Maps. C’est la base que j’intègre si elle te va.' },
    { n:1,  lbl:'Split live', title:'Split live — liste ↔ carte', ap:'Panneau LISTE filtrée toujours visible à côté de la carte, synchronisé en direct. Le survol relie liste et carte. → règle « on ne voit pas le listing ».' },
    { n:2,  lbl:'Command center', title:'Command center', ap:'Cockpit pro : KPI en haut (clients/prospects/CA/couverture) + carte + liste + tournée sur un seul écran.' },
    { n:3,  lbl:'Field app mobile', title:'Field app (mobile terrain)', ap:'Carte plein écran, filtre en haut, bottom-sheet tirable (liste puis tournée), gros bouton GPS. Pensé pouce.' },
    { n:4,  lbl:'Tournée au centre', title:'Tournée au centre', ap:'Le composeur de tournée est le héros (façon panier) : on ajoute, on voit l’ordre optimisé + horaires, gros CTA « Lancer le GPS ».' },
    { n:5,  lbl:'Table + carte', title:'Tableau + carte', ap:'Vrai tableau trié/filtrable (nom, ville, statut, groupement, CA, distance) lié à la carte ; cases à cocher → tournée.' },
    { n:6,  lbl:'Zones / La Loupe', title:'Zones (géomarketing)', ap:'Aplats de couleur par département → clic zone → liste des officines → tournée. Drill-down national → dépt → officine.' },
    { n:7,  lbl:'Kanban jours', title:'Kanban semaine', ap:'Colonnes par jour, on glisse les officines dans les jours ; chaque colonne calcule km/durée + bouton GPS.' },
    { n:8,  lbl:'Agenda timeline', title:'Agenda / frise horaire', ap:'La journée en frise 9h→18h : RDV ancrés, trajets entre visites, à côté de la carte ; GPS par segment.' },
    { n:9,  lbl:'Recherche pilote', title:'Recherche pilote', ap:'Une grande recherche pilote tout ; résultats en liste ET sur la carte instantanément ; sélection → tournée. Rapide, clavier.' },
    { n:10, lbl:'Esprit Google Maps', title:'Esprit Google Maps', ap:'Codes familiers de Google Maps : fiche officine, itinéraire à étapes numérotées, gros bouton bleu « Démarrer ». Le GPS devient évident.' },
  ];
  var nav = document.getElementById('nav'), fr = document.getElementById('fr'), cur = document.getElementById('cur'), full = document.getElementById('full');
  function sel(i){
    var d = D[i];
    fr.src = '_maq/copilote-design-' + d.n + '.html';
    full.href = '_maq/copilote-design-' + d.n + '.html';
    cur.innerHTML = '<b>' + d.n + '. ' + d.title + '</b><span class="ap">' + d.ap + '</span>';
    [].forEach.call(nav.children, function(b,k){ b.classList.toggle('on', k===i); });
    try{ nav.children[i].scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'}); }catch(e){}
  }
  D.forEach(function(d,i){
    var b = document.createElement('button');
    b.innerHTML = '<span class="num">' + d.n + '</span><span class="lbl">' + d.lbl + '</span>';
    b.onclick = function(){ sel(i); };
    nav.appendChild(b);
  });
  sel(0);
</script>
</body>
</html>
