<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Prendre rendez-vous — Intégral Pharma</title>
<!--
  Adresse courte des liens de campagne.

  Le lien envoyé au pharmacien faisait 101 caractères :
    …/jarvis-app/crm/v2/rdv.html?t=25887f7f-da34-41fb-8178-bcc36ac224da
  Or un mail en texte brut est replié vers 76 caractères. Le lien se coupait
  donc en DEUX lignes, et le pharmacien qui cliquait tombait sur une adresse
  tronquée. Mesuré, pas supposé.

  Avec cette page : …/jarvis-app/r?t=<jeton> — 60 caractères, une seule ligne.
  Le jeton reste le même ; seul le chemin raccourcit.
-->
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#FBFCFE;color:#10131C;padding:24px;
       font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .c{max-width:440px;background:#fff;border:1px solid #E3E8F0;border-radius:14px;padding:26px}
  h1{font-size:20px;font-weight:800;margin:0 0 10px}
  p{margin:0 0 12px;color:#5B6577}
  a{color:#0050E6;font-weight:600;word-break:break-all}
</style>
</head>
<body>
  <div class="c" id="c"><h1>Un instant…</h1><p>Nous ouvrons vos créneaux.</p></div>
<script>
(function () {
  var q = new URLSearchParams(window.location.search);
  var t = q.get('t') || '';        // lien de campagne, à usage unique
  var p = q.get('p') || '';        // lien permanent d'un commercial
  var cible = '';
  if (/^[0-9a-f-]{36}$/i.test(t)) cible = 'crm/v2/rdv.html?t=' + encodeURIComponent(t);
  else if (/^[a-z0-9][a-z0-9-]{0,31}$/i.test(p)) cible = 'crm/v2/rdv.html?p=' + encodeURIComponent(p.toLowerCase());

  if (cible) {
    var racine = window.location.pathname.replace(/[^/]*$/, '');
    window.location.replace(racine + cible);
    return;
  }
  document.getElementById('c').innerHTML =
    '<h1>Ce lien est incomplet</h1>' +
    '<p>Les messageries coupent parfois les adresses longues en deux. ' +
    'Vérifiez qu’il ne manque pas un morceau à la fin du lien que vous avez reçu.</p>' +
    '<p>Sinon, répondez simplement au mail : votre interlocuteur vous en renverra un.</p>';
})();
</script>
</body>
</html>
