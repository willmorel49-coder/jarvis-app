<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Infos du matin</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --card2:#1d2129; --line:#262b34;
    --txt:#e8ebf0; --mut:#8b93a1; --acc:#2f81f7; --acc2:#1f6feb;
    --ok:#2ea043; --warn:#d29922; --hot:#f85149;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) 0 0}
  .wrap{max-width:680px;margin:0 auto;padding:16px 14px 80px}
  header.infos-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:14px}
  .infos-head h1{font-size:21px;margin:0;letter-spacing:-.3px}
  .infos-head .date{color:var(--mut);font-size:12.5px;margin-top:2px}
  .maj{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:11.5px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
  .dot.off{background:var(--mut)}
  .btn{background:var(--card2);border:1px solid var(--line);color:var(--txt);
    border-radius:10px;padding:8px 11px;font-size:13px;font-weight:600;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px}
  .btn:active{transform:scale(.97)}
  .btn.acc{background:var(--acc2);border-color:var(--acc2)}
  .toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:13px 14px;margin-bottom:10px;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc)}
  .card.cat-reglementaire::before{background:#a371f7}
  .card.cat-ruptures::before{background:var(--hot)}
  .card.cat-generiques::before{background:#2ea043}
  .card.cat-offre::before{background:var(--warn)}
  .card .top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .tag{font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
    color:var(--mut);background:var(--card2);border:1px solid var(--line);
    padding:2px 7px;border-radius:6px}
  .urg{margin-left:auto;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px}
  .urg.haute{background:rgba(248,81,73,.15);color:#ff7b72}
  .urg.moyenne{background:rgba(210,153,34,.15);color:#e3b341}
  .card h3{font-size:15px;margin:2px 0 4px;line-height:1.3}
  .card p{margin:0;color:#c6ccd6;font-size:13.5px}
  .card .src{margin-top:7px;font-size:11.5px;color:var(--mut)}
  .skeleton{height:78px;border-radius:14px;margin-bottom:10px;
    background:linear-gradient(100deg,#171a21 30%,#1f242d 50%,#171a21 70%);
    background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .empty{color:var(--mut);text-align:center;padding:30px 10px;font-size:13.5px}
  .spin{animation:rot .8s linear infinite;display:inline-block}
  @keyframes rot{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <header class="infos-head">
    <div>
      <h1>Infos du matin</h1>
      <div class="date" id="infosDate"></div>
    </div>
    <div class="maj"><span class="dot" id="netDot"></span><span id="majTxt">—</span></div>
  </header>

  <div class="toolbar">
    <button class="btn acc" id="btnRefresh">↻ Actualiser</button>
    <button class="btn" id="btnSimNext">⏭ Simuler demain</button>
  </div>

  <div id="infosList"></div>
</div>

<script>
/* =====================================================================
   MODULE INFOS — actualisation matinale automatique
   ---------------------------------------------------------------------
   Principe : une page statique n'a pas de cron. La "mise à jour du matin"
   se déclenche à la 1re ouverture de la journée (ou au retour de focus iOS).
   On garde un cache daté en localStorage et on ne régénère qu'une fois/jour.
   Hors-ligne -> on affiche le dernier cache, jamais d'écran vide.
   ===================================================================== */

const INFOS_CONFIG = {
  storeKey: 'ip_infos_v1',
  refreshHour: 0,        // 0 = nouveau jour calendaire. Ex: 6 = pas avant 6h.
  provider: 'api'        // 'api' (Claude + web_search) | 'mock' (offline, démo)
};

/* ---------- utilitaires date / cache ---------- */
function dayKey(d){
  d = d || new Date();
  return d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');
}
function readCache(){
  try { return JSON.parse(localStorage.getItem(INFOS_CONFIG.storeKey) || 'null'); }
  catch(e){ return null; }
}
function writeCache(obj){
  try { localStorage.setItem(INFOS_CONFIG.storeKey, JSON.stringify(obj)); }
  catch(e){ /* quota / mode privé : on ignore */ }
}
function needsRefresh(){
  const c = readCache();
  if(!c || c.day !== dayKey()) {
    return new Date().getHours() >= INFOS_CONFIG.refreshHour;
  }
  return false;
}

/* ---------- providers de contenu (interchangeables) ---------- */

// 1) MOCK : tourne hors-ligne, sert de démo + fallback
async function provideMock(){
  await new Promise(r => setTimeout(r, 600)); // simule latence
  return [
    { cat:'ruptures', urgence:'haute', titre:'Rupture MITM — antibiotique injectable',
      contenu:'Tension confirmée sur 2 references du panier type. Pousser les alternatives IP en stock chez les officines concernees.',
      source:'ANSM / stock OPS' },
    { cat:'generiques', urgence:'moyenne', titre:'Nouveau biosimilaire disponible',
      contenu:'Lancement molecule du module biosimilaires. Marge officine superieure au princeps, argumentaire pret.',
      source:'Repertoire ANSM' },
    { cat:'offre', urgence:'moyenne', titre:'Offre IP 2026 — prix nets actualises',
      contenu:'12 references repassent sous la tranche petit prix. A mettre en avant sur le catalogue client.',
      source:'TOP IP prix nets' },
    { cat:'marche', titre:'Mouvement concurrent',
      contenu:'Remise abandonnee detectee chez un concurrent sur 3 references chaine du froid. Angle d&#39;attaque clair.',
      source:'Veille prix' }
  ];
}

// 2) API : génère le brief veille du jour via Claude + web_search
async function provideAPI(){
  const auj = new Date().toLocaleDateString('fr-FR',
    {weekday:'long',day:'numeric',month:'long',year:'numeric'});

  const prompt = `Nous sommes le ${auj}. Tu es analyste veille pour un grossiste-repartiteur
pharmaceutique francais (regions Pays de la Loire, Normandie, Centre-Val de Loire).
Cherche sur le web les infos des dernieres 48h utiles a un commercial terrain en officine :
ruptures et tensions MITM, alertes ANSM, lancements generiques/biosimilaires, evolutions
prix/remboursement (CEPS, JO), mouvements marche officine. Sources fiables FR a privilegier :
ansm.sante.fr, Le Moniteur des pharmacies, APM News, Journal Officiel, ameli.
3 a 5 items, concrets et actionnables, sans redite.
Reponds UNIQUEMENT par un tableau JSON, rien d&#39;autre :
[{"cat":"marche|generiques|reglementaire|ruptures|offre","urgence":"haute|moyenne|null","titre":"...","contenu":"...","source":"..."}]`;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
      /* + 'x-api-key': TA_CLE  (ou ton proxy existant de l'assistant IA) */
    },
    body: JSON.stringify({
      model:'claude-sonnet-4-6',
      max_tokens:1200,
      messages:[{ role:'user', content: prompt }],
      tools:[{ type:'web_search_20250305', name:'web_search', max_uses:4 }]
    })
  });
  if(!res.ok) throw new Error('API ' + res.status);
  const data = await res.json();

  // web_search => plusieurs blocs ; le JSON final est dans le DERNIER bloc text
  const texts = (data.content || []).filter(b => b.type === 'text').map(b => b.text);
  let raw = (texts[texts.length - 1] || '').replace(/```json|```/g,'');
  const s = raw.indexOf('['), e = raw.lastIndexOf(']');
  if(s >= 0 && e > s) raw = raw.slice(s, e + 1);
  return JSON.parse(raw);
}

function getProvider(){
  return INFOS_CONFIG.provider === 'api' ? provideAPI : provideMock;
}

/* ---------- rendu ---------- */
function renderList(items){
  const box = document.getElementById('infosList');
  if(!items || !items.length){ box.innerHTML = '<div class="empty">Aucune info pour le moment.</div>'; return; }
  box.innerHTML = items.map(it => {
    const cat = (it.cat || 'marche');
    const urg = it.urgence && it.urgence !== 'null'
      ? '<span class="urg '+it.urgence+'">'+it.urgence+'</span>' : '';
    const src = it.source ? '<div class="src">'+it.source+'</div>' : '';
    return '<div class="card cat-'+cat+'"><div class="top">'
      + '<span class="tag">'+cat+'</span>'+urg+'</div>'
      + '<h3>'+it.titre+'</h3><p>'+it.contenu+'</p>'+src+'</div>';
  }).join('');
}
function renderSkeleton(){
  document.getElementById('infosList').innerHTML =
    '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
}
function updateMeta(cache){
  document.getElementById('infosDate').textContent =
    new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  const dot = document.getElementById('netDot');
  dot.className = 'dot' + (navigator.onLine ? '' : ' off');
  const t = cache && cache.ts ? new Date(cache.ts) : null;
  document.getElementById('majTxt').textContent = t
    ? 'MAJ ' + t.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})
    : (navigator.onLine ? '—' : 'hors-ligne');
}

/* ---------- orchestration ---------- */
let refreshing = false;
async function refreshInfos(force){
  if(refreshing) return;
  if(!force && !needsRefresh()){           // déjà à jour aujourd'hui
    const c = readCache(); renderList(c && c.items); updateMeta(c); return;
  }
  if(!navigator.onLine && INFOS_CONFIG.provider === 'api'){ // pas de réseau -> cache
    const c = readCache();
    if(c){ renderList(c.items); updateMeta(c); }
    else { renderList(await provideMock()); updateMeta(null); } // 1er lancement offline
    return;
  }
  refreshing = true;
  const btn = document.getElementById('btnRefresh');
  btn.innerHTML = '<span class="spin">↻</span> ...';
  if(!readCache()) renderSkeleton();
  try{
    const items = await getProvider()();
    const cache = { day: dayKey(), ts: Date.now(), items };
    writeCache(cache);
    renderList(items); updateMeta(cache);
  }catch(e){
    const c = readCache();                  // échec -> on garde l'ancien
    renderList(c && c.items); updateMeta(c);
  }finally{
    refreshing = false;
    btn.innerHTML = '↻ Actualiser';
  }
}

/* ---------- déclencheurs "matin" ---------- */
function initInfos(){
  const c = readCache(); renderList(c && c.items); updateMeta(c);
  refreshInfos(false);                       // ouverture
  document.addEventListener('visibilitychange', () => {        // retour de focus iOS
    if(document.visibilityState === 'visible') refreshInfos(false);
  });
  window.addEventListener('online', () => refreshInfos(false));
  window.addEventListener('offline', () => updateMeta(readCache()));
  document.getElementById('btnRefresh').onclick = () => refreshInfos(true);

  // debug : simule l'ouverture du lendemain
  document.getElementById('btnSimNext').onclick = () => {
    const c = readCache(); if(c){ c.day = 'reset'; writeCache(c); }
    refreshInfos(false);
  };
}
document.addEventListener('DOMContentLoaded', initInfos);
</script>
</body>
</html>
