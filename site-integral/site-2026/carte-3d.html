<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte du réseau</title>
<meta name="description" content="Carte du réseau Intégral Pharma : huit agences et un partenaire.">
<!--
  LA CARTE DU RÉSEAU — refaite le 28/09/2026.

  Ce qu'elle remplace : une carte en three.js (champ d'étoiles, France extrudée,
  faisceaux verticaux, arcs qui filaient de chaque agence vers le siège). Will :
  « trop Star Wars », penchée, « on dirait une migration vers le siège ».

  La règle qui avait fini par marcher le 30/08, et qu'on applique ici :
  LA CARTE NE DOIT RIEN INVENTER QUE LA PAGE NE DISE DÉJÀ. La légende annonce
  trois repères — point orange pour une agence, point blanc cerclé d'orange pour
  le siège, point bleu pâle pour Pharmest — alors on dessine ces trois-là, et
  rien d'autre.

  Donc : plus de 3D, plus de WebGL, plus de contexte GPU tenu en permanence
  (da-will § 4 bis : c'est le profil qui fait figer le Mac). Un SVG à plat, vu de
  face, dans le repère 0→100 partagé avec la carte de la page RSE — celle qui
  plaît — et avec `carte.js`, d'où viennent le contour (Corse comprise) et les
  positions des neuf sites.

  Contre la platitude, qui est le vrai motif de ses rejets : une source de
  lumière, une seule, chaude, posée sur le sud-est où se trouve le siège. Pas un
  effet : une lumière. Aucun `filter:blur`, aucun `backdrop-filter`.

  Le mouvement : le tracé se pose, les points arrivent du sud vers le nord,
  PUIS PLUS RIEN NE BOUGE. Aucune boucle d'animation.

  L'usage, validé le 18/09 après un rejet, est conservé mot pour mot :
  survol = éclairer seulement · CLIC = la fiche s'ouvre et RESTE (croix, Échap,
  clic dans le vide, ou une autre agence) · le mail et le numéro sont ÉCRITS
  dans les boutons · « Écrire au groupe » quand l'agence n'a pas de coordonnées.

  Hyères, Flassans et Le Cannet sont à moins de 3 unités sur 100 : au doigt,
  trois cibles à sept pixels l'une de l'autre. Leurs noms sont donc déportés en
  mer, reliés par un fil à leur emplacement exact — et c'est la LISTE de droite
  qui porte les vraies cibles tactiles. La carte situe, la liste dit.
-->
<style>
@font-face{
  font-family:"Inter";
  src:url("polices/inter.woff2") format("woff2");
  font-weight:100 900;font-style:normal;font-display:swap;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#0B1220}
body{
  font-family:"Inter",system-ui,sans-serif;
  color:#FFFFFF;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.page{padding:16px;display:flex;flex-direction:column;gap:12px;min-height:0}

/* ═════ LA CARTE ═════════════════════════════════════════════════════════════
   Le fond n'est pas un aplat : la lumière vient du sud-est, de là où est le
   siège. C'est la seule chose qui donne du relief, et elle ne coûte rien. */
.carte{position:relative;height:clamp(420px,42vw,660px);border-radius:18px;overflow:hidden;
  border:1px solid rgba(255,255,255,.13);
  background:
    radial-gradient(58% 62% at 74% 82%, rgba(243,154,27,.20) 0%, rgba(243,154,27,.055) 42%, rgba(243,154,27,0) 72%),
    radial-gradient(90% 90% at 30% 8%, rgba(92,151,255,.10) 0%, rgba(92,151,255,0) 60%),
    linear-gradient(170deg,#101A2E 0%,#0B1220 52%,#080D18 100%)}
.carte svg{position:absolute;inset:0;width:100%;height:100%;display:block}

.fr__pays{fill:url(#terre);stroke:rgba(159,190,255,.55);stroke-width:.16;
  stroke-linejoin:round;vector-effect:non-scaling-stroke}
.fr__fil{fill:none;stroke:rgba(243,154,27,.45);stroke-width:1;vector-effect:non-scaling-stroke}
.fr__fil--part{stroke:rgba(92,151,255,.42)}

/* les trois repères de la légende, et rien de plus */
.fr__pt{fill:#F39A1B;transition:r .18s ease,fill .18s ease}
.fr__pt--siege{fill:#FFFFFF}
.fr__pt--part{fill:rgba(92,151,255,.9)}
.fr__anneau{fill:none;stroke:#F39A1B;stroke-width:1.6;vector-effect:non-scaling-stroke}
/* l'onde ne bat que sur le siège : elle le désigne, elle n'aspire rien */
.fr__onde{fill:none;stroke:rgba(255,196,107,.75);stroke-width:1.2;vector-effect:non-scaling-stroke;
  transform-box:fill-box;transform-origin:center;animation:onde 3.4s cubic-bezier(.22,1,.36,1) infinite}
@keyframes onde{0%{transform:scale(.7);opacity:.85}70%{transform:scale(2.3);opacity:0}100%{transform:scale(2.3);opacity:0}}

/* ═════ LES NOMS — en HTML, donc jamais mis à l'échelle avec le dessin ═══════
   (piège payé sur la carte de l'intranet : un SVG qui rétrécit emporte sa
   typographie avec lui, et les noms tombent à 7 px.) */
.pt{position:absolute;display:flex;align-items:center;gap:7px;padding:9px 6px;margin:0;
  border:0;background:none;font:inherit;color:inherit;cursor:pointer;white-space:nowrap;
  transform:translate(calc(-50% + var(--nx,0px)),calc(-50% + var(--ny,0px)));
  border-radius:10px;min-height:38px}
.pt--d{transform:translate(var(--nx,0px),calc(-50% + var(--ny,0px)));padding-left:16px}
.pt--g{transform:translate(calc(-100% + var(--nx,0px)),calc(-50% + var(--ny,0px)));
  padding-right:16px;justify-content:flex-end}
.pt__n{font-size:13.5px;font-weight:500;letter-spacing:-.005em;color:#DCE6FA;
  text-shadow:0 1px 6px rgba(8,13,24,.9),0 0 14px rgba(8,13,24,.7);transition:color .18s ease}
.pt--siege .pt__n{font-weight:700;color:#FFE2B3;font-size:14px}
.pt--part .pt__n{color:#BCCDEA}
.pt:hover .pt__n,.pt:focus-visible .pt__n{color:#FFFFFF}
.pt.is-sel .pt__n{color:#FFFFFF;font-weight:700}
.pt__tag{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:#FFC46B;border:1px solid rgba(243,154,27,.5);border-radius:99px;padding:2px 7px}
.pt--part .pt__tag{color:#A7ACB6;border-color:rgba(255,255,255,.18)}
.pt:focus-visible{outline:2px solid #FFC46B;outline-offset:2px}

.carte__badge{position:absolute;left:14px;top:12px;display:flex;align-items:center;gap:8px;
  font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:#A7ACB6;
  background:rgba(11,18,32,.6);border:1px solid rgba(255,255,255,.10);border-radius:999px;padding:6px 12px;z-index:5}
.carte__badge .dot{width:6px;height:6px;border-radius:50%;background:#F39A1B}
/* une phrase entière en capitales ne se lit plus : on ne garde les capitales
   que sur l'étiquette courte qui ouvre la ligne. */
.badge-full,.liste__cap i{text-transform:none;letter-spacing:0;font-style:normal;font-size:12px}

/* ═════ LA FICHE — inchangée dans son usage, validée le 18/09 ════════════════ */
.info{position:absolute;overflow:hidden;left:14px;bottom:14px;z-index:6;width:min(340px,calc(100% - 28px));
  background:rgba(9,14,26,.96);border:1px solid rgba(120,150,255,.30);border-radius:14px;
  padding:13px 15px;opacity:0;transform:translateY(10px);pointer-events:none;
  transition:opacity .28s ease,transform .35s cubic-bezier(.22,1,.36,1);box-shadow:0 22px 55px -22px rgba(0,0,0,.85)}
.info.on{opacity:1;transform:none;pointer-events:auto}
.mi__photo{display:block;width:calc(100% + 30px);margin:-13px -15px 12px;aspect-ratio:16/9;object-fit:cover;border-radius:13px 13px 0 0}
.mi__photo[hidden]{display:none}
.mi__type{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;color:#0A1430;background:#5C97FF;border-radius:999px;padding:3px 9px;margin-bottom:9px}
.info.siege .mi__type{background:linear-gradient(180deg,#FFC673,#F39A1B);color:#241200}
.info.part .mi__type{background:transparent;border:1px dashed #9FB4D8;color:#C9D6EE}
.mi__name{font-weight:600;font-size:17px;color:#FFFFFF;letter-spacing:-.01em;line-height:1.15;padding-right:26px}
.mi__city{font-size:14px;color:#A7ACB6;margin-top:3px}
.mi__close{position:absolute;right:6px;top:6px;width:36px;height:36px;border:0;border-radius:50%;background:transparent;
  color:#A7ACB6;font-size:20px;line-height:1;cursor:pointer}
.mi__close:hover,.mi__close:focus-visible{background:rgba(255,255,255,.10);color:#fff}
.mi__actions{display:none;gap:8px;margin-top:11px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08);flex-wrap:wrap}
.mi__btn{display:inline-flex;align-items:center;justify-content:flex-start;gap:6px;min-height:40px;width:100%;
  font-size:12.5px;font-weight:600;text-decoration:none;border-radius:999px;padding:0 14px;cursor:pointer}
.mi__btn small{font-weight:400;font-size:12.5px;opacity:.85;margin-left:auto;padding-left:10px;overflow:hidden;text-overflow:ellipsis}
.mi__btn--mail{background:linear-gradient(180deg,#FFC673,#F39A1B);color:#241200}
.mi__btn--tel{background:rgba(255,255,255,.08);color:#EAF0FF;border:1px solid rgba(255,255,255,.18)}

/* ═════ LA LÉGENDE — elle décrit exactement ce qui est dessiné ═══════════════ */
.pied{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 22px;
  font-size:13px;font-weight:500;color:#A7ACB6;padding:2px 0 4px}
.pied span{display:inline-flex;align-items:center;gap:8px}
.lg{width:11px;height:11px;border-radius:50%}
.lg.o{background:#F39A1B}
.lg.s{background:#FFFFFF;box-shadow:0 0 0 2px #F39A1B}
.lg.p{background:rgba(92,151,255,.9)}
.pied .hint{color:#7C89AC}

/* ═════ LA LISTE — c'est elle qui porte les vraies cibles tactiles ═══════════ */
.grille{display:flex;gap:14px;align-items:stretch}
.zone{position:relative;flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.zone > .carte{flex:1 1 auto}
.liste{flex:0 0 clamp(220px,27%,300px);display:flex;flex-direction:column;gap:8px}
.liste__cap{font-size:11px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:#7C89AC}
.liste__cap i{color:#FFC46B;font-weight:500}
.liste__l{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:7px;padding-right:4px}
.estab{display:flex;align-items:center;gap:11px;width:100%;border:1px solid rgba(255,255,255,.10);border-radius:12px;
  padding:9px 12px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
  font:inherit;color:inherit;text-align:left;-webkit-appearance:none;appearance:none;cursor:pointer;
  transition:border-color .2s ease,transform .2s ease,background .2s ease}
.estab:hover,.estab.is-hover{border-color:rgba(255,196,107,.45);transform:translateX(3px);
  background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03))}
.estab__sig{flex:0 0 auto;width:44px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-weight:600;font-size:12px;color:#CFE0FF;background:rgba(0,80,230,.18);border:1px solid rgba(92,151,255,.32)}
.estab__b{min-width:0;flex:1;display:flex;flex-direction:column;line-height:1.2}
.estab__n{font-weight:600;font-size:14px;color:#FFFFFF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.estab__c{font-size:13px;color:#A7ACB6}
.estab__tag{flex:0 0 auto;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:#FFC46B;border:1px solid rgba(243,154,27,.4);border-radius:999px;padding:3px 8px}
.estab--siege{border-color:rgba(243,154,27,.42);background:linear-gradient(180deg,rgba(243,154,27,.12),rgba(255,255,255,.02))}
.estab--siege .estab__sig{color:#241300;font-weight:700;border-color:transparent;background:linear-gradient(180deg,#FFC673,#F39A1B)}
.estab--part .estab__sig{color:#C9D3EA;background:rgba(255,255,255,.06);border-style:dashed}
.estab--part .estab__tag{color:#A7ACB6;border-color:rgba(255,255,255,.14)}
.estab.is-sel{border-color:rgba(255,196,107,.62);background:linear-gradient(180deg,rgba(255,196,107,.14),rgba(255,255,255,.02))}
.estab:focus-visible{outline:2px solid #FFC46B;outline-offset:2px}

/* ═════ L'ARRIVÉE — une fois, puis plus rien ════════════════════════════════ */
.mo .fr__pays{stroke-dasharray:1;stroke-dashoffset:1;fill-opacity:0;
  transition:stroke-dashoffset 1.1s cubic-bezier(.22,1,.36,1),fill-opacity .8s .7s ease}
.mo.vu .fr__pays{stroke-dashoffset:0;fill-opacity:1}
.mo .fr__marque,.mo .pt{opacity:0;transition:opacity .45s ease,transform .5s cubic-bezier(.34,1.56,.64,1);
  transition-delay:calc(.85s + var(--k,0) * 90ms)}
.mo .pt{transform:translate(calc(-50% + var(--nx,0px)),calc(-50% + var(--ny,0px))) scale(.72)}
.mo .pt--d{transform:translate(var(--nx,0px),calc(-50% + var(--ny,0px))) scale(.72)}
.mo .pt--g{transform:translate(calc(-100% + var(--nx,0px)),calc(-50% + var(--ny,0px))) scale(.72)}
.mo.vu .fr__marque{opacity:1}
.mo.vu .pt{opacity:1;transform:translate(calc(-50% + var(--nx,0px)),calc(-50% + var(--ny,0px)))}
.mo.vu .pt--d{transform:translate(var(--nx,0px),calc(-50% + var(--ny,0px)))}
.mo.vu .pt--g{transform:translate(calc(-100% + var(--nx,0px)),calc(-50% + var(--ny,0px)))}

@media(max-width:880px){
  .page{padding:12px}
  .grille{flex-direction:column;gap:10px}
  .zone > .carte{height:340px;flex:0 0 340px}
  /* la fiche est plus haute que la carte sur un téléphone : elle passe DESSOUS,
     comme sur la carte d'août — sinon elle masque tout le Var. */
  .info{position:static;width:auto;margin-top:10px;opacity:1;transform:none;
    pointer-events:auto;display:none;box-shadow:none}
  .info.on{display:block}
  .liste{flex:0 0 auto}
  .liste__l{flex-direction:row;overflow-x:auto;overflow-y:hidden;gap:8px;padding-bottom:4px;max-height:none}
  .estab{flex:0 0 auto;min-width:210px;min-height:44px}
  .badge-full{display:none}
}
/* sous 640 px, les trois noms du Var sont illisibles et intouchables :
   leurs points restent, la liste prend le relais. */
@media(max-width:640px){
  .pt--grappe,.fr__fil--grappe{display:none}
  .pt__n{font-size:12px}
}
/* le temps de mesurer, plus aucune transition : une boîte lue en plein
   mouvement donne une position qui n'existera jamais. */
.fige .pt,.fige .fr__pays,.fige .fr__marque{transition:none!important}

@media (prefers-reduced-motion:reduce){
  .fr__onde{animation:none;opacity:0}
  .mo .fr__pays,.mo .fr__marque,.mo .pt{transition:none}
}
</style>
</head>
<body>
<div class="page">
  <div class="grille">
    <div class="zone">

        <defs>

        <button type="button" class="estab" data-i="7"><span class="estab__sig">MSP</span><span class="estab__b"><span class="estab__n">Mistral Santé Pharma</span><span class="estab__c">Flassans-sur-Issole · 83</span></span></button>

      </div>
    </aside>
  </div>
  <div class="pied">
    <span><i class="lg s"></i>Siège — Hyères</span>
    <span><i class="lg o"></i>Agences</span>
    <span><i class="lg p"></i>Partenaire — Metz</span>
    <span class="hint" id="pptHint">Cliquez sur une agence pour afficher son mail et son téléphone</span>
  </div>
</div>

<!-- le contour de la France et les positions des neuf sites vivent dans carte.js,
     en repère 0→100 : une seule source, partagée avec la carte de la page RSE.
     Son propre moteur ne démarre pas ici (il attend #carte-toile, absent). -->
<script src="carte.js"></script>
<script>
(function(){
  "use strict";
  var DOUX = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var COARSE = window.matchMedia && window.matchMedia('(pointer:coarse)').matches;
  var NS = 'http://www.w3.org/2000/svg';

  var carte = document.getElementById('carte');

  if(!carte || !svg) return;

     x/y : l'emplacement exact, repère 0→100 (repris de carte.js).
     ax/ay : où se pose le NOM. Identique au point, sauf pour les trois sites
     du Var, trop serrés pour être visés : leur nom part en mer, un fil le
     ramène à son point. `ph` : le numéro de la photo dans ../assets/agences/. */
  var SITES = [
    {s:'HP', n:"Hyères Pharma",               eti:'Hyères',        v:'Hyères',                    d:'83', t:'siege',
     x:76.61, y:81.53, ax:84.0, ay:82.0, dir:'d', grappe:true, ph:1,
     mail:'pr@hpharma.fr', tel:'04 84 25 17 18'},
    {s:'OPS', n:"Ouest Pharma Services",      eti:'St-Étienne-de-Montluc', v:'Saint-Étienne-de-Montluc', d:'44', t:'site',
     x:20.98, y:39.40, ax:20.98, ay:39.40, dir:'g', ph:2,
     mail:'pharmacien@ouestpharmaservices.fr', tel:'02 49 62 50 55'},
    {s:'EP', n:"Escale Pharma",               eti:'Chilly-Mazarin', v:'Chilly-Mazarin',           d:'91', t:'site',
     x:49.51, y:24.89, ax:49.51, ay:24.89, dir:'d', ph:3,
     mail:'pharmacien@escalepharma.fr', tel:'01 85 53 95 90'},
    {s:'CPR', n:"Comptoir Pharmaceutique du Rhône", eti:'St-Maurice-l’Exil', v:"Saint-Maurice-l’Exil", d:'38', t:'site',
     x:66.74, y:58.48, ax:66.74, ay:58.48, dir:'d', ph:4,
     mail:'pharmacien.commercial@cpharma.fr', tel:'04 81 43 00 46'},
    {s:'SOP', n:"Sud Ouest Pharma",           eti:'Montayral',     v:'Montayral',                 d:'47', t:'site',
     x:40.27, y:67.81, ax:40.27, ay:67.81, dir:'g', ph:5,
     mail:'pharmacien.commercial@sudouestpharma.fr', tel:'05 64 25 03 23'},
    {s:'POS', n:"Pharm'Occitanie Services",   eti:'Béziers',       v:'Villeneuve-lès-Béziers',    d:'34', t:'site',
     x:56.26, y:79.42, ax:56.26, ay:79.42, dir:'g', ph:6,
     mail:'', tel:'04 82 29 68 41'},
    {s:'SEP', n:"Sud Est Pharma",             eti:'Le Cannet',     v:'Le Cannet-des-Maures',      d:'83', t:'site',
     x:77.67, y:78.64, ax:84.0, ay:71.0, dir:'d', grappe:true, ph:7,
     mail:'', tel:''},
    {s:'MSP', n:"Mistral Santé Pharma",       eti:'Flassans',      v:'Flassans-sur-Issole',       d:'83', t:'site',
     x:76.69, y:78.92, ax:84.0, ay:76.5, dir:'d', grappe:true, ph:8,
     mail:'pharmacien@mistralsantepharma.com', tel:'04 94 80 79 10'},
    {s:'PH', n:"Pharmest",                    eti:'Metz',          v:'Metz',                      d:'57', t:'part',
     x:76.56, y:20.79, ax:76.56, ay:20.79, dir:'d', ph:9,
     mail:'', tel:''}
  ];

  /* le contour : les 18 morceaux de carte.js, Corse et îles comprises */
  if(typeof FRANCE !== 'undefined' && FRANCE && FRANCE.length){
    pays.setAttribute('d', FRANCE.join(' '));
    pays.setAttribute('pathLength', '1');
  }

  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function telHref(t){ var d=String(t).replace(/\D/g,''); return d.charAt(0)==='0' ? '+33'+d.slice(1) : d; }

  /* ── ce qui se dessine : les trois repères de la légende ─────────────────── */
  var marques = [], fils = [], boutons = [];
  SITES.forEach(function(m, i){
    var g = document.createElementNS(NS,'g');
    g.setAttribute('class','fr__marque');
    g.style.setProperty('--k', i);

    if(m.t === 'siege'){
      var onde = document.createElementNS(NS,'circle');
      onde.setAttribute('cx',m.x); onde.setAttribute('cy',m.y); onde.setAttribute('r','1.05');
      onde.setAttribute('class','fr__onde'); g.appendChild(onde);
      var an = document.createElementNS(NS,'circle');
      an.setAttribute('cx',m.x); an.setAttribute('cy',m.y); an.setAttribute('r','1.5');
      an.setAttribute('class','fr__anneau'); g.appendChild(an);
    }
    var c = document.createElementNS(NS,'circle');
    c.setAttribute('cx',m.x); c.setAttribute('cy',m.y);
    c.setAttribute('r', m.t==='siege' ? '.78' : '.72');
    c.setAttribute('class','fr__pt'+(m.t==='siege'?' fr__pt--siege':(m.t==='part'?' fr__pt--part':'')));
    g.appendChild(c);
    gMarq.appendChild(g);
    marques.push({g:g, pt:c});

    /* le fil : seulement pour les noms déportés */
    var f = null;
    if(m.grappe){
      f = document.createElementNS(NS,'line');
      f.setAttribute('class','fr__fil fr__fil--grappe'+(m.t==='part'?' fr__fil--part':''));
      f.setAttribute('x1',m.x); f.setAttribute('y1',m.y);
      f.setAttribute('x2',m.x); f.setAttribute('y2',m.y);
      gFils.appendChild(f);
    }
    fils.push(f);

    /* le nom, en HTML : c'est lui la cible */
    var b = document.createElement('button');
    b.type='button';
    b.className = 'pt pt--'+m.dir + (m.t==='siege'?' pt--siege':'') + (m.t==='part'?' pt--part':'') + (m.grappe?' pt--grappe':'');
    b.style.left = m.ax+'%'; b.style.top = m.ay+'%'; b.style.setProperty('--k', i);
    b.setAttribute('data-i', i);
    b.setAttribute('aria-label', m.n+' — '+m.v+', voir ses coordonnées');
    b.innerHTML = '<span class="pt__n">'+esc(m.eti)+'</span>' +
      (m.t==='siege' ? '<span class="pt__tag">Siège</span>' :
       (m.t==='part' ? '<span class="pt__tag">Partenaire</span>' : ''));
    carte.appendChild(b);
    boutons.push(b);
  });

  /* ── où se pose chaque nom : ça se MESURE, ça ne se devine pas ────────────
     Une règle écrite à la main (« celui-ci à gauche, celui-là à droite ») tient
     à la largeur où on l'a écrite, et casse à toutes les autres. On mesure donc
     la boîte réellement rendue : un nom qui sort du cadre bascule de l'autre
     côté, et deux noms qui se recouvrent s'écartent verticalement — le siège ne
     bouge jamais, c'est le repère. */
  /* ⚠️ le dessin est CARRÉ et centré dans un cadre qui ne l'est pas
     (preserveAspectRatio). Un nom posé en pourcentage du CADRE tombe donc à
     côté de son point. On convertit par la matrice réelle du SVG. */
  function versEcran(x, y){
    var m = svg.getScreenCTM(); if(!m) return null;
    var pt = svg.createSVGPoint(); pt.x = x; pt.y = y;
    var q = pt.matrixTransform(m);
    return {x:q.x, y:q.y};
  }
  function versSvg(sx, sy){
    var m = svg.getScreenCTM(); if(!m) return null;
    var pt = svg.createSVGPoint(); pt.x = sx; pt.y = sy;
    return pt.matrixTransform(m.inverse());
  }

  function placer(){
    var rc = carte.getBoundingClientRect();
    if(!rc.width || !rc.height) return;
    var M = 6;

    document.body.classList.add('fige');          /* on mesure à l'arrêt */

    /* chaque nom se pose sur son point, en pixels, pas en pourcentage */
    boutons.forEach(function(b, i){
      var e = versEcran(SITES[i].ax, SITES[i].ay);
      if(!e) return;
      b.style.left = (e.x - rc.left).toFixed(1) + 'px';
      b.style.top  = (e.y - rc.top ).toFixed(1) + 'px';
    });
    var vis = [];
    boutons.forEach(function(b,i){
      if(getComputedStyle(b).display === 'none') return;
      b.style.removeProperty('--ny');             /* sinon les décalages s'empilent */
      vis.push({i:i, b:b, m:SITES[i]});
    });

    /* 1. un nom qui sort du cadre bascule de l'autre côté */
    vis.forEach(function(o){
      var r = o.b.getBoundingClientRect();
      if(r.left < rc.left + M && o.b.classList.contains('pt--g')){
        o.b.classList.remove('pt--g'); o.b.classList.add('pt--d');
      } else if(r.right > rc.right - M && o.b.classList.contains('pt--d')){
        o.b.classList.remove('pt--d'); o.b.classList.add('pt--g');
      }
    });

    /* 2. on relève toutes les boîtes UNE fois, puis on calcule à froid */
    vis.forEach(function(o){
      var r = o.b.getBoundingClientRect();
      o.x = r.left - rc.left; o.w = r.width;
      o.y = r.top  - rc.top;  o.h = r.height;
      o.dy = 0;
    });
    var cx = function(o){ return o.x + o.w/2; };
    var cy = function(o){ return o.y + o.h/2 + o.dy; };
    for(var tour=0; tour<40; tour++){
      var bouge = false;
      for(var a=0;a<vis.length;a++) for(var c=a+1;c<vis.length;c++){
        var A=vis[a], B=vis[c];
        var chx = (A.w+B.w)/2 - Math.abs(cx(A)-cx(B));
        var chy = (A.h+B.h)/2 + 3 - Math.abs(cy(A)-cy(B));
        if(chx > 0 && chy > 0){
          var sens = (cy(A) <= cy(B)) ? -1 : 1, pas = chy/2 + 0.5;
          /* le siège ne bouge pas : c'est le repère de la carte */
          if(A.m.t === 'siege')      B.dy -= sens*pas*2;
          else if(B.m.t === 'siege') A.dy += sens*pas*2;
          else { A.dy += sens*pas; B.dy -= sens*pas; }
          bouge = true;
        }
      }
      if(!bouge) break;
    }

    /* 3. rien ne finit hors du cadre */
    vis.forEach(function(o){
      var haut = o.y + o.dy, bas = o.y + o.dy + o.h;
      if(haut < M) o.dy += M - haut;
      else if(bas > rc.height - M) o.dy -= bas - (rc.height - M);
    });

    /* 4. une seule écriture par nom */
    vis.forEach(function(o){
      if(Math.abs(o.dy) > 0.5) o.b.style.setProperty('--ny', o.dy.toFixed(1)+'px');
    });
    void carte.offsetHeight;
    calerFils();                 /* encore figé : les boîtes ne bougent plus */
    document.body.classList.remove('fige');
  }

  /* ── les fils se calent sur le bord RÉEL du nom, mesuré après rendu ───────
     (une position de nom se mesure, elle ne se devine pas : réglé une fois pour
     toutes sur la carte de l'intranet.) */
  function calerFils(){
    SITES.forEach(function(m,i){
      var f = fils[i]; if(!f) return;
      if(getComputedStyle(boutons[i]).display === 'none'){ f.setAttribute('x2', m.x); f.setAttribute('y2', m.y); return; }
      var rb = boutons[i].getBoundingClientRect();
      var pe = versEcran(m.x, m.y); if(!pe) return;
      /* le point du nom le plus proche de l'emplacement exact */
      var bx = Math.max(rb.left, Math.min(pe.x, rb.right));
      var by = Math.max(rb.top,  Math.min(pe.y, rb.bottom));
      var q = versSvg(bx, by); if(!q) return;
      f.setAttribute('x2', q.x.toFixed(2));
      f.setAttribute('y2', q.y.toFixed(2));
    });
  }

  /* ── la fiche ────────────────────────────────────────────────────────────── */
  var info=document.getElementById('info'),
      miType=document.getElementById('miType'), miName=document.getElementById('miName'),
      miCity=document.getElementById('miCity'), miActions=document.getElementById('miActions'),
      miPhoto=document.getElementById('miPhoto');
  var choisi = -1;

  function peindre(){
    boutons.forEach(function(b,k){ b.classList.toggle('is-sel', k===choisi); });
    marques.forEach(function(o,k){
      o.pt.setAttribute('r', k===choisi ? (SITES[k].t==='siege'?'1.15':'1.05')
                                        : (SITES[k].t==='siege'?'.78':'.72'));
    });
    document.querySelectorAll('.estab').forEach(function(r){
      r.classList.toggle('is-sel', parseInt(r.getAttribute('data-i'),10)===choisi);
    });
  }
  function ouvrir(i){
    choisi = i; peindre();
    var m = SITES[i];
    info.classList.remove('siege','part');
    if(m.t==='siege') info.classList.add('siege'); else if(m.t==='part') info.classList.add('part');
    miType.textContent = m.t==='siege' ? 'Siège' : (m.t==='part' ? 'Partenaire' : 'Agence Intégral');
    miName.textContent = m.n;
    miCity.textContent = m.v+' · '+m.d;
    var h='';
    if(m.mail) h += '<a class="mi__btn mi__btn--mail" href="mailto:'+esc(m.mail)+'">Écrire<small>'+esc(m.mail)+'</small></a>';
    if(m.tel)  h += '<a class="mi__btn mi__btn--tel" href="tel:'+telHref(m.tel)+'">Appeler<small>'+esc(m.tel)+'</small></a>';
    if(!h)     h  = '<a class="mi__btn mi__btn--tel" href="mailto:contact@integralpharma.fr?subject='+encodeURIComponent(m.n)+'">Écrire au groupe<small>contact@integralpharma.fr</small></a>';
    miActions.innerHTML = h; miActions.style.display='flex';
    miPhoto.hidden = true;
    miPhoto.onload = function(){ miPhoto.hidden = false; hauteur(); };
    miPhoto.onerror = function(){ miPhoto.hidden = true; };
    miPhoto.alt = 'Illustration — '+m.n;
    miPhoto.src = '../assets/agences/agence-'+m.ph+'.jpg';
    info.classList.add('on'); info.setAttribute('aria-hidden','false');
    planifier();
  }
  function fermer(){
    choisi = -1; peindre();
    info.classList.remove('on'); info.setAttribute('aria-hidden','true');
    planifier();
  }

  /* survol = éclairer seulement · CLIC = la fiche s'ouvre et RESTE (18/09) */
  function survol(i, oui){
    document.querySelectorAll('.estab').forEach(function(r){
      if(parseInt(r.getAttribute('data-i'),10)===i) r.classList.toggle('is-hover', oui);
    });
    if(!COARSE && marques[i] && i!==choisi){
      marques[i].pt.setAttribute('r', oui ? (SITES[i].t==='siege'?'1.05':'.95')
                                          : (SITES[i].t==='siege'?'.78':'.72'));
    }
  }
  boutons.forEach(function(b,i){
    b.addEventListener('click', function(e){ e.stopPropagation(); (choisi===i ? fermer() : ouvrir(i)); });
    b.addEventListener('mouseenter', function(){ survol(i,true); });
    b.addEventListener('mouseleave', function(){ survol(i,false); });
    b.addEventListener('focus', function(){ survol(i,true); });
    b.addEventListener('blur',  function(){ survol(i,false); });
  });
  document.querySelectorAll('.estab[data-i]').forEach(function(r){
    var i = parseInt(r.getAttribute('data-i'),10);
    r.addEventListener('click', function(e){ e.stopPropagation(); (choisi===i ? fermer() : ouvrir(i)); });
    r.addEventListener('mouseenter', function(){ if(!COARSE) survol(i,true); });
    r.addEventListener('mouseleave', function(){ if(!COARSE) survol(i,false); });
  });
  info.addEventListener('click', function(e){ e.stopPropagation(); });
  document.getElementById('miClose').addEventListener('click', function(e){ e.stopPropagation(); fermer(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape' && choisi>=0) fermer(); });
  document.addEventListener('click', function(){ if(choisi>=0) fermer(); });

  if(COARSE){
    var cap=document.getElementById('listeCap');
    if(cap) cap.innerHTML='Nos agences <i>— touchez pour les coordonnées</i>';
    var hi=document.getElementById('pptHint');
    if(hi) hi.textContent='Touchez une agence pour afficher son mail et son téléphone';
  }

  /* ── l'arrivée : une fois, puis plus rien ────────────────────────────────── */
  if(!DOUX){
    carte.classList.add('mo');
    /* ⚠️ pendant l'arrivée les noms sont encore à 72 % : les mesurer là donnerait
       des boîtes trop petites, et deux noms déclarés « qui ne se touchent pas »
       se recouvriraient une fois posés. On replace donc après l'arrivée. */
    var partir = function(){
      requestAnimationFrame(function(){ carte.classList.add('vu'); });
      setTimeout(planifier, 1900);
    };
    if('IntersectionObserver' in window){
      var io = new IntersectionObserver(function(en){
        en.forEach(function(e){ if(e.isIntersecting){ partir(); io.disconnect(); } });
      }, {threshold:.25});
      io.observe(carte);
    } else { partir(); }
  }

  /* ── la hauteur, communiquée à index.html (inchangé : {type:'carte3dHeight'}) ── */
  var attente=null;
  function hauteur(){
    var pg = document.querySelector('.page');
    var h = pg ? Math.ceil(pg.getBoundingClientRect().height) : document.documentElement.scrollHeight;
    try{ parent.postMessage({type:'carte3dHeight', h:h}, '*'); }catch(e){}
  }
  function planifier(){
    if(attente) return;
    attente = requestAnimationFrame(function(){ attente=null; placer(); hauteur(); });
  }
  window.addEventListener('resize', planifier, {passive:true});
  window.addEventListener('load', planifier);
  if(window.ResizeObserver){ new ResizeObserver(planifier).observe(document.body); }
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(planifier); }
  planifier();

  /* la sonde : position à l'écran de chaque cible, et ce que la fiche affiche */
  window.__carte = {
    nb: function(){ return SITES.length; },
    ecran: function(i){
      var r = boutons[i].getBoundingClientRect();
      return {x:Math.round(r.left+r.width/2), y:Math.round(r.top+r.height/2),
              w:Math.round(r.width), h:Math.round(r.height)};
    },
    choisi: function(){ return choisi; },
    ouvrir: ouvrir,
    contour: function(){ return (pays.getAttribute('d')||'').length; }
  };
})();
</script>
