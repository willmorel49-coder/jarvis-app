<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte du réseau</title>
<meta name="description" content="Carte 3D du réseau Intégral Pharma : huit agences et un partenaire.">
<style>
@font-face{
  font-family:"Inter";
  src:url("polices/inter.woff2") format("woff2");
  font-weight:100 900;font-style:normal;font-display:swap;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#060B16}
body{
  font-family:"Inter",system-ui,sans-serif;
  color:#EAF0FF;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.page{padding:16px;display:flex;flex-direction:column;gap:12px;min-height:0}

/* ===== carte 3D ===== */
.map3d{position:relative;height:600px;min-height:0;border-radius:18px;overflow:hidden;
  border:1px solid rgba(91,140,255,.20);
  background:radial-gradient(120% 100% at 50% 0%,#0B1734 0%,#060B1C 55%,#04070F 100%);
  box-shadow:0 30px 80px -30px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.03) inset}
.map3d canvas{display:block;width:100%;height:100%}
.map3d__labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl3{position:absolute;left:0;top:0;transform:translate(-50%,-100%);white-space:nowrap;
  font-family:"Inter",sans-serif;text-align:center;opacity:0;transition:opacity .5s ease}
.lbl3__box{display:inline-block;background:rgba(6,10,24,.82);border:1px solid rgba(91,140,255,.34);
  border-radius:8px;padding:6px 10px 7px;box-shadow:0 8px 24px -10px rgba(0,0,0,.8)}
.lbl3__n{font-size:11px;font-weight:600;letter-spacing:.02em;color:#EAF0FF}
.lbl3__c{font-size:9.5px;letter-spacing:.03em;color:#9AA6C4;margin-top:2px}
.lbl3__t{display:inline-block;font-size:8.5px;font-weight:600;letter-spacing:.1em;margin-top:4px;
  padding:2px 7px;border-radius:99px;color:#FFC46B;border:1px solid rgba(243,154,27,.5)}
.lbl3--siege .lbl3__box{border-color:rgba(243,154,27,.55);background:rgba(24,14,3,.84)}
.lbl3--siege .lbl3__n{color:#FFE2B3}
.lbl3--part .lbl3__box{border-style:dashed;border-color:rgba(159,180,216,.45)}
.lbl3--part .lbl3__t{color:#AFC2DC;border-color:rgba(159,180,216,.5)}
.lbl3.on .lbl3__box{border-color:rgba(255,193,104,.75)}
.lbl3__stem{width:1px;height:14px;margin:2px auto 0;background:linear-gradient(180deg,rgba(91,140,255,.5),transparent)}
.map3d__badge{position:absolute;left:14px;top:12px;display:flex;align-items:center;gap:8px;
  font-family:"Inter",sans-serif;font-size:10.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:#9AA6C4;
  background:rgba(6,10,24,.6);border:1px solid rgba(255,255,255,.10);border-radius:999px;padding:6px 12px;z-index:5}
.map3d__badge .dot{width:6px;height:6px;border-radius:50%;background:#F39A1B;box-shadow:0 0 8px 2px rgba(243,154,27,.6)}
.map3d__fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:18px}
.map3d.flat .map3d__fallback{display:flex}
.map3d.flat canvas,.map3d.flat .map3d__labels,.map3d.flat .map3d__info{display:none}
.map3d__fallback svg{width:auto;height:100%;max-width:100%}
.map3d__fallback .fbnote{position:absolute;right:14px;bottom:12px;font-family:"Inter",sans-serif;font-size:9.5px;
  letter-spacing:.1em;text-transform:uppercase;color:#9AA6C4;
  border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:5px 11px;background:rgba(6,10,24,.55)}
.map3d__load{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;color:#9AA6C4;pointer-events:none;transition:opacity .5s ease}
.map3d.ready .map3d__load,.map3d.flat .map3d__load{opacity:0}
.map3d__spin{width:26px;height:26px;border-radius:50%;
  border:2px solid rgba(159,182,255,.2);border-top-color:#5C97FF;animation:spin 1s linear infinite}
.map3d__load span{font-family:"Inter",sans-serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#9AA6C4}
@keyframes spin{to{transform:rotate(360deg)}}
.map3d__info{position:absolute;left:14px;bottom:14px;z-index:6;width:min(340px,calc(100% - 28px));
  background:rgba(7,12,28,.94);border:1px solid rgba(120,150,255,.30);border-radius:14px;
  padding:13px 15px;opacity:0;transform:translateY(10px);pointer-events:none;
  transition:opacity .3s ease,transform .35s cubic-bezier(.22,1,.36,1);box-shadow:0 22px 55px -22px rgba(0,0,0,.85)}
.map3d__info.on{opacity:1;transform:none;pointer-events:auto}
.mi__type{display:inline-block;font-family:"Inter",sans-serif;font-size:10px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;color:#0A1430;background:#5B8CFF;border-radius:999px;padding:3px 9px;margin-bottom:9px}
.map3d__info.siege .mi__type{background:linear-gradient(180deg,#FFC673,#F39A1B);color:#241200}
.map3d__info.part .mi__type{background:transparent;border:1px dashed #9FB4D8;color:#C9D6EE}
.mi__name{font-weight:600;font-size:17px;color:#EFF3FF;letter-spacing:-.01em;line-height:1.15}
.mi__city{font-size:13px;color:#9AA6C4;margin-top:3px}
.mi__close{position:absolute;right:6px;top:6px;width:32px;height:32px;border:0;border-radius:50%;background:transparent;
  color:#9AA6C4;font-size:20px;line-height:1;cursor:pointer}
.mi__close:hover,.mi__close:focus-visible{background:rgba(255,255,255,.10);color:#fff}
.mi__name{padding-right:26px}
.mi__btn{width:100%;justify-content:flex-start!important;min-height:40px!important}
.mi__btn small{font-weight:400;font-size:12px;opacity:.85;margin-left:auto;padding-left:10px;overflow:hidden;text-overflow:ellipsis}
.map3d.peut-cliquer canvas{cursor:pointer}
.estab.is-hover{border-color:rgba(255,193,104,.45)}
.mi__actions{display:none;gap:8px;margin-top:11px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08);flex-wrap:wrap}
.mi__btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;
  font-family:"Inter",sans-serif;font-size:12.5px;font-weight:600;text-decoration:none;
  border-radius:999px;padding:0 14px;cursor:pointer;white-space:nowrap}
.mi__btn--mail{background:linear-gradient(180deg,#FFC673,#F39A1B);color:#241200}
.mi__btn--tel{background:rgba(255,255,255,.08);color:#EAF0FF;border:1px solid rgba(255,255,255,.18)}
.mapfoot{flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 22px;
  font-family:"Inter",sans-serif;font-size:11.5px;font-weight:500;letter-spacing:.02em;color:#9AA6C4;padding:2px 0 4px}
.mapfoot span{display:inline-flex;align-items:center;gap:8px}
.lg{width:11px;height:11px;border-radius:50%}
.lg.o{background:#F39A1B;box-shadow:0 0 8px rgba(243,154,27,.8)}
.lg.b{background:#5C97FF;box-shadow:0 0 8px rgba(91,140,255,.7)}
.lg.p{background:transparent;border:1.5px dashed #9FB4D8}
.mapfoot .hint{color:#7C89AC}
.mapfoot .hint .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#5C97FF;margin-right:6px;vertical-align:middle}

/* ===== carte + annuaire côte à côte ===== */
.mapgrid{display:flex;gap:14px;align-items:stretch}
.mapgrid > .map3d{flex:1 1 auto;min-width:0}
.roster{flex:0 0 clamp(220px,27%,300px);min-height:0;display:flex;flex-direction:column;gap:8px}
.roster__cap{font-family:"Inter",sans-serif;font-size:10.5px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:#7C89AC;flex:0 0 auto}
.roster__cap b{color:#FFC46B;font-weight:600}
.roster__list{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:7px;padding-right:4px;max-height:600px}
.estab{display:flex;align-items:center;gap:11px;width:100%;border:1px solid rgba(255,255,255,.10);border-radius:12px;
  padding:9px 12px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
  font:inherit;color:inherit;text-align:left;-webkit-appearance:none;appearance:none;
  cursor:pointer;transition:border-color .2s ease,transform .2s ease,background .2s ease}
.estab:hover{border-color:rgba(255,193,104,.45);transform:translateX(3px);background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03))}
.estab__sig{flex:0 0 auto;width:44px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-family:"Inter",sans-serif;font-weight:600;font-size:12px;color:#CFE0FF;background:rgba(0,80,230,.18);border:1px solid rgba(91,140,255,.32)}
.estab__b{min-width:0;flex:1;display:flex;flex-direction:column;line-height:1.2}
.estab__n{font-weight:600;font-size:14px;color:#EAF0FF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.estab__c{font-size:12px;color:#9AA6C4}
.estab__tag{flex:0 0 auto;font-family:"Inter",sans-serif;font-size:8.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:#FFC46B;border:1px solid rgba(243,154,27,.4);border-radius:999px;padding:3px 8px}
.estab--siege{border-color:rgba(243,154,27,.42);background:linear-gradient(180deg,rgba(243,154,27,.12),rgba(255,255,255,.02))}
.estab--siege .estab__sig{color:#241300;font-weight:700;border-color:transparent;background:linear-gradient(180deg,#FFC673,#F39A1B)}
.estab--part .estab__sig{color:#C9D3EA;background:rgba(255,255,255,.06);border-style:dashed}
.estab--part .estab__tag{color:#9AA6C4;border-color:rgba(255,255,255,.14)}
.estab.is-sel{border-color:rgba(255,193,104,.62);background:linear-gradient(180deg,rgba(255,193,104,.14),rgba(255,255,255,.02))}
.estab.is-sel .estab__sig{border-color:rgba(255,193,104,.6)}
.roster__list.is-static .estab{cursor:default}
.roster__list.is-static .estab:hover{transform:none;border-color:rgba(255,255,255,.10);
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015))}

@media(max-width:880px){
  .page{padding:12px}
  .mapgrid{flex-direction:column;gap:10px}
  .mapgrid > .map3d{height:320px}
  .roster{flex:0 0 auto}
  .roster__list{flex-direction:row;overflow-x:auto;overflow-y:hidden;gap:8px;padding-bottom:4px;max-height:none;
    scroll-snap-type:x proximity}
  .roster__list .estab{scroll-snap-align:start}
  .estab{flex:0 0 auto;min-width:210px;min-height:44px}
  .badge-full{display:none}
}
</style>
</head>
<body>
<div class="page">
  <div class="mapgrid">
    <div class="map3d" id="map3d" role="img" aria-label="Carte 3D de France : les huit agences Intégral Pharma et le partenaire de Metz, siège à Hyères">
      <div class="map3d__labels" id="lbls" aria-hidden="true"></div>
      <div class="map3d__badge"><span class="dot"></span>Réseau Intégral<span class="badge-full"> — huit agences et un partenaire</span></div>
      <div class="map3d__info" id="mapInfo" aria-hidden="true">
        <span class="mi__type" id="miType">Agence Intégral</span>
        <div class="mi__name" id="miName">—</div>
        <div class="mi__city" id="miCity">—</div>
        <div class="mi__actions" id="miActions"></div>
        <button type="button" class="mi__close" id="miClose" aria-label="Fermer la fiche">×</button>
      </div>
      <div class="map3d__load" id="mapLoad" aria-hidden="true"><span class="map3d__spin"></span><span>Chargement du réseau</span></div>
      <div class="map3d__fallback" id="mapFallback" aria-hidden="true"></div>
    </div>
    <aside class="roster" aria-label="Liste des agences">
      <div class="roster__cap" id="rosterCap">Nos agences <b>— cliquez pour les coordonnées</b></div>
      <div class="roster__list" data-scroll aria-label="Annuaire des agences — faites glisser pour parcourir">
        <button type="button" class="estab estab--siege" data-i="0"><span class="estab__sig">HP</span><span class="estab__b"><span class="estab__n">Hyères Pharma</span><span class="estab__c">Hyères · 83</span></span><span class="estab__tag">Siège</span></button>
        <button type="button" class="estab" data-i="1"><span class="estab__sig">OPS</span><span class="estab__b"><span class="estab__n">Ouest Pharma Services</span><span class="estab__c">Saint-Étienne-de-Montluc · 44</span></span></button>
        <button type="button" class="estab" data-i="2"><span class="estab__sig">EP</span><span class="estab__b"><span class="estab__n">Escale Pharma</span><span class="estab__c">Chilly-Mazarin · 91</span></span></button>
        <button type="button" class="estab" data-i="3"><span class="estab__sig">CPR</span><span class="estab__b"><span class="estab__n">Comptoir Pharma. du Rhône</span><span class="estab__c">Saint-Maurice-l'Exil · 38</span></span></button>
        <button type="button" class="estab" data-i="4"><span class="estab__sig">SOP</span><span class="estab__b"><span class="estab__n">Sud Ouest Pharma</span><span class="estab__c">Montayral · 47</span></span></button>
        <button type="button" class="estab" data-i="5"><span class="estab__sig">POS</span><span class="estab__b"><span class="estab__n">Pharm'Occitanie Services</span><span class="estab__c">Villeneuve-lès-Béziers · 34</span></span></button>
        <button type="button" class="estab" data-i="6"><span class="estab__sig">SEP</span><span class="estab__b"><span class="estab__n">Sud Est Pharma</span><span class="estab__c">Le Cannet-des-Maures · 83</span></span></button>
        <button type="button" class="estab" data-i="7"><span class="estab__sig">MSP</span><span class="estab__b"><span class="estab__n">Mistral Santé Pharma</span><span class="estab__c">Flassans-sur-Issole · 83</span></span></button>
        <button type="button" class="estab estab--part" data-i="8"><span class="estab__sig">PH</span><span class="estab__b"><span class="estab__n">Pharmest</span><span class="estab__c">Metz · 57</span></span><span class="estab__tag">Partenaire</span></button>
      </div>
    </aside>
  </div>
  <div class="mapfoot" id="mapfoot">
    <span><i class="lg o"></i>Siège — Hyères</span>
    <span><i class="lg b"></i>Agences</span>
    <span><i class="lg p"></i>Partenaire — Metz</span>
    <span class="hint" id="mapHint"><span class="dot"></span>Cliquez sur une agence pour afficher son mail et son téléphone</span>
  </div>
</div>

    var beamO=new THREE.Mesh(new THREE.CylinderGeometry(rOut*1.7,rOut*0.72,bh,20,1,true),mo);
    beamO.position.y=bh/2; grp.add(beamO); mats.push(mo);
    var mc=beamMat(cCore, siege?0.9:0.75, 1.15);
    var beamC=new THREE.Mesh(new THREE.CylinderGeometry(rOut*0.34,rOut*0.24,bh*0.96,12,1,true),mc);
    beamC.position.y=bh*0.48; grp.add(beamC); mats.push(mc);

    var gs=new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW,color:cCore,transparent:true,opacity:siege?0.9:0.72,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
    gs.scale.set(siege?17:9,siege?17:9,1); gs.position.y=0.5; grp.add(gs);
    if(siege){
      var halo=new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW,color:0xF3720F,transparent:true,opacity:0.42,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
      halo.scale.set(34,34,1); halo.position.y=0.8; grp.add(halo);
    }
    var tip=new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW,color:0xFFFFFF,transparent:true,opacity:0.85,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
    tip.scale.set(siege?4.2:2.4,siege?4.2:2.4,1); tip.position.y=bh*0.99; grp.add(tip);

    var ringGrp=new THREE.Group(); ringGrp.position.set(wx,EXH+0.06,wz); scene.add(ringGrp);
    var rings=[];
    for(var k=0;k<2;k++){
      var rm=ringMatProto.clone();
      rm.color=new THREE.Color(siege?0xF39A1B:(part?0x9FB4D8:0x5B8CFF));
      var ring=new THREE.Mesh(new THREE.RingGeometry(0.86,1.0,44),rm);
      ring.rotation.x=-Math.PI/2;
      ring.userData={ph:k*0.5, base:(siege?3.2:1.9)};
      ringGrp.add(ring); rings.push(ring);
    }
    var dm=new THREE.Mesh(new THREE.CircleGeometry(siege?1.5:1.0,32),
      new THREE.MeshBasicMaterial({color:cCore,transparent:true,opacity:0.98,fog:false}));
    dm.rotation.x=-Math.PI/2; dm.position.set(wx,EXH+0.08,wz); scene.add(dm);
    var base=new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW,color:cCore,transparent:true,opacity:siege?0.85:0.6,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
    base.scale.set(siege?9:5.5,siege?9:5.5,1); base.position.set(wx,EXH+0.1,wz); scene.add(base);

    var el=document.createElement('div');
    el.className='lbl3'+(siege?' lbl3--siege':'')+(part?' lbl3--part':'');
    el.innerHTML='<span class="lbl3__box"><span class="lbl3__n">'+m.s+' · '+m.n+'</span><br>'+
                 '<span class="lbl3__c">'+m.c+'</span>'+
                 (siege?'<br><span class="lbl3__t">SIÈGE</span>':(part?'<br><span class="lbl3__t">PARTENAIRE</span>':''))+
                 '</span><span class="lbl3__stem"></span>';
    lblWrap.appendChild(el);

    beacons.push({grp:grp,mats:mats,rings:rings,site:m,el:el,wx:wx,wz:wz,topY:EXH+bh+0.9,idx:idx,hl:0,hlT:0});

    var pr=(siege?7:4.8), ph=Math.max(bh,9);
    var pick=new THREE.Mesh(new THREE.CylinderGeometry(pr,pr,ph,12,1,true),
      new THREE.MeshBasicMaterial({colorWrite:false,depthWrite:false,transparent:true,opacity:0}));
    pick.position.set(wx, EXH+ph/2, wz); pick.userData.bi=idx; scene.add(pick); pickTargets.push(pick);
  }
  for(var bi=0;bi<SITES.length;bi++) makeBeacon(SITES[bi],bi);

  var HQ = new THREE.Vector3(WX(SITES[0].x), EXH+0.6, WZ(SITES[0].y));
  pulses=[];
  for(var ai=1;ai<SITES.length;ai++){
    var m=SITES[ai];
    var A=new THREE.Vector3(WX(m.x)+m.dxw, EXH+0.6, WZ(m.y)+m.dzw);
    var d=A.distanceTo(HQ);
    var mid=A.clone().lerp(HQ,0.5); mid.y += 3.5 + d*0.28;
    var curve=new THREE.QuadraticBezierCurve3(A,mid,HQ);
    if(m.t==='part'){
      var pts=curve.getPoints(60);
      var lg=new THREE.BufferGeometry().setFromPoints(pts);
      var ln=new THREE.Line(lg,new THREE.LineDashedMaterial({color:0x9FB4D8,transparent:true,opacity:0.5,dashSize:1.3,gapSize:1.0,fog:false}));
      ln.computeLineDistances(); scene.add(ln);
    }else{
      var tube=new THREE.Mesh(new THREE.TubeGeometry(curve,42,0.085,5,false),
        new THREE.MeshBasicMaterial({color:0x2E6BFF,transparent:true,opacity:0.30,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
      scene.add(tube);
    }
    var np = d>28?2:1;
    for(var pi=0;pi<np;pi++){
      var sp=new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW,color:(m.t==='part'?0xD9E4F5:0xBFD6FF),transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
      sp.scale.set(2.1,2.1,1); scene.add(sp);
      pulses.push({sp:sp,curve:curve,v:0.055+Math.random()*0.03,ph:pi/np+Math.random()*0.3});
    }
  }

      resize();
      buildOK=true;
    }catch(err){ buildFallback(); buildOK=false; }
    return buildOK;
  }

  var az=0, elv=0.92, baseEl=0.88, baseR=125;
  var mx=0,my=0, intro=0, started=false, raf3=null;
  var clock=new THREE.Clock(), T=0;
  var V=new THREE.Vector3();
  var cw=0,ch=0;

  var ray=new THREE.Raycaster(), ndc=new THREE.Vector2(-2,-2);
  var lastHoverI=-2, ptX=0, ptY=0;
  var pointerInMap=false, mapHoverI=-1, rosterHoverI=-1, focusI=-1, activeI=-1, focusAmt=0, pinnedI=-1;

  var infoEl=document.getElementById('mapInfo'),
      miType=document.getElementById('miType'), miName=document.getElementById('miName'),
      miCity=document.getElementById('miCity'), miActions=document.getElementById('miActions');
  var curInfo=-2;
  function setInfo(i){
    if(i===curInfo) return; curInfo=i;
    if(i<0){ if(infoEl){ infoEl.classList.remove('on'); infoEl.setAttribute('aria-hidden','true'); } return; }
    var m=SITES[i];
    infoEl.classList.remove('siege','part');
    if(m.t==='siege') infoEl.classList.add('siege'); else if(m.t==='part') infoEl.classList.add('part');
    miType.textContent = m.t==='siege'?'Siège':(m.t==='part'?'Partenaire':'Agence Intégral');
    miName.textContent = m.n;
    miCity.textContent = m.c+' · '+m.dept;
    var html='';
    if(m.mail) html += '<a class="mi__btn mi__btn--mail" href="mailto:'+m.mail+'">Écrire<small>'+m.mail+'</small></a>';
    if(m.tel)  html += '<a class="mi__btn mi__btn--tel" href="tel:'+telHref(m.tel)+'">Appeler<small>'+m.tel+'</small></a>';
    if(!html)  html  = '<a class="mi__btn mi__btn--tel" href="mailto:contact@integralpharma.fr?subject='+encodeURIComponent(m.n)+'">Écrire au groupe<small>contact@integralpharma.fr</small></a>';
    miActions.innerHTML = html;
    miActions.style.display = 'flex';
    infoEl.classList.add('on'); infoEl.setAttribute('aria-hidden','false');
  }

  function resize(){
    if(!renderer) return;
    cw=box.clientWidth; ch=box.clientHeight;
    if(!cw||!ch) return;
    var dpr=Math.min(window.devicePixelRatio||1, cw>760?2:1.6);
    renderer.setPixelRatio(dpr);
    renderer.setSize(cw,ch,false);
    camera.aspect=cw/ch; camera.updateProjectionMatrix();
    var halfW=58, vf=camera.fov*Math.PI/360;
    baseR=Math.max(118, halfW/(Math.tan(vf)*camera.aspect));
    scene.fog.near=baseR*1.6; scene.fog.far=baseR*3.6;
  }
  window.addEventListener('resize',function(){ resize(); scheduleHeight(); },{passive:true});

  box.addEventListener('pointermove',function(e){
    if(e.pointerType==='touch') return;
    if(e.target.closest && e.target.closest('#mapInfo')){ pointerInMap=false; mapHoverI=-1; return; }
    var r=box.getBoundingClientRect();
    ptX=e.clientX-r.left; ptY=e.clientY-r.top;
    mx=0; my=0; /* plus de parallaxe à la souris : la cible ne doit pas bouger sous le curseur */
    ndc.x=((e.clientX-r.left)/r.width)*2-1;
    ndc.y=-((e.clientY-r.top)/r.height)*2+1;
    pointerInMap=true;
  },{passive:true});
  function clearMapHover(){ mx=0;my=0; pointerInMap=false; mapHoverI=-1; }
  box.addEventListener('pointerleave',clearMapHover,{passive:true});
  box.addEventListener('pointercancel',clearMapHover,{passive:true});

  var coarse = window.matchMedia && window.matchMedia('(pointer:coarse)').matches;
  if(coarse){
    var _cap0=document.getElementById('rosterCap'); if(_cap0) _cap0.innerHTML='Nos agences <b>— touchez pour les coordonnées</b>';
    var _hint0=document.getElementById('mapHint'); if(_hint0) _hint0.innerHTML='<span class="dot"></span>Touchez une agence pour afficher son mail et son téléphone';
  }

  function selRow(row){ document.querySelectorAll('.estab').forEach(function(r){ r.classList.remove('is-sel'); }); if(row) row.classList.add('is-sel'); }
  function rowFor(i){ return document.querySelector('.estab[data-i="'+i+'"]'); }

  document.querySelectorAll('.estab[data-i]').forEach(function(row){
    var i=parseInt(row.getAttribute('data-i'),10);
    row.addEventListener('mouseenter',function(){ if(!coarse) rosterHoverI=i; });
    row.addEventListener('mouseleave',function(){ if(!coarse && rosterHoverI===i) rosterHoverI=-1; });
    row.addEventListener('focus',function(){ if(!coarse) rosterHoverI=i; });
    row.addEventListener('blur',function(){ if(!coarse && rosterHoverI===i) rosterHoverI=-1; });
    row.addEventListener('click',function(){
      if(pinnedI===i){ pinnedI=-1; selRow(null); }
      else { pinnedI=i; selRow(row); }
    });
  });

  /* clic (ou tap) directement sur un faisceau : épingle la fiche pour rendre les boutons cliquables */
  /* viser un faisceau à l'ÉCRAN : distance du pointeur au segment pied→sommet, seuil généreux.
     Plus fiable qu'un lancer de rayon sur un cylindre fin, et identique au survol et au clic. */
  var VA=new THREE.Vector3(), VB=new THREE.Vector3();
  function ecran(i){
    var b=beacons[i];
    VA.set(b.wx,EXH,b.wz).project(camera); VB.set(b.wx,b.topY,b.wz).project(camera);
    return {ax:(VA.x*.5+.5)*cw, ay:(-VA.y*.5+.5)*ch, bx:(VB.x*.5+.5)*cw, by:(-VB.y*.5+.5)*ch};
  }
  function viser(px,py){
    var best=-1, bd=(coarse?34:24);
    for(var i=0;i<beacons.length;i++){
      var s=ecran(i), dx=s.bx-s.ax, dy=s.by-s.ay, L=dx*dx+dy*dy||1;
      var u=Math.max(0,Math.min(1,((px-s.ax)*dx+(py-s.ay)*dy)/L));
      var d=Math.sqrt(Math.pow(px-(s.ax+u*dx),2)+Math.pow(py-(s.ay+u*dy),2));
      d += (1-u)*-6; /* léger avantage au pied du faisceau : c'est lui qui dit le lieu */
      if(d<bd){ bd=d; best=beacons[i].idx; }
    }
    return best;
  }
  window.__carte={ecran:function(i){ return ecran(i); }};
  function fermer(){ pinnedI=-1; selRow(null); }
  if(infoEl){ infoEl.addEventListener('click',function(e){ e.stopPropagation(); }); }
  var _cl=document.getElementById('miClose'); if(_cl) _cl.addEventListener('click',function(e){ e.stopPropagation(); fermer(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') fermer(); });
  box.addEventListener('click',function(e){
    if(e.target.closest && e.target.closest('#mapInfo')) return;
    var r=box.getBoundingClientRect();
    var i=viser(e.clientX-r.left, e.clientY-r.top);
    if(i>=0){
      pinnedI=i; selRow(rowFor(i));
    } else {
      pinnedI=-1; selRow(null);
    }
  });

  /* clic ailleurs sur la page : referme la fiche épinglée */
  document.addEventListener('click',function(e){
    if(e.target.closest('#mapInfo')) return;
    if(e.target.closest('.estab')) return;
    if(e.target.closest('#map3d')) return;
    if(pinnedI>=0){ pinnedI=-1; selRow(null); }
  });

  function easeOut(x){ return 1-Math.pow(1-x,3); }

  function tick(){
    raf3=requestAnimationFrame(tick);
    var dt=Math.min(clock.getDelta(),0.05); T+=dt;
    if(started) intro=Math.min(1,intro+dt/2.4);
    var e=easeOut(intro);
    var kFocus=1-Math.pow(1-0.16, dt*60);
    var kCam  =1-Math.pow(1-0.045,dt*60);
    var kHl   =1-Math.pow(1-0.10, dt*60);

    if(pointerInMap){
      mapHoverI = viser(ptX,ptY);
    }
    var hoverI = pointerInMap ? mapHoverI : rosterHoverI;
    if(hoverI!==lastHoverI){
      lastHoverI=hoverI; box.classList.toggle('peut-cliquer', hoverI>=0);
      document.querySelectorAll('.estab').forEach(function(r){ r.classList.toggle('is-hover', parseInt(r.getAttribute('data-i'),10)===hoverI); });
    }
    focusI = pinnedI;
    if(focusI>=0) activeI=focusI;
    focusAmt += ((focusI>=0?1:0)-focusAmt)*kFocus;
    setInfo(focusI);

    var tAz=Math.sin(T*0.10)*0.10*(1-focusAmt);
    var tEl=baseEl + my*0.06 + (1-e)*0.16;
    az+=(tAz-az)*kCam; elv+=(tEl-elv)*kCam;
    var R=baseR*(1.30-0.30*e);
    var ovx=Math.sin(az)*Math.cos(elv)*R, ovy=Math.sin(elv)*R, ovz=Math.cos(az)*Math.cos(elv)*R;
    var lookX=0,lookY=2.5,lookZ=1.5;
    if(focusAmt>0.001 && activeI>=0){
      var fb=beacons[activeI], ea=easeOut(focusAmt);
      var fx=fb.wx, fy=EXH+fb.site.h*0.4, fz=fb.wz;
      var dx=ovx-fx, dy=ovy-fy, dz=ovz-fz, dl=Math.sqrt(dx*dx+dy*dy+dz*dz)||1;
      dx/=dl; dy=Math.max(dy/dl,0.44); dz/=dl;
      var fR=Math.max(52, baseR*0.50);
      camera.position.set(ovx+((fx+dx*fR)-ovx)*ea, ovy+((fy+dy*fR)-ovy)*ea, ovz+((fz+dz*fR)-ovz)*ea);
      lookX=fx*ea; lookY=2.5+(fy-2.5)*ea; lookZ=1.5+(fz-1.5)*ea;
    } else {
      camera.position.set(ovx,ovy,ovz);
    }
    camera.lookAt(lookX,lookY,lookZ);

    for(var i=0;i<beacons.length;i++){
      var b=beacons[i];
      b.hlT = (b.idx===focusI || b.idx===hoverI)?1:0;
      var dim = (activeI>=0 && b.idx!==activeI) ? (1-0.88*focusAmt) : 1;
      var si = easeOut(Math.max(0, Math.min(1, intro*1.9 - b.idx*0.09)));
      b.grp.scale.y=Math.max(0.0001,si);
      b.hl+=(b.hlT-b.hl)*kHl;
      for(var j=0;j<b.mats.length;j++){
        b.mats[j].uniforms.uT.value=T;
        b.mats[j].uniforms.uOp.value=(j===0?(b.site.t==='siege'?0.34:0.26):(b.site.t==='siege'?0.9:0.75))*(0.35+0.65*si)*(1+b.hl*0.8)*dim;
      }
      for(var k=0;k<b.rings.length;k++){
        var rg=b.rings[k];
        var ph=(T*0.42+rg.userData.ph)%1;
        var sc=rg.userData.base*(0.25+ph*2.6);
        rg.scale.set(sc,sc,1);
        rg.material.opacity=(1-ph)*0.55*si*(1+b.hl*0.7)*dim;
      }
      var isActive = (b.idx===activeI && focusAmt>0.02);
      var isSiege  = (b.site.t==='siege');
      var isHover = (b.idx===hoverI && !isActive);
      var wantLabel = isActive || isSiege || isHover;
      V.set(b.wx,b.topY,b.wz).project(camera);
      if(V.z<1 && si>0.35 && wantLabel){
        var lx=(V.x*0.5+0.5)*cw + b.site.ldx;
        var ly=(-V.y*0.5+0.5)*ch + b.site.ldy;
        b.el.style.transform='translate(-50%,-100%) translate('+lx.toFixed(1)+'px,'+ly.toFixed(1)+'px)';
        var lop;
        if(isActive){
          lop = easeOut(focusAmt);
        } else if(isHover){
          lop = 1;
        } else {
          lop = (activeI>=0 && activeI!==b.idx) ? (1-0.78*focusAmt) : 1;
        }
        b.el.style.opacity = Math.min(1,(si-0.35)*2.2) * lop;
        b.el.classList.toggle('on', isActive);
        b.el.style.zIndex = isActive?6:(isSiege?4:1);
      }else{
        b.el.style.opacity=0;
        b.el.classList.remove('on');
      }
    }

    for(var p=0;p<pulses.length;p++){
      var pu=pulses[p];
      var t=(T*pu.v+pu.ph)%1;
      pu.curve.getPoint(t,V);
      pu.sp.position.copy(V);
      pu.sp.material.opacity=Math.pow(Math.sin(t*Math.PI),0.7)*0.85*e;
    }

    hqLight.intensity=(1.0+0.25*Math.sin(T*1.7))*((activeI>=0 && SITES[activeI].t!=='siege')?(1-0.8*focusAmt):1);
    renderer.render(scene,camera);
    if(!box.classList.contains('ready')){ box.classList.add('ready'); scheduleHeight(); }
  }

  var running=false;
  function play(){ if(raf3===null && running && !document.hidden){ clock.getDelta(); raf3=requestAnimationFrame(tick); } }
  function pause(){ if(raf3!==null){ cancelAnimationFrame(raf3); raf3=null; } }
  document.addEventListener('visibilitychange',function(){ document.hidden?pause():(running&&play()); });

  function boot(){
    if(!initMap()){ return; }
    running=true; started=true; resize(); play();
    scheduleHeight();
  }
  if(document.readyState==='complete') boot();
  else window.addEventListener('load',boot);

  }catch(err){ buildFallback(); }

  /* ===== hauteur communiquée au parent (index.html attend {type:'carte3dHeight', h}) ===== */
  var heightRaf=null;
  function sendHeight(){
    var pg = document.querySelector('.page'); var h = pg ? Math.ceil(pg.getBoundingClientRect().height) : document.documentElement.scrollHeight;
    try{ parent.postMessage({type:'carte3dHeight', h:h}, '*'); }catch(e){}
  }
  function scheduleHeight(){
    if(heightRaf) return;
    heightRaf = requestAnimationFrame(function(){ heightRaf=null; sendHeight(); });
  }
  window.addEventListener('load',scheduleHeight);
  window.addEventListener('resize',scheduleHeight,{passive:true});
  if(window.ResizeObserver){
    new ResizeObserver(scheduleHeight).observe(document.body);
  }
  scheduleHeight();
})();
</script>
</body>
