<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FX-BANK · Page Load Reveal</title>
<!--
/* FX-BANK · PAGE LOAD REVEAL
   QUOI : La séquence d'ouverture. Un volet couvre l'écran, une barre de chargement se remplit,
          le volet se retire par le haut et le premier écran arrive en cascade derrière lui.
   QUAND : Une seule fois, sur la page d'accueil. C'est la première impression — et c'est aussi
           le meilleur moyen de faire fuir quelqu'un si c'est trop long.
   ⚠️ RÈGLE DE DURÉE : 900 ms maximum, volet compris. Au-delà, ce n'est plus une ouverture,
      c'est une attente. Un visiteur qui revient une deuxième fois la subit.
   DEPENDANCES : aucune
   SAFARI : conforme. Aucun flou, aucun verre dépoli, aucun dégradé découpé dans du texte.
            Uniquement transform et opacity.
   ⚠️ FILET DOUBLE — c'est le composant le plus dangereux de la banque :
      1. le volet se retire au chargement ET au bout d'un délai maximum, même si une image
         traîne. Un volet qui reste, c'est une page définitivement blanche.
      2. le contenu n'est masqué QUE si le script a démarré (classe posée sur <html>).
         Script cassé = page normale, lisible, sans animation.
   COPIER : le bloc entre FX:COPY:START et FX:COPY:END */
-->
<style>
  body{margin:0;background:#FBFCFE;color:#0E1626;font:16px/1.6 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
  .demo-note{position:fixed;left:16px;bottom:16px;z-index:90;font-size:12px;letter-spacing:.1em;
    text-transform:uppercase;color:#8B96AC;background:#FBFCFE;padding:8px 12px;border:1px solid #DCE5F4}
  .relancer{position:fixed;right:16px;bottom:16px;z-index:90;font:inherit;font-size:13px;
    padding:10px 16px;border:1px solid #0050E6;background:#fff;color:#0050E6;border-radius:2px;cursor:pointer}

  /* FX:COPY:START */
  .fx-load{
    --fx-load-fond:#0A1020;          /* OPAQUE */
    --fx-load-accent:#0050E6;
    --fx-load-ink:#F8FAFC;
  }
  .fx-load__volet{
    position:fixed; inset:0; z-index:80; background:var(--fx-load-fond);
    display:grid; place-items:center; gap:22px;
    transform:translateY(0);
    transition:transform .62s cubic-bezier(.76,0,.24,1);
  }
  .fx-load__volet.est-parti{ transform:translateY(-100%) }

  .fx-load__marque{
    color:var(--fx-load-ink); font-size:clamp(1.3rem,4vw,2rem); font-weight:650;
    letter-spacing:-.02em; text-align:center;
  }
  .fx-load__barre{
    width:min(220px,42vw); height:2px; background:rgba(255,255,255,.16); overflow:hidden;
  }
  .fx-load__barre i{
    display:block; height:100%; background:var(--fx-load-accent);
    transform-origin:left; transform:scaleX(var(--p,0));
    transition:transform .3s ease;
  }

  /* Le contenu n'est décalé QUE si le script a démarré : c'est la classe .fx-load-actif
     posée sur <html> qui l'autorise. Sans script, tout est en place et lisible. */
  .fx-load-actif .fx-load__item{
    opacity:0; transform:translateY(22px);
  }
  .fx-load__item{
    transition:opacity .55s ease var(--d,0ms),
               transform .68s cubic-bezier(.22,.8,.25,1) var(--d,0ms);
  }
  .fx-load-actif .fx-load__item.est-entre{ opacity:1; transform:none }

  @media (prefers-reduced-motion: reduce){
    .fx-load__volet{ transition:none }
    .fx-load-actif .fx-load__item{ opacity:1; transform:none; transition:none }
  }
  /* FX:COPY:END */

  /* décor de la démo */
  .ecran{max-width:900px;margin:0 auto;padding:22vh 24px 0}
  .kick{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:#54607A;margin:0 0 10px}
  h1{font-size:clamp(2rem,6vw,3.6rem);line-height:1.08;letter-spacing:-.025em;margin:0 0 18px}
  h1 em{font-style:normal;color:#0050E6}
  .intro{color:#54607A;max-width:56ch;margin:0 0 26px}
  .btn{display:inline-block;padding:12px 22px;background:#0050E6;color:#fff;text-decoration:none;border-radius:2px;font-weight:600;font-size:14px}
</style>
</head>
<body>

<!-- FX:COPY:START -->
<div class="fx-load__volet" data-fx-load>
  <div class="fx-load__marque">Intégral Pharma</div>
  <div class="fx-load__barre"><i></i></div>
</div>

<script>
(function(){
  var volet = document.querySelector('[data-fx-load]');
  if (!volet) return;

  // On n'autorise le décalage du contenu qu'une fois le script en marche : si ce fichier
  // ne se charge pas, la page reste entièrement lisible au lieu d'être vide.
  document.documentElement.classList.add('fx-load-actif');

  var barre  = volet.querySelector('.fx-load__barre i');
  var reduit = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var fini   = false;

  function entrer(){
    var items = Array.prototype.slice.call(document.querySelectorAll('.fx-load__item'));
    items.forEach(function(el, i){
      el.style.setProperty('--d', (i * 90) + 'ms');
      el.classList.add('est-entre');
    });
  }

  function retirer(){
    if (fini) return;
    fini = true;
    if (barre) barre.style.setProperty('--p', 1);
    volet.classList.add('est-parti');
    // le contenu part juste avant la fin du volet : les deux mouvements se recouvrent,
    // c'est ce recouvrement qui donne l'impression d'un seul geste
    setTimeout(entrer, reduit ? 0 : 180);
    setTimeout(function(){ volet.style.display = 'none'; }, reduit ? 0 : 900);
  }

  // progression indicative, purement visuelle
  var p = 0;
  var tic = setInterval(function(){
    p = Math.min(0.92, p + Math.random() * 0.22);
    if (barre) barre.style.setProperty('--p', p.toFixed(2));
    if (fini) clearInterval(tic);
  }, 110);

  if (reduit) { retirer(); return; }

  window.addEventListener('load', retirer);
  // ⚠️ Filet : même si une image ne se charge jamais, le volet part. Un volet qui reste,
  // c'est une page blanche définitive — le pire défaut possible.
  setTimeout(retirer, 1400);
})();
</script>
<!-- FX:COPY:END -->

<main class="ecran">
  <p class="kick fx-load__item">Un partenaire, pas un fournisseur</p>
  <h1 class="fx-load__item">Neuf maisons.<br><em>Un seul nom.</em></h1>
  <p class="intro fx-load__item">Chacune livre sa région depuis des années, avec ses équipes et
  ses habitudes. Votre commande part toujours de la plus proche de votre comptoir.</p>
  <a class="btn fx-load__item" href="#">Découvrir le réseau</a>
</main>

<button class="relancer" onclick="location.reload()">Rejouer l'ouverture</button>
<div class="demo-note">page-load-reveal · 900 ms, pas plus</div>

</body>
</html>
