<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FX-BANK · Before After</title>
<!--
/* FX-BANK · BEFORE AFTER
   QUOI : Deux images superposées, une poignée qu'on fait glisser pour révéler l'avant et l'après.
          Fonctionne à la souris, au doigt ET aux flèches du clavier.
   QUAND : Un agencement d'officine avant / après, une façade rénovée, un comptoir réaménagé.
           C'est l'argument de vente le plus direct qui existe : on ne le raconte pas, on le montre.
   DEPENDANCES : aucune
   SAFARI : conforme. Aucun flou, aucun verre dépoli, aucun dégradé découpé dans du texte.
            La révélation se fait par un rognage rectangulaire, pas par un masque animé.
   ⚠️ Le rognage NE dépend d'aucune classe posée par un script d'apparition : la valeur de départ
      est écrite dans le CSS, donc les deux images sont visibles même si le JS ne tourne pas.
   ACCESSIBILITE : la poignée est un vrai curseur (role slider), pilotable aux flèches, avec
                   aria-valuenow tenu à jour.
   COPIER : le bloc entre FX:COPY:START et FX:COPY:END */
-->
<style>
  body{margin:0;background:#FBFCFE;color:#0E1626;font:16px/1.6 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
  .demo-note{position:fixed;left:16px;bottom:16px;z-index:50;font-size:12px;letter-spacing:.1em;
    text-transform:uppercase;color:#8B96AC;background:#FBFCFE;padding:8px 12px;border:1px solid #DCE5F4}
  .titre{max-width:900px;margin:56px auto 20px;padding:0 24px}
  .titre h2{font-size:1.6rem;letter-spacing:-.02em;margin:0 0 8px}
  .titre p{margin:0;color:#54607A;font-size:.95rem}

  /* FX:COPY:START */
  .fx-ba{
    --fx-ba-accent:#0050E6;
    --fx-ba-poignee:56px;
    --p:50;                            /* position de la poignée, en % */
    position:relative; max-width:900px; margin:0 auto; aspect-ratio:16/10;
    overflow:hidden; border-radius:2px; user-select:none; touch-action:pan-y;
    background:#0A1020;
  }
  .fx-ba img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block;
    pointer-events:none;
  }
  /* L'image « après » est rognée à droite de la poignée. Valeur de départ dans le CSS :
     si le script ne tourne pas, on voit la moitié de chaque image, ce qui reste parlant. */
  .fx-ba__apres{
    clip-path:inset(0 0 0 calc(var(--p) * 1%));
  }
  .fx-ba__trait{
    position:absolute; top:0; bottom:0; left:calc(var(--p) * 1%);
    width:2px; background:#fff; transform:translateX(-1px); pointer-events:none;
    box-shadow:0 0 0 1px rgba(10,16,32,.18);
  }
  .fx-ba__poignee{
    position:absolute; top:50%; left:calc(var(--p) * 1%);
    width:var(--fx-ba-poignee); height:var(--fx-ba-poignee); margin:0;
    transform:translate(-50%,-50%);
    border:0; padding:0; border-radius:50%; background:#fff; cursor:ew-resize;
    box-shadow:0 6px 20px -6px rgba(10,16,32,.55);
    display:grid; place-items:center; color:var(--fx-ba-accent);
  }
  .fx-ba__poignee:focus-visible{ outline:3px solid var(--fx-ba-accent); outline-offset:3px }
  .fx-ba__poignee svg{ width:22px; height:22px }
  .fx-ba__etiq{
    position:absolute; top:16px; font-size:11.5px; font-weight:650; letter-spacing:.12em;
    text-transform:uppercase; color:#fff; background:rgba(10,16,32,.62);
    padding:6px 11px; border-radius:2px; pointer-events:none;
  }
  .fx-ba__etiq--a{ left:16px }
  .fx-ba__etiq--b{ right:16px }

  @media (prefers-reduced-motion: reduce){
    .fx-ba__poignee{ transition:none }
  }
  /* FX:COPY:END */
</style>
</head>
<body>

<div class="titre">
  <h2>Avant / après</h2>
  <p>Glisser la poignée, ou la sélectionner au clavier et utiliser les flèches.</p>
</div>

<!-- FX:COPY:START -->
<div class="fx-ba" data-fx-ba>
  <!-- Les deux visuels sont des SVG intégrés : aucune requête réseau. Les remplacer par
       les vraies photos, en gardant EXACTEMENT le même cadrage — sinon la comparaison ment. -->
  <img class="fx-ba__avant" alt="Avant travaux"
    src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 500'%3E%3Crect width='800' height='500' fill='%23AAB4C4'/%3E%3Crect x='60' y='300' width='680' height='140' fill='%238C97A9'/%3E%3Crect x='90' y='180' width='180' height='120' fill='%239BA6B7'/%3E%3Crect x='530' y='180' width='180' height='120' fill='%239BA6B7'/%3E%3Ctext x='400' y='110' text-anchor='middle' font-family='system-ui,sans-serif' font-size='30' font-weight='600' fill='%23FFF' opacity='.75'%3EAVANT%3C/text%3E%3C/svg%3E">
  <img class="fx-ba__apres" alt="Après travaux"
    src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 500'%3E%3Cdefs%3E%3ClinearGradient id='c' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23F5F8FE'/%3E%3Cstop offset='1' stop-color='%23DCE5F4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='800' height='500' fill='url(%23c)'/%3E%3Crect x='60' y='300' width='680' height='140' fill='%230050E6'/%3E%3Crect x='90' y='170' width='180' height='130' fill='%23FFF'/%3E%3Crect x='310' y='170' width='180' height='130' fill='%23FFF'/%3E%3Crect x='530' y='170' width='180' height='130' fill='%23FFF'/%3E%3Ctext x='400' y='110' text-anchor='middle' font-family='system-ui,sans-serif' font-size='30' font-weight='600' fill='%230050E6'%3EAPRÈS%3C/text%3E%3C/svg%3E">

  <span class="fx-ba__etiq fx-ba__etiq--a">Avant</span>
  <span class="fx-ba__etiq fx-ba__etiq--b">Après</span>
  <div class="fx-ba__trait"></div>

  <button class="fx-ba__poignee" type="button"
          role="slider" aria-label="Comparer avant et après"
          aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 6L4 12l5 6M15 6l5 6-5 6"/>
    </svg>
  </button>
</div>

<script>
(function(){
  document.querySelectorAll('[data-fx-ba]').forEach(function(bloc){
    var poignee = bloc.querySelector('.fx-ba__poignee');
    if (!poignee) return;
    var p = 50, glisse = false;

    function poser(v){
      p = Math.min(100, Math.max(0, v));
      bloc.style.setProperty('--p', p.toFixed(2));
      poignee.setAttribute('aria-valuenow', Math.round(p));
    }

    function depuisX(clientX){
      var r = bloc.getBoundingClientRect();
      poser(((clientX - r.left) / r.width) * 100);
    }

    // souris
    bloc.addEventListener('pointerdown', function(e){
      glisse = true; bloc.setPointerCapture(e.pointerId); depuisX(e.clientX);
    });
    bloc.addEventListener('pointermove', function(e){ if (glisse) depuisX(e.clientX); });
    bloc.addEventListener('pointerup',     function(){ glisse = false; });
    bloc.addEventListener('pointercancel', function(){ glisse = false; });

    // clavier : sans ça, la comparaison est inaccessible à qui n'utilise pas de souris
    poignee.addEventListener('keydown', function(e){
      var pas = e.shiftKey ? 10 : 2;
      if (e.key === 'ArrowLeft')  { poser(p - pas); e.preventDefault(); }
      if (e.key === 'ArrowRight') { poser(p + pas); e.preventDefault(); }
      if (e.key === 'Home')       { poser(0);   e.preventDefault(); }
      if (e.key === 'End')        { poser(100); e.preventDefault(); }
    });

    poser(50);
  });
})();
</script>
<!-- FX:COPY:END -->

<div style="height:30vh"></div>
<div class="demo-note">before-after · glisser pour comparer</div>

</body>
</html>
