<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FX-BANK · Custom Cursor</title>
<!--
/* FX-BANK · CUSTOM CURSOR
   QUOI : Curseur maison (point + halo) qui suit la souris en lerp et grossit au survol des éléments interactifs.
   QUAND : Sites vitrine premium, portfolio, landing « effet Awwwards ».
   DEPENDANCES : aucune.
   SAFARI : aucun background-clip:text / backdrop-filter / filter:blur. reduced-motion géré. Caché sur tactile.
   COPIER : le bloc entre <!-- FX:COPY:START --> et <!-- FX:COPY:END --> */
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #0A0E1A; color: #F8FAFC;
    min-height: 100vh; display: grid; place-content: center; gap: 26px; padding: 40px; text-align: center; }
  .demo-h { font-size: clamp(26px, 6vw, 48px); letter-spacing: -.03em; }
  .demo-p { opacity: .6; max-width: 460px; margin: 0 auto; line-height: 1.6; }
  .demo-row { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
  .demo-btn { padding: 14px 26px; border-radius: 999px; border: 1px solid rgba(255,255,255,.2);
    background: transparent; color: #F8FAFC; font-size: 15px; font-weight: 600; cursor: pointer; }
  .demo-btn--fill { background: #F39A1B; color: #0A0E1A; border-color: #F39A1B; }
  a.demo-link { color: #0050E6; font-weight: 700; }
  .demo-note { font-size: 13px; opacity: .4; margin-top: 30px; }
</style>
</head>
<body>
  <h1 class="demo-h">Bouge la souris.</h1>
  <p class="demo-p">Le halo suit en douceur et <strong>grossit</strong> au survol des éléments marqués <code>data-cursor</code>.</p>
  <div class="demo-row">
    <button class="demo-btn" data-cursor>Un bouton</button>
    <button class="demo-btn demo-btn--fill" data-cursor>Call to action</button>
    <a href="#" class="demo-link" data-cursor>et un lien</a>
  </div>
  <p class="demo-note">Sur mobile / écran tactile, le curseur maison est automatiquement désactivé.</p>

  <!-- FX:COPY:START -->
  <!-- ============ FX CUSTOM CURSOR ============ -->
  <style>
    /* Couleurs à changer via les variables ci-dessous */
    .fxcur{
      --fx-dot:#F39A1B;      /* point central */
      --fx-halo:#0050E6;     /* anneau qui suit */
      --fx-halo-size:34px;   /* taille repos du halo */
      --fx-halo-hover:64px;  /* taille au survol */
    }
    /* On masque le curseur système une fois le mode actif (classe posée par le JS) */
    .fxcur-on, .fxcur-on * { cursor:none; }
    .fxcur__dot, .fxcur__halo{
      position:fixed; top:0; left:0; border-radius:50%; pointer-events:none; z-index:9999;
      transform:translate(-50%,-50%); will-change:transform;
    }
    .fxcur__dot{ width:7px; height:7px; background:var(--fx-dot); }
    .fxcur__halo{ width:var(--fx-halo-size); height:var(--fx-halo-size);
      border:1.5px solid var(--fx-halo);
      transition:width .25s ease, height .25s ease, background .25s ease, border-color .25s ease; }
    .fxcur__halo.is-hover{ width:var(--fx-halo-hover); height:var(--fx-halo-hover);
      background:color-mix(in srgb, var(--fx-halo) 14%, transparent); }
    @media (prefers-reduced-motion: reduce){ .fxcur__halo{ transition:none; } }
  </style>

  <div class="fxcur">
    <div class="fxcur__halo" id="fxcurHalo" aria-hidden="true"></div>
    <div class="fxcur__dot" id="fxcurDot" aria-hidden="true"></div>
  </div>

  <script>
  (function(){
    // Désactive sur tactile ou reduced-motion : on garde le curseur système.
    var touch = window.matchMedia('(pointer: coarse)').matches;
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var dot=document.getElementById('fxcurDot');
    var halo=document.getElementById('fxcurHalo');
    if(touch || !dot || !halo){
      if(dot) dot.style.display='none'; if(halo) halo.style.display='none';
      return;
    }
    document.documentElement.classList.add('fxcur-on');

    var mx=innerWidth/2, my=innerHeight/2;   // position souris
    var hx=mx, hy=my;                          // position halo (lerpée)
    window.addEventListener('mousemove',function(e){ mx=e.clientX; my=e.clientY; },{passive:true});

    // Grossir au survol de tout élément [data-cursor] (ou lien/bouton natif)
    document.addEventListener('mouseover',function(e){
      if(e.target.closest('[data-cursor], a, button')) halo.classList.add('is-hover');
    });
    document.addEventListener('mouseout',function(e){
      if(e.target.closest('[data-cursor], a, button')) halo.classList.remove('is-hover');
    });

    var lerp = reduce ? 1 : 0.18; // reduced-motion = pas de traînée
    (function loop(){
      hx += (mx-hx)*lerp; hy += (my-hy)*lerp;
      dot.style.transform  = 'translate('+mx+'px,'+my+'px) translate(-50%,-50%)';
      halo.style.transform = 'translate('+hx+'px,'+hy+'px) translate(-50%,-50%)';
      requestAnimationFrame(loop);
    })();

    // Cache le curseur quand la souris quitte la fenêtre
    document.addEventListener('mouseleave',function(){ dot.style.opacity=0; halo.style.opacity=0; });
    document.addEventListener('mouseenter',function(){ dot.style.opacity=1; halo.style.opacity=1; });
  })();
  </script>
  <!-- ============ /FX CUSTOM CURSOR ============ -->
  <!-- FX:COPY:END -->
</body>
</html>
