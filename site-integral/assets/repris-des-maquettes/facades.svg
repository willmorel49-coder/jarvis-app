<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!--
    Dix façades dessinées, une par implantation.

    Pourquoi dessinées et pas photographiées : nous n'avons de photo que
    du siège d'Hyères. Mettre une photo de banque d'images derrière une
    porte reviendrait à montrer un bâtiment qui n'est pas le vôtre — un
    mensonge visuel sur un support public. Chaque façade est donc une
    ligne claire, distincte, et honnête : elle évoque un site de
    répartition sans prétendre être une photo.

    À remplacer par les vraies photos dès que vous les avez.
    Traits en bleu de marque, accents en orange. Aucun effet interdit.
  -->
  <defs>
    <!-- Les couleurs passent par des variables CSS avec repli sur la
         charte Intégral. Les variables personnalisées traversent la
         frontière du <use>, contrairement aux règles de classe : chaque
         façade prend donc automatiquement les couleurs du système de
         design chargé par la page. -->
    <style>
      .m { fill: none; stroke: var(--accent, #0050e6); stroke-opacity: .55; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
      .f { fill: var(--accent, #0050e6); fill-opacity: .05; }
      .o { fill: var(--meta, #f39a1b); fill-opacity: .85; }
      .g { fill: none; stroke: var(--accent, #0050e6); stroke-opacity: .22; stroke-width: 1; }
      .s { fill: var(--accent, #0050e6); fill-opacity: .14; }
    </style>
  </defs>

  <!-- 1 · Hyères Pharma — le siège : long bâtiment, panneaux solaires, auvent -->
  <symbol id="f1" viewBox="0 0 120 160">
    <path class="g" d="M0 132 H120" />
    <path class="f" d="M14 78 H106 V132 H14 Z" />
    <path class="m" d="M14 78 H106 V132 H14 Z" />
    <path class="m" d="M14 78 L24 66 H116 L106 78" />
    <path class="s" d="M30 69 H62 V75 H30 Z M68 69 H104 V75 H68 Z" />
    <path class="m" d="M8 100 H112" />
    <path class="m" d="M26 104 H42 V132 H26 Z M52 104 H68 V132 H52 Z M78 104 H94 V132 H78 Z" />
    <rect class="o" x="26" y="126" width="16" height="3" />
    <path class="g" d="M0 140 C24 136 44 144 68 138 S104 142 120 138" />
  </symbol>

